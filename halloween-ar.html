<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🎃 ハロウィンARフォトスポット</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: sans-serif;
        touch-action: none;
    }

    #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
    }

    /* 上部タイトル */
    #title {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);

        padding: 8px 16px;
        border-radius: 20px;

        color: white;
        background: rgba(0, 0, 0, 0.45);

        font-size: 15px;
        font-weight: bold;

        white-space: nowrap;
    }

    /* 操作説明 */
    #help {
        position: absolute;
        top: 55px;
        left: 50%;
        transform: translateX(-50%);

        padding: 6px 12px;
        border-radius: 15px;

        color: white;
        background: rgba(0, 0, 0, 0.35);

        font-size: 12px;

        white-space: nowrap;
    }

    /* 下部ボタン */
    #buttons {
        position: absolute;

        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);

        display: flex;
        gap: 10px;

        padding: 10px;

        border-radius: 22px;

        background: rgba(0, 0, 0, 0.45);

        pointer-events: auto;
    }

    .model-button {
        width: 62px;
        height: 62px;

        border: 2px solid rgba(255,255,255,0.6);
        border-radius: 18px;

        background: rgba(255,255,255,0.15);

        color: white;

        font-size: 28px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        transition: 0.15s;
    }

    .model-button span {
        font-size: 10px;
        margin-top: 2px;
    }

    .model-button.active {
        background: rgba(255, 180, 50, 0.75);
        border-color: white;

        transform: scale(1.05);
    }

    .model-button:active {
        transform: scale(0.95);
    }

    /* 読み込み表示 */
    #loading {
        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        padding: 14px 22px;

        border-radius: 20px;

        color: white;
        background: rgba(0,0,0,0.65);

        font-size: 15px;

        text-align: center;
    }

    /* AR開始後に隠す */
    #loading.hidden {
        display: none;
    }

    /* AR非対応 */
    #message {
        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        width: 85%;

        padding: 20px;

        border-radius: 20px;

        background: rgba(0,0,0,0.75);
        color: white;

        text-align: center;

        display: none;
    }

    #message.show {
        display: block;
    }
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="ui">

    <div id="title">
        🎃 ハロウィンARフォトスポット
    </div>

    <div id="help">
        1本指：移動　　2本指：拡大・縮小・回転
    </div>

    <div id="buttons">

        <button class="model-button" data-model="ghost">
            👻
            <span>おばけ</span>
        </button>

        <button class="model-button" data-model="pumpkin">
            🎃
            <span>かぼちゃ</span>
        </button>

        <button class="model-button" data-model="witch">
            🧙
            <span>帽子</span>
        </button>

        <button class="model-button" data-model="bat">
            🦇
            <span>コウモリ</span>
        </button>

    </div>

    <div id="loading">
        3Dモデルを読み込んでいます…
    </div>

    <div id="message"></div>

</div>


<script type="module">

import * as THREE from "three";

import { GLTFLoader }
    from "three/addons/loaders/GLTFLoader.js";

import { ARButton }
    from "three/addons/webxr/ARButton.js";


// =========================================================
// 基本設定
// =========================================================

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);


const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


// =========================================================
// ライト
// =========================================================

const ambientLight = new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    2.5
);

scene.add(ambientLight);


const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    2
);

directionalLight.position.set(
    2,
    4,
    2
);

directionalLight.castShadow = true;

scene.add(directionalLight);


// =========================================================
// AR開始ボタン
// =========================================================

const arButton = ARButton.createButton(
    renderer,
    {
        requiredFeatures: [
            "dom-overlay"
        ],

        domOverlay: {
            root: document.body
        }
    }
);

arButton.style.bottom = "95px";

document.body.appendChild(arButton);


// =========================================================
// モデル
// =========================================================

const loader = new GLTFLoader();

const models = {

    ghost: {
        file: "./ghost.glb",
        emoji: "👻",
        name: "おばけ",
        object: null,
        visible: false,
        scale: 0.7
    },

    pumpkin: {
        file: "./pumpkin.glb",
        emoji: "🎃",
        name: "かぼちゃ",
        object: null,
        visible: false,
        scale: 0.7
    },

    witch: {
        file: "./witch-hat.glb",
        emoji: "🧙",
        name: "帽子",
        object: null,
        visible: false,
        scale: 0.7
    },

    bat: {
        file: "./bat.glb",
        emoji: "🦇",
        name: "コウモリ",
        object: null,
        visible: false,
        scale: 0.7
    }

};


// =========================================================
// モデル読み込み
// =========================================================

let loadedCount = 0;

const modelKeys = Object.keys(models);


for (const key of modelKeys) {

    const data = models[key];

    loader.load(

        data.file,

        (gltf) => {

            const object = gltf.scene;

            object.visible = false;

            object.scale.setScalar(
                data.scale
            );

            object.traverse((child) => {

                if (child.isMesh) {

                    child.castShadow = true;
                    child.receiveShadow = true;

                }

            });

            data.object = object;

            scene.add(object);

            loadedCount++;

            updateLoading();

        },

        undefined,

        (error) => {

            console.error(
                "モデル読み込みエラー:",
                data.file,
                error
            );

            loadedCount++;

            updateLoading();

        }
    );
}


// =========================================================
// 読み込み表示
// =========================================================

function updateLoading() {

    const loading =
        document.getElementById("loading");

    if (loadedCount >= modelKeys.length) {

        loading.classList.add("hidden");

    } else {

        loading.textContent =
            `3Dモデルを読み込んでいます… ${loadedCount}/${modelKeys.length}`;

    }
}


// =========================================================
// モデルをカメラの前に出す
// =========================================================

function placeInFront(object) {

    if (!object) return;

    const direction =
        new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    const cameraPosition =
        new THREE.Vector3();

    camera.getWorldPosition(
        cameraPosition
    );

    /*
     * カメラから約1.5m前
     */

    object.position.copy(
        cameraPosition
    );

    object.position.add(
        direction.multiplyScalar(1.5)
    );

    /*
     * 少し下げる
     */

    object.position.y -= 0.05;

    /*
     * 正面を向ける
     */

    object.rotation.set(
        0,
        camera.rotation.y,
        0
    );

}


// =========================================================
// ボタン
// =========================================================

document
    .querySelectorAll(".model-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const key =
                    button.dataset.model;

                toggleModel(key);

            }
        );

    });


function toggleModel(key) {

    const data = models[key];

    if (!data || !data.object) return;


    /*
     * すでに表示中
     * → 消す
     */

    if (data.visible) {

        data.object.visible = false;

        data.visible = false;

        document
            .querySelector(
                `[data-model="${key}"]`
            )
            .classList.remove("active");

        return;
    }


    /*
     * 初めて表示
     * → カメラ前に配置
     */

    placeInFront(
        data.object
    );

    data.object.visible = true;

    data.visible = true;

    document
        .querySelector(
            `[data-model="${key}"]`
        )
        .classList.add("active");

}


// =========================================================
// タッチ操作
// =========================================================

const raycaster =
    new THREE.Raycaster();

const pointer =
    new THREE.Vector2();

let selectedObject = null;


/*
 * 1本指ドラッグ用
 */

let dragStartX = 0;
let dragStartY = 0;

let dragStartPosition =
    new THREE.Vector3();


/*
 * 2本指操作用
 */

let pinchStartDistance = 0;

let pinchStartScale = 1;

let rotateStartAngle = 0;

let rotateStartY = 0;


function getVisibleObjects() {

    const result = [];

    for (const key of modelKeys) {

        const data = models[key];

        if (
            data.object &&
            data.visible
        ) {

            result.push(
                data.object
            );

        }

    }

    return result;

}


/*
 * 指の位置から3Dモデルを探す
 */

function selectObject(x, y) {

    pointer.x =
        (x / window.innerWidth) * 2 - 1;

    pointer.y =
        -(y / window.innerHeight) * 2 + 1;


    raycaster.setFromCamera(
        pointer,
        camera
    );


    const objects =
        getVisibleObjects();


    const intersects =
        raycaster.intersectObjects(
            objects,
            true
        );


    if (intersects.length === 0) {

        return null;

    }


    let object =
        intersects[0].object;


    /*
     * GLB内部のMeshから
     * モデル本体まで戻る
     */

    while (
        object.parent &&
        !objects.includes(object)
    ) {

        object =
            object.parent;

    }


    return object;

}


// =========================================================
// タッチ開始
// =========================================================

renderer.domElement.addEventListener(
    "touchstart",
    (event) => {

        event.preventDefault();

        const touches =
            event.touches;


        if (touches.length === 1) {

            const touch =
                touches[0];


            /*
             * モデルを選択
             */

            selectedObject =
                selectObject(
                    touch.clientX,
                    touch.clientY
                );


            if (selectedObject) {

                dragStartX =
                    touch.clientX;

                dragStartY =
                    touch.clientY;

                dragStartPosition.copy(
                    selectedObject.position
                );

            }

        }


        /*
         * 2本指開始
         */

        if (
            touches.length === 2 &&
            selectedObject
        ) {

            const t1 =
                touches[0];

            const t2 =
                touches[1];


            pinchStartDistance =
                getDistance(
                    t1,
                    t2
                );


            pinchStartScale =
                selectedObject.scale.x;


            rotateStartAngle =
                getAngle(
                    t1,
                    t2
                );


            rotateStartY =
                selectedObject.rotation.y;

        }

    },
    {
        passive: false
    }
);


// =========================================================
// タッチ移動
// =========================================================

renderer.domElement.addEventListener(
    "touchmove",
    (event) => {

        event.preventDefault();


        if (!selectedObject) return;


        const touches =
            event.touches;


        /*
         * =====================================
         * 1本指 → 移動
         * =====================================
         */

        if (touches.length === 1) {

            const touch =
                touches[0];


            const dx =
                touch.clientX -
                dragStartX;


            const dy =
                touch.clientY -
                dragStartY;


            moveObjectByScreen(
                selectedObject,
                dx,
                dy
            );


            dragStartX =
                touch.clientX;

            dragStartY =
                touch.clientY;

        }


        /*
         * =====================================
         * 2本指
         * → 拡大縮小
         * → 回転
         * =====================================
         */

        if (touches.length === 2) {

            const t1 =
                touches[0];

            const t2 =
                touches[1];


            /*
             * 拡大縮小
             */

            const distance =
                getDistance(
                    t1,
                    t2
                );


            if (
                pinchStartDistance > 0
            ) {

                const ratio =
                    distance /
                    pinchStartDistance;


                let newScale =
                    pinchStartScale *
                    ratio;


                /*
                 * 大きくなりすぎないよう制限
                 */

                newScale =
                    THREE.MathUtils.clamp(
                        newScale,
                        0.15,
                        3.0
                    );


                selectedObject.scale.setScalar(
                    newScale
                );

            }


            /*
             * 回転
             */

            const angle =
                getAngle(
                    t1,
                    t2
                );


            const angleDelta =
                angle -
                rotateStartAngle;


            selectedObject.rotation.y =
                rotateStartY -
                angleDelta;

        }

    },
    {
        passive: false
    }
);


// =========================================================
// タッチ終了
// =========================================================

renderer.domElement.addEventListener(
    "touchend",
    (event) => {

        event.preventDefault();


        if (
            event.touches.length === 0
        ) {

            selectedObject = null;

        }

    },
    {
        passive: false
    }
);


// =========================================================
// 2点間距離
// =========================================================

function getDistance(
    a,
    b
) {

    const dx =
        a.clientX -
        b.clientX;

    const dy =
        a.clientY -
        b.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


// =========================================================
// 2点間角度
// =========================================================

function getAngle(
    a,
    b
) {

    return Math.atan2(
        b.clientY - a.clientY,
        b.clientX - a.clientX
    );

}


// =========================================================
// 画面上のドラッグを3D空間の移動に変換
// =========================================================

function moveObjectByScreen(
    object,
    dx,
    dy
) {

    /*
     * オブジェクトとカメラの距離
     */

    const cameraPosition =
        new THREE.Vector3();

    camera.getWorldPosition(
        cameraPosition
    );


    const distance =
        cameraPosition.distanceTo(
            object.position
        );


    /*
     * 画面の左右方向
     */

    const right =
        new THREE.Vector3();

    right.setFromMatrixColumn(
        camera.matrixWorld,
        0
    );


    /*
     * 画面の上下方向
     */

    const up =
        new THREE.Vector3();

    up.setFromMatrixColumn(
        camera.matrixWorld,
        1
    );


    /*
     * ドラッグ量を
     * 3D空間の距離へ変換
     */

    const scale =
        distance *
        0.0015;


    object.position.add(
        right.multiplyScalar(
            dx * scale
        )
    );


    object.position.add(
        up.multiplyScalar(
            -dy * scale
        )
    );

}


// =========================================================
// リサイズ
// =========================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// =========================================================
// XRセッション開始
// =========================================================

renderer.xr.addEventListener(
    "sessionstart",
    () => {

        console.log(
            "AR session started"
        );

    }
);


// =========================================================
// XRセッション終了
// =========================================================

renderer.xr.addEventListener(
    "sessionend",
    () => {

        /*
         * 全モデルを消す
         */

        for (const key of modelKeys) {

            const data =
                models[key];

            if (data.object) {

                data.object.visible =
                    false;

            }

            data.visible = false;


            const button =
                document.querySelector(
                    `[data-model="${key}"]`
                );

            if (button) {

                button.classList.remove(
                    "active"
                );

            }

        }

    }
);


// =========================================================
// アニメーション
// =========================================================

const clock =
    new THREE.Clock();


function animate() {

    const elapsed =
        clock.getElapsedTime();


    /*
     * おばけ
     * 少しフワフワ
     */

    if (
        models.ghost.object &&
        models.ghost.visible
    ) {

        models.ghost.object.position.y +=
            Math.sin(elapsed * 2) *
            0.0008;

    }


    /*
     * コウモリ
     * 少し上下
     */

    if (
        models.bat.object &&
        models.bat.visible
    ) {

        models.bat.object.position.y +=
            Math.sin(elapsed * 3) *
            0.0007;

    }


    renderer.render(
        scene,
        camera
    );

}


renderer.setAnimationLoop(
    animate
);


// =========================================================
// WebXR対応チェック
// =========================================================

if (!navigator.xr) {

    const message =
        document.getElementById(
            "message"
        );

    message.innerHTML =
        "この端末・ブラウザではARを利用できません。<br><br>AndroidではChromeをお試しください。";

    message.classList.add("show");

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>🎃 ハロウィンAR（３D）</title>


    <style>

        /* =====================================================
           基本
        ===================================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans JP",
                sans-serif;

            touch-action: none;
        }


        canvas {

            display: block;
        }


        /* =====================================================
           スタート案内
        ===================================================== */

        #start-guide {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            z-index: 100;

            width: min(
                86vw,
                390px
            );

            box-sizing: border-box;

            padding: 22px 20px;

            border-radius: 22px;

            background:
                rgba(20, 10, 35, 0.92);

            color: white;

            text-align: center;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.5);

            pointer-events: none;
        }


        #start-guide h1 {

            margin:
                0 0 14px;

            font-size: 25px;

            color: #ffb52e;
        }


        #start-guide .guide-text {

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 14px;
        }


        #start-guide .photo-guide {

            padding: 10px 12px;

            border-radius: 12px;

            background:
                rgba(255, 255, 255, 0.12);

            font-size: 13px;

            line-height: 1.6;
        }


        #start-guide .center-name {

            margin-top: 14px;

            font-size: 12px;

            color: #ffd978;
        }


        /* =====================================================
           上部タイトル
        ===================================================== */

        #title {

            position: fixed;

            top: 12px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 20;

            padding:
                7px 15px;

            border-radius: 20px;

            background:
                rgba(0, 0, 0, 0.55);

            color: white;

            font-size: 15px;

            font-weight: bold;

            pointer-events: none;
        }


        /* =====================================================
           説明
        ===================================================== */

        #message {

            position: fixed;

            top: 54px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 20;

            padding:
                5px 12px;

            border-radius: 15px;

            background:
                rgba(0, 0, 0, 0.48);

            color: white;

            font-size: 12px;

            white-space: nowrap;

            pointer-events: none;
        }


        /* =====================================================
           フレーム
        ===================================================== */

        #photo-frame {

            position: fixed;

            inset: 0;

            z-index: 15;

            pointer-events: none;

            display: none;

            box-sizing: border-box;
        }


        #photo-frame.active {

            display: block;
        }


        /* -----------------------------------------
           外側の枠
        ----------------------------------------- */

        #photo-frame::before {

            content: "";

            position: absolute;

            inset: 10px;

            border:
                3px solid
                rgba(255, 174, 39, 0.9);

            border-radius: 18px;

            box-shadow:

                inset 0 0 0 2px
                rgba(255, 255, 255, 0.5),

                0 0 15px
                rgba(255, 130, 0, 0.5);
        }


        /* -----------------------------------------
           上部タイトル
        ----------------------------------------- */

        .frame-top {

            position: absolute;

            top: 20px;

            left: 50%;

            transform:
                translateX(-50%);

            padding:
                7px 18px;

            border-radius: 20px;

            background:
                rgba(35, 12, 45, 0.82);

            color: #ffd45c;

            font-size:
                clamp(14px, 4vw, 20px);

            font-weight: bold;

            white-space: nowrap;

            text-shadow:
                0 2px 4px
                rgba(0,0,0,0.7);
        }


        /* -----------------------------------------
           下部センター名
        ----------------------------------------- */

        .frame-bottom {

            position: absolute;

            bottom: 86px;

            left: 50%;

            transform:
                translateX(-50%);

            padding:
                7px 16px;

            border-radius: 18px;

            background:
                rgba(35, 12, 45, 0.86);

            color: white;

            font-size:
                clamp(11px, 3.2vw, 15px);

            font-weight: bold;

            white-space: nowrap;

            text-shadow:
                0 1px 3px
                rgba(0,0,0,0.7);
        }


        /* -----------------------------------------
           フレーム四隅
        ----------------------------------------- */

        .frame-decoration {

            position: absolute;

            font-size:
                clamp(25px, 8vw, 46px);

            filter:
                drop-shadow(
                    0 3px 4px
                    rgba(0,0,0,0.5)
                );
        }


        .frame-tl {

            top: 14px;
            left: 14px;
        }


        .frame-tr {

            top: 14px;
            right: 14px;
        }


        .frame-bl {

            bottom: 82px;
            left: 14px;
        }


        .frame-br {

            bottom: 82px;
            right: 14px;
        }


        /* =====================================================
           下部ボタン
        ===================================================== */

        #bottom-area {

            position: fixed;

            left: 50%;
            bottom: 12px;

            transform:
                translateX(-50%);

            z-index: 40;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            width:
                calc(100% - 10px);

            pointer-events: auto;
        }


        /* -----------------------------------------
           キャラクターボタン
        ----------------------------------------- */

        .model-button {

            width: 60px;
            height: 60px;

            border: none;

            border-radius: 15px;

            background:
                rgba(255, 255, 255, 0.93);

            font-size: 25px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            padding: 0;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.35);

            transition:
                transform 0.1s,
                background 0.1s;
        }


        .model-button span {

            font-size: 9px;

            margin-top: 2px;

            color: #333;

            font-weight: bold;
        }


        .model-button.active {

            background:
                #ffca3a;

            transform:
                scale(1.05);
        }


        /* =====================================================
           フレームボタン
        ===================================================== */

        #frame-button {

            width: 60px;
            height: 60px;

            border: none;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.93);

            font-size: 24px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            padding: 0;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.35);
        }


        #frame-button span {

            font-size: 9px;

            margin-top: 2px;

            color: #333;

            font-weight: bold;
        }


        #frame-button.active {

            background:
                #ffca3a;

            transform:
                scale(1.05);
        }


        /* =====================================================
           XRボタン
        ===================================================== */

        .xr-button {

            z-index: 50 !important;
        }


    </style>

<body>


    <!-- =====================================================
         スタート案内
    ===================================================== -->

    <div id="start-guide">

        <h1>
            🎃 ハロウィンAR 🎃
        </h1>

        <div class="guide-text">

            👻 キャラクターを選んで<br>
            好きな場所に動かしてみよう！

        </div>

        <div class="photo-guide">

            📸 写真を撮るときは<br>
            <strong>スマホのスクリーンショット</strong><br>
            を使ってね！

        </div>

        <div class="center-name">

            🐾 岐阜県動物愛護センター 🐾

        </div>

    </div>


    <!-- =====================================================
         タイトル
    ===================================================== -->

    <div id="title">

        🎃 ハロウィンAR 🎃

    </div>


    <div id="message">

        キャラクターを選んでね 👻🎃

    </div>


    <!-- =====================================================
         ハロウィンフレーム
    ===================================================== -->

    <div id="photo-frame">

        <div class="frame-top">

            🎃 HAPPY HALLOWEEN 👻

        </div>


        <div class="frame-decoration frame-tl">

            👻

        </div>


        <div class="frame-decoration frame-tr">

            🎃

        </div>


        <div class="frame-decoration frame-bl">

            🦇

        </div>


        <div class="frame-decoration frame-br">

            🎃

        </div>


        <div class="frame-bottom">

            🐾 岐阜県動物愛護センター 🐾

        </div>

    </div>


    <!-- =====================================================
         下部ボタン
    ===================================================== -->

    <div id="bottom-area">


        <button
            class="model-button"
            data-model="ghost"
        >

            👻

            <span>
                おばけ
            </span>

        </button>


        <button
            class="model-button"
            data-model="pumpkin"
        >

            🎃

            <span>
                かぼちゃ
            </span>

        </button>


        <button
            class="model-button"
            data-model="witch"
        >

            🧙

            <span>
                帽子
            </span>

        </button>


        <button
            class="model-button"
            data-model="bat"
        >

            🦇

            <span>
                コウモリ
            </span>

        </button>


        <button
            id="frame-button"
        >

            🖼️

            <span>
                フレーム
            </span>

        </button>


    </div>


    <!-- =====================================================
         JavaScript
    ===================================================== -->

    <script type="module">


        import * as THREE
            from "three";


        import {
            GLTFLoader
        }
            from
            "three/addons/loaders/GLTFLoader.js";


        import {
            ARButton
        }
            from
            "three/addons/webxr/ARButton.js";


        /* =====================================================
           Scene
        ===================================================== */

        const scene =
            new THREE.Scene();


        const camera =
            new THREE.PerspectiveCamera(
                70,
                window.innerWidth /
                window.innerHeight,
                0.01,
                20
            );


        /* =====================================================
           Renderer
        ===================================================== */

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true,

                alpha: true,

                preserveDrawingBuffer: true

            });


        renderer.setPixelRatio(

            Math.min(
                window.devicePixelRatio,
                2
            )

        );


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );


        renderer.xr.enabled = true;


        renderer.xr.setReferenceSpaceType(
            "local"
        );


        document.body.appendChild(
            renderer.domElement
        );


        /* =====================================================
           光
        ===================================================== */

        const ambientLight =
            new THREE.HemisphereLight(
                0xffffff,
                0x444444,
                2.5
            );


        scene.add(
            ambientLight
        );


        const directionalLight =
            new THREE.DirectionalLight(
                0xffffff,
                2
            );


        directionalLight.position.set(
            2,
            4,
            2
        );


        scene.add(
            directionalLight
        );


        /* =====================================================
           AR開始ボタン
        ===================================================== */

        const arButton =
            ARButton.createButton(

                renderer,

                {

                    requiredFeatures: [
                        "hit-test"
                    ],

                    optionalFeatures: [
                        "dom-overlay"
                    ],

                    domOverlay: {
                        root: document.body
                    }

                }

            );


        arButton.classList.add(
            "xr-button"
        );


        document.body.appendChild(
            arButton
        );


        /* =====================================================
           モデル設定
           
           ★初期サイズ 0.25
        ===================================================== */

        const models = {


            ghost: {

                file: "./ghost.glb",

                name: "おばけ",

                object: null,

                visible: false,

                scale: 0.25

            },


            pumpkin: {

                file: "./pumpkin.glb",

                name: "かぼちゃ",

                object: null,

                visible: false,

                scale: 0.25

            },


            witch: {

                file: "./witch-hat.glb",

                name: "帽子",

                object: null,

                visible: false,

                scale: 0.25

            },


            bat: {

                file: "./bat.glb",

                name: "コウモリ",

                object: null,

                visible: false,

                scale: 0.25

            }

        };


        /* =====================================================
           GLTF Loader
        ===================================================== */

        const loader =
            new GLTFLoader();


        Object.keys(models)
            .forEach(key => {


                const data =
                    models[key];


                loader.load(

                    data.file,


                    function(gltf) {


                        const object =
                            gltf.scene;


                        object.scale.setScalar(
                            data.scale
                        );


                        object.visible =
                            false;


                        /*
                         * 初期位置
                         */

                        object.position.set(
                            0,
                            0,
                            -1
                        );


                        scene.add(
                            object
                        );


                        data.object =
                            object;


                        console.log(
                            data.name +
                            " 読み込み完了"
                        );

                    },


                    undefined,


                    function(error) {

                        console.error(

                            data.name +
                            " 読み込みエラー",

                            error

                        );

                    }

                );

            });


        /* =====================================================
           レティクル
        ===================================================== */

        const ringGeometry =
            new THREE.RingGeometry(
                0.08,
                0.1,
                32
            );


        ringGeometry.rotateX(
            -Math.PI / 2
        );


        const ringMaterial =
            new THREE.MeshBasicMaterial({

                color: 0xffffff

            });


        const reticle =
            new THREE.Mesh(

                ringGeometry,
                ringMaterial

            );


        reticle.matrixAutoUpdate =
            false;


        reticle.visible =
            false;


        scene.add(
            reticle
        );


        /* =====================================================
           選択中モデル
        ===================================================== */

        let selectedObject =
            null;


        /* =====================================================
           AR開始
        ===================================================== */

        renderer.xr.addEventListener(

            "sessionstart",

            () => {


                /*
                 * スタート案内を消す
                 */

                document
                    .getElementById(
                        "start-guide"
                    )
                    .style.display =
                    "none";


                document
                    .getElementById(
                        "message"
                    )
                    .textContent =
                    "キャラクターを選んでね 👻🎃";

            }

        );


        /* =====================================================
           AR終了
        ===================================================== */

        renderer.xr.addEventListener(

            "sessionend",

            () => {


                hitTestSourceRequested =
                    false;


                hitTestSource =
                    null;


                reticle.visible =
                    false;

            }

        );


        /* =====================================================
           キャラクターボタン
        ===================================================== */

        document
            .querySelectorAll(
                ".model-button"
            )
            .forEach(button => {


                button.addEventListener(

                    "click",

                    () => {


                        const key =
                            button.dataset.model;


                        const data =
                            models[key];


                        /*
                         * まだ読み込み中
                         */

                        if (!data.object) {

                            return;

                        }


                        /*
                         * ON / OFF
                         */

                        data.visible =
                            !data.visible;


                        data.object.visible =
                            data.visible;


                        /*
                         * ボタン表示
                         */

                        button.classList.toggle(

                            "active",

                            data.visible

                        );


                        /*
                         * ONにしたモデルを選択
                         */

                        if (data.visible) {

                            selectedObject =
                                data.object;

                        }


                        /*
                         * 全部OFFなら解除
                         */

                        const anyVisible =
                            Object.values(models)
                                .some(
                                    item =>
                                        item.visible
                                );


                        if (!anyVisible) {

                            selectedObject =
                                null;

                        }

                    }

                );

            });


        /* =====================================================
           フレーム ON / OFF
        ===================================================== */

        const frameButton =
            document.getElementById(
                "frame-button"
            );


        const photoFrame =
            document.getElementById(
                "photo-frame"
            );


        frameButton.addEventListener(

            "click",

            () => {


                const active =
                    photoFrame.classList.toggle(
                        "active"
                    );


                frameButton.classList.toggle(
                    "active",
                    active
                );

            }

        );


        /* =====================================================
           タッチ操作
        ===================================================== */

        let startX = 0;

        let startY = 0;

        let startDistance = 0;

        let startAngle = 0;

        let startScale = 0.25;

        let startRotation = 0;

        let dragging = false;


        /* =====================================================
           タッチ開始
        ===================================================== */

        renderer.domElement.addEventListener(

            "touchstart",

            event => {


                if (!selectedObject) {

                    return;

                }


                /*
                 * 1本指
                 */

                if (
                    event.touches.length === 1
                ) {


                    dragging = true;


                    startX =
                        event.touches[0]
                            .clientX;


                    startY =
                        event.touches[0]
                            .clientY;

                }


                /*
                 * 2本指
                 */

                else if (
                    event.touches.length === 2
                ) {


                    dragging = false;


                    const dx =
                        event.touches[0]
                            .clientX -
                        event.touches[1]
                            .clientX;


                    const dy =
                        event.touches[0]
                            .clientY -
                        event.touches[1]
                            .clientY;


                    startDistance =
                        Math.sqrt(

                            dx * dx +
                            dy * dy

                        );


                    startAngle =
                        Math.atan2(
                            dy,
                            dx
                        );


                    startScale =
                        selectedObject.scale.x;


                    startRotation =
                        selectedObject.rotation.y;

                }

            },

            {
                passive: false
            }

        );


        /* =====================================================
           タッチ移動
        ===================================================== */

        renderer.domElement.addEventListener(

            "touchmove",

            event => {


                if (!selectedObject) {

                    return;

                }


                event.preventDefault();


                /*
                 * 1本指
                 * → 移動
                 */

                if (

                    event.touches.length === 1 &&
                    dragging

                ) {


                    const x =
                        event.touches[0]
                            .clientX;


                    const y =
                        event.touches[0]
                            .clientY;


                    const dx =
                        x - startX;


                    const dy =
                        y - startY;


                    selectedObject.position.x +=
                        dx * 0.002;


                    selectedObject.position.y -=
                        dy * 0.002;


                    startX = x;

                    startY = y;

                }


                /*
                 * 2本指
                 * → 拡大縮小＋回転
                 */

                else if (
                    event.touches.length === 2
                ) {


                    const dx =
                        event.touches[0]
                            .clientX -
                        event.touches[1]
                            .clientX;


                    const dy =
                        event.touches[0]
                            .clientY -
                        event.touches[1]
                            .clientY;


                    const distance =
                        Math.sqrt(

                            dx * dx +
                            dy * dy

                        );


                    /*
                     * 拡大縮小
                     */

                    if (
                        startDistance > 0
                    ) {


                        const ratio =
                            distance /
                            startDistance;


                        let newScale =
                            startScale *
                            ratio;


                        /*
                         * 最小 0.08
                         * 最大 0.7
                         */

                        newScale =
                            Math.max(

                                0.08,

                                Math.min(
                                    newScale,
                                    0.7
                                )

                            );


                        selectedObject
                            .scale
                            .setScalar(
                                newScale
                            );

                    }


                    /*
                     * 回転
                     */

                    const angle =
                        Math.atan2(
                            dy,
                            dx
                        );


                    const rotationDelta =
                        angle -
                        startAngle;


                    selectedObject
                        .rotation
                        .y =
                        startRotation +
                        rotationDelta;

                }

            },

            {
                passive: false
            }

        );


        /* =====================================================
           タッチ終了
        ===================================================== */

        renderer.domElement.addEventListener(

            "touchend",

            () => {

                dragging = false;

            }

        );


        /* =====================================================
           リサイズ
        ===================================================== */

        window.addEventListener(

            "resize",

            () => {


                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(

                    window.innerWidth,
                    window.innerHeight

                );

            }

        );


        /* =====================================================
           WebXR Hit Test
        ===================================================== */

        let hitTestSource = null;

        let hitTestSourceRequested =
            false;


        renderer.setAnimationLoop(

            (timestamp, frame) => {


                if (frame) {


                    const session =
                        renderer.xr.getSession();


                    const referenceSpace =
                        renderer.xr
                            .getReferenceSpace();


                    /*
                     * Hit Test準備
                     */

                    if (
                        !hitTestSourceRequested
                    ) {


                        session
                            .requestReferenceSpace(
                                "viewer"
                            )

                            .then(

                                viewerSpace => {

                                    return session
                                        .requestHitTestSource({

                                            space:
                                                viewerSpace

                                        });

                                }

                            )

                            .then(

                                source => {

                                    hitTestSource =
                                        source;

                                }

                            );


                        session.addEventListener(

                            "end",

                            () => {

                                hitTestSourceRequested =
                                    false;

                                hitTestSource =
                                    null;

                            }

                        );


                        hitTestSourceRequested =
                            true;

                    }


                    /*
                     * 地面検出
                     */

                    if (hitTestSource) {


                        const hitTestResults =
                            frame.getHitTestResults(
                                hitTestSource
                            );


                        if (
                            hitTestResults.length > 0
                        ) {


                            const hit =
                                hitTestResults[0];


                            const pose =
                                hit.getPose(
                                    referenceSpace
                                );


                            reticle.visible =
                                true;


                            reticle.matrix
                                .fromArray(
                                    pose
                                        .transform
                                        .matrix
                                );

                        }

                        else {

                            reticle.visible =
                                false;

                        }

                    }

                }


                renderer.render(
                    scene,
                    camera
                );

            }

        );


        /* =====================================================
           AR画面タップ
           → 選択中モデルを配置
        ===================================================== */

        renderer.domElement.addEventListener(

            "click",

            event => {


                /*
                 * 下部ボタン付近は除外
                 */

                if (

                    event.clientY >
                    window.innerHeight - 100

                ) {

                    return;

                }


                /*
                 * モデルが選択されていない
                 */

                if (!selectedObject) {

                    return;

                }


                /*
                 * 地面が見つかっていない
                 */

                if (!reticle.visible) {

                    return;

                }


                /*
                 * レティクル位置取得
                 */

                const position =
                    new THREE.Vector3();


                position.setFromMatrixPosition(
                    reticle.matrix
                );


                /*
                 * モデル配置
                 */

                selectedObject
                    .position
                    .copy(
                        position
                    );


                /*
                 * 少しだけ浮かせる
                 */

                selectedObject
                    .position
                    .y += 0.02;

            }

        );


    </script>

</body>

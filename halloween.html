```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR床置きテスト</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 10;

      background: rgba(255,255,255,0.9);
      padding: 12px;

      border-radius: 10px;
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="info">
  ARボタンを押してください
</div>


<script type="module">

  import * as THREE from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

  import { ARButton } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';


  // ========================================
  // 基本設定
  // ========================================

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    20
  );


  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });

  renderer.setPixelRatio(
    window.devicePixelRatio
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.xr.enabled = true;

  document.body.appendChild(
    renderer.domElement
  );


  // ========================================
  // 光
  // ========================================

  const light =
    new THREE.HemisphereLight(
      0xffffff,
      0xbbbbff,
      3
    );

  scene.add(light);


  // ========================================
  // ARボタン
  // ========================================

  const arButton =
    ARButton.createButton(
      renderer,
      {
        optionalFeatures: [
          'hit-test'
        ]
      }
    );

  document.body.appendChild(
    arButton
  );


  // ========================================
  // 箱
  // ========================================

  const geometry =
    new THREE.BoxGeometry(
      0.2,
      0.2,
      0.2
    );

  const material =
    new THREE.MeshStandardMaterial({
      color: 0xff0000
    });

  const cube =
    new THREE.Mesh(
      geometry,
      material
    );


  // 最初は非表示
  cube.visible = false;

  scene.add(cube);


  // ========================================
  // Hit Test
  // ========================================

  let hitTestSource = null;

  let hitTestSourceRequested = false;

  let currentHitPose = null;

  let placed = false;


  // ========================================
  // AR開始
  // ========================================

  renderer.xr.addEventListener(
    'sessionstart',
    () => {

      document.getElementById(
        'info'
      ).textContent =
        '床をゆっくり映してください';

      placed = false;

      cube.visible = false;

    }
  );


  // ========================================
  // AR終了
  // ========================================

  renderer.xr.addEventListener(
    'sessionend',
    () => {

      hitTestSource = null;

      hitTestSourceRequested = false;

      currentHitPose = null;

      placed = false;

      cube.visible = false;

      document.getElementById(
        'info'
      ).textContent =
        'ARボタンを押してください';

    }
  );


  // ========================================
  // 画面タップ
  // ========================================

  renderer.domElement.addEventListener(
    'click',
    () => {

      if (
        currentHitPose &&
        !placed
      ) {

        const position =
          currentHitPose.transform.position;


        // タップした床の位置に固定
        cube.position.set(
          position.x,
          position.y + 0.1,
          position.z
        );


        cube.visible = true;

        placed = true;


        document.getElementById(
          'info'
        ).textContent =
          '箱を床に配置しました！';

      }

    }
  );


  // ========================================
  // ARループ
  // ========================================

  renderer.setAnimationLoop(
    function(time, frame) {

      if (frame) {

        const session =
          renderer.xr.getSession();

        const referenceSpace =
          renderer.xr.getReferenceSpace();


        // --------------------------------
        // Hit Testを準備
        // --------------------------------

        if (
          !hitTestSourceRequested
        ) {

          session
            .requestReferenceSpace(
              'viewer'
            )
            .then(
              (viewerSpace) => {

                session
                  .requestHitTestSource({
                    space: viewerSpace
                  })
                  .then(
                    (source) => {

                      hitTestSource =
                        source;

                    }
                  );

              }
            );


          hitTestSourceRequested =
            true;

        }


        // --------------------------------
        // 床を探す
        // --------------------------------

        if (
          hitTestSource &&
          !placed
        ) {

          const hitTestResults =
            frame.getHitTestResults(
              hitTestSource
            );


          if (
            hitTestResults.length > 0
          ) {

            const hit =
              hitTestResults[0];


            currentHitPose =
              hit.getPose(
                referenceSpace
              );


            document.getElementById(
              'info'
            ).textContent =
              '床を見つけました！画面をタップしてください';

          }

        }

      }


      renderer.render(
        scene,
        camera
      );

    }
  );


  // ========================================
  // 画面サイズ変更
  // ========================================

  window.addEventListener(
    'resize',
    () => {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }
  );

</script>

</body>
</html>

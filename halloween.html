```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARテスト</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 10;

      background: rgba(255,255,255,0.9);
      padding: 12px;

      border-radius: 10px;
      text-align: center;

      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="info">
  ARボタンを押してください
</div>


<script type="module">

  import * as THREE from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

  import { ARButton } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';


  // ========================================
  // Scene
  // ========================================

  const scene = new THREE.Scene();


  // ========================================
  // Camera
  // ========================================

  const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    20
  );


  // ========================================
  // Renderer
  // ========================================

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });

  renderer.setPixelRatio(
    window.devicePixelRatio
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.xr.enabled = true;

  document.body.appendChild(
    renderer.domElement
  );


  // ========================================
  // 光
  // ========================================

  const light =
    new THREE.HemisphereLight(
      0xffffff,
      0xbbbbff,
      3
    );

  scene.add(light);


  // ========================================
  // 赤い箱
  // ========================================

  const geometry =
    new THREE.BoxGeometry(
      0.2,
      0.2,
      0.2
    );

  const material =
    new THREE.MeshStandardMaterial({
      color: 0xff0000
    });

  const cube =
    new THREE.Mesh(
      geometry,
      material
    );

  cube.position.set(
    0,
    0,
    -1
  );

  scene.add(cube);


  // ========================================
  // ARボタン
  // ========================================

  const button =
    ARButton.createButton(
      renderer,
      {
        requiredFeatures: [
          'hit-test'
        ]
      }
    );

  document.body.appendChild(
    button
  );


  // ========================================
  // AR開始・終了
  // ========================================

  renderer.xr.addEventListener(
    'sessionstart',
    () => {

      document.getElementById(
        'info'
      ).textContent =
        'AR開始しました';

    }
  );


  renderer.xr.addEventListener(
    'sessionend',
    () => {

      document.getElementById(
        'info'
      ).textContent =
        'ARボタンを押してください';

    }
  );


  // ========================================
  // アニメーション
  // ========================================

  renderer.setAnimationLoop(
    () => {

      cube.rotation.y += 0.01;

      renderer.render(
        scene,
        camera
      );

    }
  );


  // ========================================
  // 画面サイズ変更
  // ========================================

  window.addEventListener(
    'resize',
    () => {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }
  );

</script>

</body>
</html>

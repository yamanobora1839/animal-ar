<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎃 ハロウィンAR テスト</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
    }

    #info {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      text-align: center;
      z-index: 10;
      font-size: 16px;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      z-index: 20;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="info">
    🎃 3つのARを探そう！
  </div>

  <div id="loading">
    3Dモデルを読み込んでいます...
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">

    import * as THREE from "three";

    import { GLTFLoader } from
      "three/addons/loaders/GLTFLoader.js";

    import { ARButton } from
      "three/addons/webxr/ARButton.js";


    let camera;
    let scene;
    let renderer;

    let hitTestSource = null;
    let hitTestSourceRequested = false;

    const modelsGroup = new THREE.Group();

    modelsGroup.visible = false;


    // --------------------------------
    // 3Dモデル
    // --------------------------------

    const models = [

      {
        name: "犬",
        url: "https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/inu-board.glb",
        position: [-4.0, 0, -3.0],
        scale: 0.2
      },

      {
        name: "猫",
        url: "https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/neco-board.glb",
        position: [4.0, 0, -3.0],
        scale: 0.2
      },

      {
        name: "イベント",
        url: "https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/event-board.glb",
        position: [0, 0, -7.0],
        scale: 0.2
      }

    ];


    // --------------------------------
    // 発見したモデル
    // --------------------------------

    let foundCount = 0;


    // --------------------------------
    // 初期化
    // --------------------------------

    init();


    function init() {

      scene = new THREE.Scene();


      camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        20
      );


      const light = new THREE.HemisphereLight(
        0xffffff,
        0xbbbbff,
        3
      );

      scene.add(light);


      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

      renderer.setPixelRatio(window.devicePixelRatio);

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.xr.enabled = true;

      document.body.appendChild(
        renderer.domElement
      );


      scene.add(modelsGroup);


      // --------------------------------
      // ARボタン
      // --------------------------------

      const arButton = ARButton.createButton(
        renderer,
        {
          requiredFeatures: ["hit-test"]
        }
      );

      document.body.appendChild(arButton);


      // --------------------------------
      // モデル読み込み
      // --------------------------------

      loadModels();


      window.addEventListener(
        "resize",
        onWindowResize
      );


      // --------------------------------
      // タップ処理
      // --------------------------------

      renderer.domElement.addEventListener(
        "pointerdown",
        onPointerDown
      );


      renderer.setAnimationLoop(
        render
      );

    }


    // --------------------------------
    // モデル読み込み
    // --------------------------------

    function loadModels() {

      const loader = new GLTFLoader();

      let loadedCount = 0;


      models.forEach((modelInfo) => {

        loader.load(

          modelInfo.url,

          (gltf) => {

            const model = gltf.scene;


            model.position.set(
              modelInfo.position[0],
              modelInfo.position[1],
              modelInfo.position[2]
            );


            model.scale.set(
              modelInfo.scale,
              modelInfo.scale,
              modelInfo.scale
            );


            // モデルに名前を付ける
            model.userData.name =
              modelInfo.name;

            // 発見済みフラグ
            model.userData.found =
              false;


            modelsGroup.add(model);


            loadedCount++;


            document.getElementById(
              "loading"
            ).textContent =
              `${loadedCount} / ${models.length} 個のモデルを読み込みました`;


            if (
              loadedCount === models.length
            ) {

              setTimeout(() => {

                document.getElementById(
                  "loading"
                ).style.display = "none";

              }, 1000);

            }

          },

          undefined,

          (error) => {

            console.error(
              "モデル読み込みエラー:",
              modelInfo.name,
              error
            );

          }

        );

      });

    }


    // --------------------------------
    // タップされたモデルを判定
    // --------------------------------

    function onPointerDown(event) {

      // AR中でなければ何もしない
      if (!renderer.xr.isPresenting) {
        return;
      }


      const rect =
        renderer.domElement.getBoundingClientRect();


      // タップ位置を-1～1に変換
      const mouse = new THREE.Vector2();

      mouse.x =
        ((event.clientX - rect.left) /
        rect.width) * 2 - 1;

      mouse.y =
        -((event.clientY - rect.top) /
        rect.height) * 2 + 1;


      // レイを飛ばす
      const raycaster =
        new THREE.Raycaster();

      raycaster.setFromCamera(
        mouse,
        camera
      );


      // 3Dモデルを調べる
      const intersects =
        raycaster.intersectObjects(
          modelsGroup.children,
          true
        );


      if (
        intersects.length === 0
      ) {
        return;
      }


      // 最初に当たったオブジェクト
      let object =
        intersects[0].object;


      // 親をたどってモデル本体を探す
      while (
        object.parent &&
        object.parent !== modelsGroup
      ) {

        object = object.parent;

      }


      // 名前を取得
      const name =
        object.userData.name;


      if (!name) {
        return;
      }


      // すでに発見済みなら無視
      if (object.userData.found) {
        return;
      }


      // 発見済みにする
      object.userData.found = true;

      foundCount++;


      // モデルを少し透明にする
      object.traverse((child) => {

        if (child.isMesh) {

          child.material =
            child.material.clone();

          child.material.transparent =
            true;

          child.material.opacity =
            0.25;

        }

      });


      // --------------------------------
      // メッセージ
      // --------------------------------

      if (foundCount < models.length) {

        document.getElementById(
          "info"
        ).innerHTML =
          `🎉 ${name}を発見！<br>` +
          `${foundCount} / ${models.length} 個発見`;

      } else {

        document.getElementById(
          "info"
        ).innerHTML =
          "🎉 AR探検コンプリート！ 🎉<br>" +
          "3つ全部見つけました！";

      }

    }


    // --------------------------------
    // AR描画
    // --------------------------------

    function render(
      timestamp,
      frame
    ) {

      if (frame) {

        const referenceSpace =
          renderer.xr.getReferenceSpace();

        const session =
          renderer.xr.getSession();


        if (
          hitTestSourceRequested === false
        ) {

          session.requestReferenceSpace(
            "viewer"
          ).then((referenceSpace) => {

            session.requestHitTestSource({
              space: referenceSpace
            }).then((source) => {

              hitTestSource = source;

            });

          });


          session.addEventListener(
            "end",
            () => {

              hitTestSourceRequested = false;

              hitTestSource = null;

              modelsGroup.visible =
                false;

              foundCount = 0;

              // 再挑戦できるようにする
              modelsGroup.traverse(
                (object) => {

                  if (
                    object.userData &&
                    object.userData.name
                  ) {

                    object.userData.found =
                      false;

                  }

                }
              );

            }
          );


          hitTestSourceRequested = true;

        }


        if (hitTestSource) {

          const hitTestResults =
            frame.getHitTestResults(
              hitTestSource
            );


          if (
            hitTestResults.length > 0
          ) {

            const hit =
              hitTestResults[0];


            const pose =
              hit.getPose(
                referenceSpace
              );


            if (pose) {

              if (
                modelsGroup.visible === false
              ) {

                modelsGroup.position.set(
                  pose.transform.position.x,
                  pose.transform.position.y,
                  pose.transform.position.z
                );


                modelsGroup.visible =
                  true;


                document.getElementById(
                  "info"
                ).innerHTML =
                  "🔍 3つのARを探してみよう！";
              }

            }

          }

        }

      }


      renderer.render(
        scene,
        camera
      );

    }


    // --------------------------------
    // 画面サイズ変更
    // --------------------------------

    function onWindowResize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();


      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }

  </script>

</body>
</html>

```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ハロウィンAR</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
    }

    #placeButton {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;

      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;

      border: none;
      border-radius: 12px;
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <div id="info">
    ARボタンを押してください
  </div>

  <button id="placeButton">
    ここに3Dモデルを配置
  </button>


  <script type="module">

    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    import { GLTFLoader } from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

    import { ARButton } from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';


    // ========================================
    // 基本設定
    // ========================================

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );


    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.xr.enabled = true;

    document.body.appendChild(
      renderer.domElement
    );


    // ========================================
    // 光
    // ========================================

    const light = new THREE.HemisphereLight(
      0xffffff,
      0xbbbbff,
      3
    );

    scene.add(light);


    // ========================================
    // ARボタン
    // ========================================

    const arButton = ARButton.createButton(
      renderer,
      {
        requiredFeatures: ['hit-test']
      }
    );

    document.body.appendChild(arButton);


    // ========================================
    // 5つのモデルを入れるグループ
    // ========================================

    const modelGroup = new THREE.Group();

    modelGroup.visible = false;

    scene.add(modelGroup);


    // ========================================
    // 3Dモデル
    // ========================================

    const models = [

      {
        url:
          'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/inu-board.glb',

        position: [-0.8, 0, -1.2]
      },

      {
        url:
          'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/neco-board.glb',

        position: [0.8, 0, -1.2]
      },

      {
        url:
          'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/event-board.glb',

        position: [-0.8, 0, -2.2]
      },

      {
        url:
          'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/logo-board.glb',

        position: [0.8, 0, -2.2]
      },

      {
        url:
          'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/quaternius_cc0-shiba-inu-1332.glb',

        position: [0, 0, -1.8]
      }

    ];


    // ========================================
    // モデル読み込み
    // ========================================

    const loader = new GLTFLoader();

    let loadedCount = 0;

    models.forEach((item) => {

      loader.load(

        item.url,

        (gltf) => {

          const object = gltf.scene;


          object.position.set(
            item.position[0],
            item.position[1],
            item.position[2]
          );


          object.scale.set(
            0.2,
            0.2,
            0.2
          );


          modelGroup.add(object);

          loadedCount++;


          document.getElementById(
            'info'
          ).textContent =
            '3Dモデル読み込み中 ' +
            loadedCount +
            ' / ' +
            models.length;


          if (
            loadedCount === models.length
          ) {

            document.getElementById(
              'info'
            ).textContent =
              '準備完了！ARボタンを押してください';

          }

        },


        undefined,


        (error) => {

          console.error(
            'モデル読み込みエラー:',
            item.url,
            error
          );

        }

      );

    });


    // ========================================
    // AR床検出
    // ========================================

    let hitTestSource = null;

    let hitTestSourceRequested = false;

    let currentHitPose = null;

    let placed = false;


    // ========================================
    // AR処理
    // ========================================

    renderer.setAnimationLoop(
      function(time, frame) {

        if (frame) {

          const referenceSpace =
            renderer.xr.getReferenceSpace();

          const session =
            renderer.xr.getSession();


          // --------------------------------
          // Hit Testの準備
          // --------------------------------

          if (
            !hitTestSourceRequested
          ) {

            session
              .requestReferenceSpace('viewer')
              .then((viewerSpace) => {

                session
                  .requestHitTestSource({
                    space: viewerSpace
                  })
                  .then((source) => {

                    hitTestSource =
                      source;

                  });

              });


            session.addEventListener(
              'end',
              () => {

                hitTestSourceRequested =
                  false;

                hitTestSource = null;

                currentHitPose = null;

                placed = false;

                modelGroup.visible =
                  false;

                document.getElementById(
                  'placeButton'
                ).style.display = 'none';

                document.getElementById(
                  'info'
                ).textContent =
                  'ARボタンを押してください';

              }
            );


            hitTestSourceRequested =
              true;

          }


          // --------------------------------
          // 床を検出
          // --------------------------------

          if (hitTestSource) {

            const hitTestResults =
              frame.getHitTestResults(
                hitTestSource
              );


            if (
              hitTestResults.length > 0
            ) {

              const hit =
                hitTestResults[0];

              currentHitPose =
                hit.getPose(
                  referenceSpace
                );


              if (!placed) {

                document.getElementById(
                  'info'
                ).textContent =
                  '床を見つけました！ここに配置できます';

                document.getElementById(
                  'placeButton'
                ).style.display =
                  'block';

              }

            }

          }

        }


        renderer.render(
          scene,
          camera
        );

      }
    );


    // ========================================
    // 配置ボタン
    // ========================================

    document.getElementById(
      'placeButton'
    ).addEventListener(
      'click',
      () => {

        if (
          currentHitPose &&
          !placed
        ) {

          const position =
            currentHitPose.transform.position;


          modelGroup.position.set(
            position.x,
            position.y,
            position.z
          );


          modelGroup.visible =
            true;


          placed = true;


          document.getElementById(
            'placeButton'
          ).style.display =
            'none';


          document.getElementById(
            'info'
          ).textContent =
            '5つの3Dモデルを配置しました！';

        }

      }
    );


    // ========================================
    // 画面サイズ変更
    // ========================================

    window.addEventListener(
      'resize',
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎃 ハロウィンAR</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;

      background: rgba(255,255,255,0.85);
      padding: 10px 14px;
      border-radius: 10px;

      font-size: 16px;
      line-height: 1.5;
    }

    #loading {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      z-index: 20;

      background: rgba(0,0,0,0.75);
      color: white;

      padding: 20px 30px;
      border-radius: 15px;

      font-size: 18px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="info">
  🎃 ハロウィンAR<br>
  床を見つけたら画面をタップ！
</div>

<div id="loading">
  3Dモデルを読み込んでいます…
</div>


<script type="module">

import * as THREE from
  'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import { ARButton } from
  'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';

import { GLTFLoader } from
  'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


// ==================================================
// 基本設定
// ==================================================

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.01,
  20
);


// ==================================================
// ライト
// ==================================================

const light = new THREE.HemisphereLight(
  0xffffff,
  0xbbbbff,
  3
);

scene.add(light);


// ==================================================
// GLBをまとめるグループ
// ==================================================

const modelGroup = new THREE.Group();

modelGroup.visible = false;

scene.add(modelGroup);


// ==================================================
// GLTF Loader
// ==================================================

const loader = new GLTFLoader();


// GitHub上のGLB
const baseURL =
  'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/';


// ==================================================
// 5つの3Dモデル
// ==================================================

const models = [

  {
    name: '犬',
    file: 'inu-board.glb',

    // 左奥
    position: new THREE.Vector3(
      -1.2,
      0,
      -0.8
    ),

    scale: 1
  },

  {
    name: '猫',
    file: 'neco-board.glb',

    // 右奥
    position: new THREE.Vector3(
      1.2,
      0,
      -0.8
    ),

    scale: 1
  },

  {
    name: 'イベント',
    file: 'event-board.glb',

    // 中央
    position: new THREE.Vector3(
      0,
      0,
      0
    ),

    scale: 1
  },

  {
    name: 'ロゴ',
    file: 'logo-board.glb',

    // 左手前
    position: new THREE.Vector3(
      -1.2,
      0,
      0.8
    ),

    scale: 1
  },

  {
    name: '柴犬',
    file: 'quaternius_cc0-shiba-inu-1332.glb',

    // 右手前
    position: new THREE.Vector3(
      1.2,
      0,
      0.8
    ),

    scale: 1
  }

];


// ==================================================
// モデル読み込み
// ==================================================

let loadedCount = 0;

models.forEach((item) => {

  loader.load(

    baseURL + item.file,

    (gltf) => {

      const object = gltf.scene;

      object.position.copy(
        item.position
      );

      object.scale.setScalar(
        item.scale
      );

      modelGroup.add(object);

      loadedCount++;

      console.log(
        item.name + ' 読み込み完了'
      );

      // 5個全部読み込めた
      if (loadedCount === models.length) {

        document.getElementById(
          'loading'
        ).style.display = 'none';

        console.log(
          'すべての3Dモデル読み込み完了'
        );

      }

    },

    undefined,

    (error) => {

      console.error(
        item.name + ' の読み込み失敗',
        error
      );

    }

  );

});


// ==================================================
// レンダラー
// ==================================================

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setPixelRatio(
  window.devicePixelRatio
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
  renderer.domElement
);


// ==================================================
// ARボタン
// ==================================================

document.body.appendChild(

  ARButton.createButton(

    renderer,

    {
      requiredFeatures: [
        'hit-test'
      ]
    }

  )

);


// ==================================================
// Hit Test
// ==================================================

let hitTestSource = null;

let hitTestSourceRequested = false;


// ==================================================
// 配置済みかどうか
// ==================================================

let placed = false;


// ==================================================
// ARコントローラー
// ==================================================

const controller =
  renderer.xr.getController(0);


// 画面タップ
controller.addEventListener(
  'select',
  () => {

    // 床を検出している場合
    if (
      currentHitPose &&
      loadedCount === models.length
    ) {

      // 5つのモデルを配置
      modelGroup.position.set(
        currentHitPose.transform.position.x,
        currentHitPose.transform.position.y,
        currentHitPose.transform.position.z
      );

      // 表示
      modelGroup.visible = true;

      placed = true;

      document.getElementById(
        'info'
      ).innerHTML =
        '🎃 5つのARモデルを配置しました！';

    }

  }
);

scene.add(controller);


// ==================================================
// 現在検出している床の位置
// ==================================================

let currentHitPose = null;


// ==================================================
// 毎フレーム
// ==================================================

renderer.setAnimationLoop(

  (timestamp, frame) => {

    if (frame) {

      const referenceSpace =
        renderer.xr.getReferenceSpace();

      const session =
        renderer.xr.getSession();


      // ----------------------------------------------
      // Hit Testの準備
      // ----------------------------------------------

      if (!hitTestSourceRequested) {

        session.requestReferenceSpace(
          'viewer'
        ).then(

          (referenceSpace) => {

            session.requestHitTestSource({
              space: referenceSpace
            }).then(

              (source) => {

                hitTestSource = source;

              }

            );

          }

        );


        session.addEventListener(
          'end',
          () => {

            hitTestSourceRequested = false;

            hitTestSource = null;

            currentHitPose = null;

            placed = false;

            modelGroup.visible = false;

          }
        );


        hitTestSourceRequested = true;

      }


      // ----------------------------------------------
      // 床を検出
      // ----------------------------------------------

      if (hitTestSource) {

        const hitTestResults =
          frame.getHitTestResults(
            hitTestSource
          );


        if (
          hitTestResults.length > 0
        ) {

          const hit =
            hitTestResults[0];


          currentHitPose =
            hit.getPose(
              referenceSpace
            );


          // まだ配置していない場合
          // 床の位置に仮表示

          if (
            !placed &&
            loadedCount === models.length
          ) {

            modelGroup.position.set(

              currentHitPose.transform.position.x,

              currentHitPose.transform.position.y,

              currentHitPose.transform.position.z

            );

            modelGroup.visible = true;

          }

        }

      }

    }


    renderer.render(
      scene,
      camera
    );

  }

);


// ==================================================
// 画面サイズ変更
// ==================================================

window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>

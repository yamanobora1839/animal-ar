<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ハロウィンAR テスト</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.6;
    }

    #loading {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 15px;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="info">
  🎃 ハロウィンAR<br>
  読み込み中…
</div>

<div id="loading">
  3Dモデルを読み込んでいます…
</div>

<script type="module">

import * as THREE from
  'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import { ARButton } from
  'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';

import { GLTFLoader } from
  'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


// ========================================
// シーン
// ========================================

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.01,
  20
);


// ========================================
// ライト
// ========================================

const light = new THREE.HemisphereLight(
  0xffffff,
  0xbbbbff,
  3
);

scene.add(light);


// ========================================
// 5モデル用グループ
// ========================================

const modelGroup = new THREE.Group();

modelGroup.visible = false;

scene.add(modelGroup);


// ========================================
// GLTF Loader
// ========================================

const loader = new GLTFLoader();

const baseURL =
  'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/';


// ========================================
// モデル一覧
// ========================================

const models = [

  {
    name: '犬',
    file: 'inu-board.glb',
    position: [-1.2, 0, -0.8]
  },

  {
    name: '猫',
    file: 'neco-board.glb',
    position: [1.2, 0, -0.8]
  },

  {
    name: 'イベント',
    file: 'event-board.glb',
    position: [0, 0, 0]
  },

  {
    name: 'ロゴ',
    file: 'logo-board.glb',
    position: [-1.2, 0, 0.8]
  },

  {
    name: '柴犬',
    file: 'quaternius_cc0-shiba-inu-1332.glb',
    position: [1.2, 0, 0.8]
  }

];


let loadedCount = 0;


// ========================================
// 読み込み状況表示
// ========================================

function updateInfo(message) {

  document.getElementById('info').innerHTML =
    message;

}


// ========================================
// GLB読み込み
// ========================================

models.forEach((item) => {

  updateInfo(
    `🎃 3Dモデルを読み込んでいます<br>` +
    `${loadedCount} / ${models.length}<br>` +
    `現在：${item.name}`
  );


  loader.load(

    baseURL + item.file,

    (gltf) => {

      const object = gltf.scene;

      object.position.set(
        item.position[0],
        item.position[1],
        item.position[2]
      );

      modelGroup.add(object);

      loadedCount++;


      console.log(
        '読み込み成功：',
        item.name,
        item.file
      );


      updateInfo(
        `🎃 読み込み中<br>` +
        `${loadedCount} / ${models.length}<br>` +
        `完了：${item.name}`
      );


      // 全部読み込み完了
      if (loadedCount === models.length) {

        document.getElementById(
          'loading'
        ).style.display = 'none';

        updateInfo(
          '🎃 準備完了！<br>' +
          'ARボタンを押してください'
        );

      }

    },


    undefined,


    (error) => {

      console.error(
        '読み込み失敗：',
        item.name,
        item.file,
        error
      );


      updateInfo(
        `❌ 読み込み失敗<br>` +
        `${item.name}<br>` +
        `${item.file}`
      );

    }

  );

});


// ========================================
// Renderer
// ========================================

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });

renderer.setPixelRatio(
  window.devicePixelRatio
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
  renderer.domElement
);


// ========================================
// ARボタン
// ========================================

document.body.appendChild(

  ARButton.createButton(
    renderer,
    {
      requiredFeatures: [
        'hit-test'
      ]
    }
  )

);


// ========================================
// Hit Test
// ========================================

let hitTestSource = null;

let hitTestSourceRequested = false;

let currentHitPose = null;

let placed = false;


// ========================================
// コントローラー
// ========================================

const controller =
  renderer.xr.getController(0);

controller.addEventListener(
  'select',
  () => {

    if (
      currentHitPose &&
      loadedCount === models.length
    ) {

      modelGroup.position.set(
        currentHitPose.transform.position.x,
        currentHitPose.transform.position.y,
        currentHitPose.transform.position.z
      );

      modelGroup.visible = true;

      placed = true;

      updateInfo(
        '🎃 5つの3Dモデルを配置しました！'
      );

    }

  }
);

scene.add(controller);


// ========================================
// ARループ
// ========================================

renderer.setAnimationLoop(
  (timestamp, frame) => {

    if (frame) {

      const referenceSpace =
        renderer.xr.getReferenceSpace();

      const session =
        renderer.xr.getSession();


      // Hit Test準備

      if (!hitTestSourceRequested) {

        session.requestReferenceSpace(
          'viewer'
        ).then(
          (viewerSpace) => {

            session.requestHitTestSource({
              space: viewerSpace
            }).then(
              (source) => {

                hitTestSource = source;

              }
            );

          }
        );


        session.addEventListener(
          'end',
          () => {

            hitTestSourceRequested = false;

            hitTestSource = null;

            currentHitPose = null;

            placed = false;

            modelGroup.visible = false;

          }
        );


        hitTestSourceRequested = true;

      }


      // 床検出

      if (hitTestSource) {

        const results =
          frame.getHitTestResults(
            hitTestSource
          );


        if (results.length > 0) {

          const hit =
            results[0];

          currentHitPose =
            hit.getPose(
              referenceSpace
            );


          // 配置前は床に追従

          if (
            !placed &&
            loadedCount === models.length
          ) {

            modelGroup.position.set(
              currentHitPose.transform.position.x,
              currentHitPose.transform.position.y,
              currentHitPose.transform.position.z
            );

            modelGroup.visible = true;

          }

        }

      }

    }


    renderer.render(
      scene,
      camera
    );

  }
);


// ========================================
// リサイズ
// ========================================

window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>

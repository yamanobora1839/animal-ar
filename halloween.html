<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎃 ハロウィンAR テスト</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
    }

   #info {
  position: fixed;

  /* 画面中央より少し下 */
  top: 58%;
  left: 50%;

  /* 中央揃え */
  transform: translate(-50%, -50%);

  width: auto;
  max-width: 80%;

  box-sizing: border-box;
  padding: 14px 22px;

  color: white;
  background: rgba(0, 0, 0, 0.75);

  text-align: center;

  border-radius: 15px;

  z-index: 10;

  font-size: 20px;
  font-weight: bold;

  pointer-events: none;

  /* 最初は非表示 */
  opacity: 0;

  transition: opacity 0.2s ease;
}

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      z-index: 20;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="info">
    🎃 3つのARを探そう！
  </div>

  <div id="loading">
    3Dモデルを読み込んでいます...
  </div>


  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>


  <script type="module">

    import * as THREE from "three";

    import { GLTFLoader } from
      "three/addons/loaders/GLTFLoader.js";

    import { ARButton } from
      "three/addons/webxr/ARButton.js";


    let camera;
    let scene;
    let renderer;

    let hitTestSource = null;
    let hitTestSourceRequested = false;


    // ARでタップするためのコントローラー
    let controller;


    const modelsGroup = new THREE.Group();

    modelsGroup.visible = false;


    // --------------------------------
    // 3Dモデル
    // --------------------------------

    const models = [

      {
        name: "犬",
        url: "https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/inu-board.glb",
        position: [-4.0, 0, -3.0],
        scale: 0.2
      },

      {
        name: "猫",
        url: "https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/neco-board.glb",
        position: [4.0, 0, -3.0],
        scale: 0.2
      },

      {
        name: "イベント",
        url: "https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/event-board.glb",
        position: [0, 0, -7.0],
        scale: 0.2
      }

    ];


    // --------------------------------
    // 発見数
    // --------------------------------

    let foundCount = 0;


    // --------------------------------
    // レイキャスター
    // --------------------------------

    const raycaster = new THREE.Raycaster();

    const tempMatrix = new THREE.Matrix4();


    // --------------------------------
    // 初期化
    // --------------------------------

    init();


    function init() {

      scene = new THREE.Scene();


      camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        20
      );


      // 光
      const light = new THREE.HemisphereLight(
        0xffffff,
        0xbbbbff,
        3
      );

      scene.add(light);


      // --------------------------------
      // Renderer
      // --------------------------------

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

      renderer.setPixelRatio(
        window.devicePixelRatio
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.xr.enabled = true;


      document.body.appendChild(
        renderer.domElement
      );


      scene.add(modelsGroup);


      // --------------------------------
      // ARボタン
      // --------------------------------

      const arButton = ARButton.createButton(
  renderer,
  {
    requiredFeatures: [
      "hit-test",
      "dom-overlay"
    ],

    domOverlay: {
      root: document.body
    }
  }
);

      document.body.appendChild(
        arButton
      );


      // --------------------------------
      // ARコントローラー
      // --------------------------------

      controller =
        renderer.xr.getController(0);

      scene.add(controller);


      // AR中のタップ
      controller.addEventListener(
        "select",
        onSelect
      );


      // --------------------------------
      // モデル読み込み
      // --------------------------------

      loadModels();


      // --------------------------------
      // 画面サイズ変更
      // --------------------------------

      window.addEventListener(
        "resize",
        onWindowResize
      );


      // --------------------------------
      // 描画
      // --------------------------------

      renderer.setAnimationLoop(
        render
      );

    }


    // --------------------------------
    // モデル読み込み
    // --------------------------------

    function loadModels() {

      const loader = new GLTFLoader();

      let loadedCount = 0;


      models.forEach((modelInfo) => {

        loader.load(

          modelInfo.url,

          (gltf) => {

            const model = gltf.scene;


            // 位置
            model.position.set(
              modelInfo.position[0],
              modelInfo.position[1],
              modelInfo.position[2]
            );


            // 大きさ
            model.scale.set(
              modelInfo.scale,
              modelInfo.scale,
              modelInfo.scale
            );


            // 名前
            model.userData.name =
              modelInfo.name;


            // 発見済みか
            model.userData.found =
              false;


            // グループに追加
            modelsGroup.add(
              model
            );


            loadedCount++;


            document.getElementById(
              "loading"
            ).textContent =
              `${loadedCount} / ${models.length} 個のモデルを読み込みました`;


            if (
              loadedCount === models.length
            ) {

              setTimeout(() => {

                document.getElementById(
                  "loading"
                ).style.display =
                  "none";

              }, 1000);

            }

          },

          undefined,

          (error) => {

            console.error(
              "モデル読み込みエラー:",
              modelInfo.name,
              error
            );

          }

        );

      });

    }


    // --------------------------------
    // AR中にタップされた
    // --------------------------------

function onSelect() {

  // AR中でなければ終了
  if (!renderer.xr.isPresenting) {
    return;
  }

  // コントローラーの位置
  raycaster.ray.origin.setFromMatrixPosition(
    controller.matrixWorld
  );

  // コントローラーの向き
  tempMatrix.identity()
    .extractRotation(
      controller.matrixWorld
    );

  // 前方へレイを飛ばす
  raycaster.ray.direction.set(
    0,
    0,
    -1
  ).applyMatrix4(
    tempMatrix
  );

  // モデルを調べる
  const intersects =
    raycaster.intersectObjects(
      modelsGroup.children,
      true
    );

  // 何も当たらなかった
  if (intersects.length === 0) {
    return;
  }

  // 当たったオブジェクト
  let object = intersects[0].object;

  // モデル本体まで親をたどる
  while (
    object.parent &&
    object.parent !== modelsGroup
  ) {
    object = object.parent;
  }

  // 名前を取得
  let name = object.userData.name;

  // --------------------------------
  // 名前が取れない場合の対策
  // --------------------------------

  if (!name) {

    // GLBの中の親をさらに確認
    let current = intersects[0].object;

    while (current) {

      if (
        current.userData &&
        current.userData.name
      ) {
        name = current.userData.name;
        object = current;
        break;
      }

      current = current.parent;
    }

  }

  // 名前がまだ無ければ終了
  if (!name) {
    console.log("モデル名を取得できませんでした");
    return;
  }

  console.log("タップしたモデル:", name);

  // すでに発見済み
  if (object.userData.found) {
    return;
  }

  // 発見済みにする
  object.userData.found = true;

  foundCount++;

  // --------------------------------
  // 半透明にする
  // --------------------------------

  object.traverse((child) => {

    if (child.isMesh) {

      child.material =
        child.material.clone();

      child.material.transparent =
        true;

      child.material.opacity =
        0.25;

    }

  });

  // --------------------------------
  // 発見メッセージ
  // --------------------------------

  const info =
  document.getElementById("info");

if (foundCount < models.length) {

  info.innerHTML =
    `🎉 ${name}を発見！<br>` +
    `${foundCount} / ${models.length} 個発見`;

} else {

  info.innerHTML =
    "🎉 AR探検コンプリート！ 🎉<br>" +
    "3つ全部見つけました！";

}

// 表示
info.style.opacity = "1";

// 2秒後に消す
setTimeout(() => {

  info.style.opacity = "0";

}, 2000);

}


    // --------------------------------
    // AR描画
    // --------------------------------

    function render(
      timestamp,
      frame
    ) {

      if (frame) {

        const referenceSpace =
          renderer.xr.getReferenceSpace();

        const session =
          renderer.xr.getSession();


        // --------------------------------
        // Hit Test の準備
        // --------------------------------

        if (
          hitTestSourceRequested === false
        ) {

          session.requestReferenceSpace(
            "viewer"
          ).then(
            (referenceSpace) => {

              session.requestHitTestSource({
                space: referenceSpace
              }).then(
                (source) => {

                  hitTestSource =
                    source;

                }
              );

            }
          );


          // AR終了時
          session.addEventListener(
            "end",
            () => {

              hitTestSourceRequested =
                false;

              hitTestSource =
                null;


              modelsGroup.visible =
                false;


              foundCount =
                0;


              // もう一度探せるようにする
              modelsGroup.traverse(
                (object) => {

                  if (
                    object.userData &&
                    object.userData.name
                  ) {

                    object.userData.found =
                      false;

                  }

                }
              );


              document.getElementById(
                "info"
              ).innerHTML =
                "🎃 3つのARを探そう！";

              document.getElementById(
  "info"
).style.opacity = "1";

            }
          );


          hitTestSourceRequested =
            true;

        }


        // --------------------------------
        // 床を検出
        // --------------------------------

        if (hitTestSource) {

          const hitTestResults =
            frame.getHitTestResults(
              hitTestSource
            );


          if (
            hitTestResults.length > 0
          ) {

            const hit =
              hitTestResults[0];


            const pose =
              hit.getPose(
                referenceSpace
              );


            if (pose) {

              if (
                modelsGroup.visible === false
              ) {

                modelsGroup.position.set(
                  pose.transform.position.x,
                  pose.transform.position.y,
                  pose.transform.position.z
                );


                modelsGroup.visible =
                  true;


                document.getElementById(
                  "info"
                ).innerHTML =
                  "🔍 3つのARを探してみよう！";

              }

            }

          }

        }

      }


      renderer.render(
        scene,
        camera
      );

    }


    // --------------------------------
    // 画面サイズ変更
    // --------------------------------

    function onWindowResize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;


      camera.updateProjectionMatrix();


      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }

  </script>

</body>
</html>

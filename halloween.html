<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎃 ハロウィンAR テスト</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
    }

    #info {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      text-align: center;
      z-index: 10;
      font-size: 16px;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      z-index: 20;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="info">
    🎃 ハロウィンAR テスト<br>
    ARボタンを押して、床をタップしてください
  </div>

  <div id="loading">
    3Dモデルを読み込んでいます...
  </div>

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">

    import * as THREE from "three";

    import { GLTFLoader } from
      "three/addons/loaders/GLTFLoader.js";

    import { ARButton } from
      "three/addons/webxr/ARButton.js";


    // --------------------------------
    // 基本設定
    // --------------------------------

    let camera;
    let scene;
    let renderer;

    let hitTestSource = null;
    let hitTestSourceRequested = false;

    // AR上で表示するモデルをまとめるグループ
    const modelsGroup = new THREE.Group();

    // 最初は非表示
    modelsGroup.visible = false;


    // --------------------------------
    // 3DモデルのURL
    // --------------------------------

    const models = [

  {
    name: "犬",
    url: "https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/inu-board.glb",
    position: [-2.0, 0, -2.0],
    scale: 0.2
  },

  {
    name: "猫",
    url: "https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/neco-board.glb",
    position: [2.0, 0, -2.0],
    scale: 0.2
  },

  {
    name: "イベント",
    url: "https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/event-board.glb",
    position: [0, 0, -4.0],
    scale: 0.2
  }

];


    // --------------------------------
    // 初期化
    // --------------------------------

    init();


    function init() {

      // シーン
      scene = new THREE.Scene();


      // カメラ
      camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        20
      );


      // 光
      const light = new THREE.HemisphereLight(
        0xffffff,
        0xbbbbff,
        3
      );

      scene.add(light);


      // レンダラー
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.xr.enabled = true;

      document.body.appendChild(renderer.domElement);


      // モデルグループ
      scene.add(modelsGroup);


      // --------------------------------
      // ARボタン
      // --------------------------------

      const arButton = ARButton.createButton(
        renderer,
        {
          requiredFeatures: ["hit-test"]
        }
      );

      document.body.appendChild(arButton);


      // --------------------------------
      // 3Dモデル読み込み
      // --------------------------------

      loadModels();


      // 画面サイズ変更
      window.addEventListener(
        "resize",
        onWindowResize
      );


      // アニメーション
      renderer.setAnimationLoop(
        render
      );
    }


    // --------------------------------
    // モデル読み込み
    // --------------------------------

    function loadModels() {

      const loader = new GLTFLoader();

      let loadedCount = 0;


      models.forEach((modelInfo) => {

        loader.load(

          modelInfo.url,

          (gltf) => {

            const model = gltf.scene;

            model.position.set(
              modelInfo.position[0],
              modelInfo.position[1],
              modelInfo.position[2]
            );

            model.scale.set(
              modelInfo.scale,
              modelInfo.scale,
              modelInfo.scale
            );


            modelsGroup.add(model);


            loadedCount++;


            document.getElementById(
              "loading"
            ).textContent =
              `${loadedCount} / ${models.length} 個のモデルを読み込みました`;


            if (
              loadedCount === models.length
            ) {

              setTimeout(() => {

                document.getElementById(
                  "loading"
                ).style.display = "none";

              }, 1000);

            }

          },

          undefined,

          (error) => {

            console.error(
              "モデル読み込みエラー:",
              modelInfo.name,
              error
            );

          }

        );

      });

    }


    // --------------------------------
    // AR描画
    // --------------------------------

    function render(
      timestamp,
      frame
    ) {

      if (frame) {

        const referenceSpace =
          renderer.xr.getReferenceSpace();

        const session =
          renderer.xr.getSession();


        // --------------------------------
        // 初回だけHit Testを準備
        // --------------------------------

        if (
          hitTestSourceRequested === false
        ) {

          session.requestReferenceSpace(
            "viewer"
          ).then((referenceSpace) => {

            session.requestHitTestSource({
              space: referenceSpace
            }).then((source) => {

              hitTestSource = source;

            });

          });


          session.addEventListener(
            "end",
            () => {

              hitTestSourceRequested = false;
              hitTestSource = null;

              modelsGroup.visible = false;

            }
          );


          hitTestSourceRequested = true;
        }


        // --------------------------------
        // 床を検出
        // --------------------------------

        if (hitTestSource) {

          const hitTestResults =
            frame.getHitTestResults(
              hitTestSource
            );


          if (
            hitTestResults.length > 0
          ) {

            const hit =
              hitTestResults[0];


            const pose =
              hit.getPose(
                referenceSpace
              );


            if (pose) {

              // 最初に床を検出した場所に
              // 3Dモデルを出現させる

              if (
                modelsGroup.visible === false
              ) {

                modelsGroup.position.set(
                  pose.transform.position.x,
                  pose.transform.position.y,
                  pose.transform.position.z
                );


                modelsGroup.visible = true;


                document.getElementById(
                  "info"
                ).innerHTML =
                  "🎃 3Dモデルが出現しました！<br>犬・猫・イベントを探してみよう！";

              }

            }

          }

        }

      }


      renderer.render(
        scene,
        camera
      );

    }


    // --------------------------------
    // 画面サイズ変更
    // --------------------------------

    function onWindowResize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();


      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }

  </script>

</body>
</html>

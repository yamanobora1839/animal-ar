```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ハロウィンAR</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 10;

      background: rgba(255,255,255,0.9);
      padding: 12px;

      border-radius: 10px;
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="info">
  3Dモデルを読み込んでいます……
</div>


<script type="module">

  // ========================================
  // Three.js
  // ========================================

  import * as THREE from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

  import { GLTFLoader } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

  import { ARButton } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';


  // ========================================
  // Scene
  // ========================================

  const scene = new THREE.Scene();


  // ========================================
  // Camera
  // ========================================

  const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    20
  );


  // ========================================
  // Renderer
  // ========================================

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });

  renderer.setPixelRatio(window.devicePixelRatio);

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.xr.enabled = true;

  document.body.appendChild(
    renderer.domElement
  );


  // ========================================
  // 光
  // ========================================

  const light =
    new THREE.HemisphereLight(
      0xffffff,
      0xbbbbff,
      3
    );

  scene.add(light);


  // ========================================
  // ARボタン
  //
  // hit-testを「必須」ではなく
  // 「オプション」にする
  // ========================================

  const arButton =
    ARButton.createButton(
      renderer,
      {
        optionalFeatures: [
          'hit-test'
        ]
      }
    );

  document.body.appendChild(
    arButton
  );


  // ========================================
  // 複数モデルを入れるグループ
  // ========================================

  const modelGroup =
    new THREE.Group();

  modelGroup.visible = false;

  scene.add(modelGroup);


  // ========================================
  // 表示するGLB
  // ========================================

  const models = [

    {
      url:
        'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/inu-board.glb',

      position: [-0.8, 0, -1.2],

      scale: 0.2
    },

    {
      url:
        'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/neco-board.glb',

      position: [0.8, 0, -1.2],

      scale: 0.2
    },

    {
      url:
        'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/event-board.glb',

      position: [-0.8, 0, -2.2],

      scale: 0.2
    },

    {
      url:
        'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/logo-board.glb',

      position: [0.8, 0, -2.2],

      scale: 0.2
    },

    {
      url:
        'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/quaternius_cc0-shiba-inu-1332.glb',

      position: [0, 0, -1.8],

      scale: 0.2
    }

  ];


  // ========================================
  // GLB読み込み
  // ========================================

  const loader =
    new GLTFLoader();

  let loadedCount = 0;


  models.forEach((item) => {

    loader.load(

      item.url,

      (gltf) => {

        const object =
          gltf.scene;


        // 位置
        object.position.set(
          item.position[0],
          item.position[1],
          item.position[2]
        );


        // 大きさ
        object.scale.set(
          item.scale,
          item.scale,
          item.scale
        );


        // グループに追加
        modelGroup.add(
          object
        );


        loadedCount++;


        document.getElementById(
          'info'
        ).textContent =
          '3Dモデル読み込み中　' +
          loadedCount +
          ' / ' +
          models.length;


        // 全部読み込み完了
        if (
          loadedCount === models.length
        ) {

          document.getElementById(
            'info'
          ).textContent =
            '準備完了！ ARボタンを押してください';

        }

      },


      undefined,


      (error) => {

        console.error(
          'GLB読み込みエラー',
          item.url,
          error
        );

      }

    );

  });


  // ========================================
  // AR
  // ========================================

  let hitTestSource = null;

  let hitTestSourceRequested =
    false;

  let placed = false;


  // ========================================
  // ARセッション開始
  // ========================================

  renderer.xr.addEventListener(
    'sessionstart',
    () => {

      document.getElementById(
        'info'
      ).textContent =
        '床を映してください';

      placed = false;

    }
  );


  // ========================================
  // ARセッション終了
  // ========================================

  renderer.xr.addEventListener(
    'sessionend',
    () => {

      hitTestSource = null;

      hitTestSourceRequested =
        false;

      placed = false;

      modelGroup.visible =
        false;

      document.getElementById(
        'info'
      ).textContent =
        'ARボタンを押してください';

    }
  );


  // ========================================
  // タップしたら配置
  // ========================================

  renderer.domElement.addEventListener(
    'click',
    () => {

      if (
        hitTestSource &&
        !placed
      ) {

        placed = true;

        document.getElementById(
          'info'
        ).textContent =
          '5つの3Dモデルを配置しました！';

      }

    }
  );


  // ========================================
  // ARアニメーション
  // ========================================

  renderer.setAnimationLoop(
    function(time, frame) {

      if (frame) {

        const session =
          renderer.xr.getSession();

        const referenceSpace =
          renderer.xr.getReferenceSpace();


        // --------------------------------
        // Hit Test準備
        // --------------------------------

        if (
          !hitTestSourceRequested
        ) {

          session
            .requestReferenceSpace(
              'viewer'
            )
            .then(
              (viewerSpace) => {

                session
                  .requestHitTestSource({
                    space: viewerSpace
                  })
                  .then(
                    (source) => {

                      hitTestSource =
                        source;

                    }
                  );

              }
            );


          session.addEventListener(
            'end',
            () => {

              hitTestSource =
                null;

            }
          );


          hitTestSourceRequested =
            true;

        }


        // --------------------------------
        // 床を検出
        // --------------------------------

        if (
          hitTestSource
        ) {

          const hitTestResults =
            frame.getHitTestResults(
              hitTestSource
            );


          if (
            hitTestResults.length > 0
          ) {

            const hit =
              hitTestResults[0];


            const pose =
              hit.getPose(
                referenceSpace
              );


            // まだ配置していない
            if (!placed) {

              // 床の位置を保存
              modelGroup.position.set(
                pose.transform.position.x,
                pose.transform.position.y,
                pose.transform.position.z
              );


              // プレビューとして表示
              modelGroup.visible =
                true;

            }

          }

        }

      }


      renderer.render(
        scene,
        camera
      );

    }
  );


  // ========================================
  // 画面サイズ変更
  // ========================================

  window.addEventListener(
    'resize',
    () => {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    }
  );

</script>

</body>
</html>
```

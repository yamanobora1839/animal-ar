<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>犬ARテスト</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="info">
  🐕 犬AR<br>
  3Dモデル読み込み中…
</div>

<script type="module">

import * as THREE from
  'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import { ARButton } from
  'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';

import { GLTFLoader } from
  'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


// -----------------------------
// シーン
// -----------------------------

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.01,
  20
);


// -----------------------------
// ライト
// -----------------------------

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0xbbbbff,
    3
  )
);


// -----------------------------
// 犬を入れるグループ
// -----------------------------

const dogGroup = new THREE.Group();

dogGroup.visible = false;

scene.add(dogGroup);


// -----------------------------
// 犬GLBを読み込む
// -----------------------------

const loader = new GLTFLoader();

const dogURL =
  'https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/inu-board.glb';


loader.load(

  dogURL,

  (gltf) => {

    const dog = gltf.scene;

    dog.scale.setScalar(1);

    dogGroup.add(dog);

    document.getElementById('info').innerHTML =
      '🐕 犬の読み込み完了！<br>ARボタンを押してください';

    console.log('犬の読み込み成功');

  },

  undefined,

  (error) => {

    console.error('犬の読み込み失敗', error);

    document.getElementById('info').innerHTML =
      '❌ 犬の読み込みに失敗しました';

  }

);


// -----------------------------
// Renderer
// -----------------------------

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });

renderer.setPixelRatio(
  window.devicePixelRatio
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
  renderer.domElement
);


// -----------------------------
// ARボタン
// -----------------------------

document.body.appendChild(

  ARButton.createButton(
    renderer,
    {
      requiredFeatures: [
        'hit-test'
      ]
    }
  )

);


// -----------------------------
// Hit Test
// -----------------------------

let hitTestSource = null;
let hitTestSourceRequested = false;
let currentHitPose = null;
let placed = false;


// -----------------------------
// タップ
// -----------------------------

const controller =
  renderer.xr.getController(0);

controller.addEventListener(
  'select',
  () => {

    if (currentHitPose) {

      dogGroup.position.set(
        currentHitPose.transform.position.x,
        currentHitPose.transform.position.y,
        currentHitPose.transform.position.z
      );

      dogGroup.visible = true;

      placed = true;

      document.getElementById('info').innerHTML =
        '🐕 犬を配置しました！';

    }

  }
);

scene.add(controller);


// -----------------------------
// ARループ
// -----------------------------

renderer.setAnimationLoop(
  (timestamp, frame) => {

    if (frame) {

      const referenceSpace =
        renderer.xr.getReferenceSpace();

      const session =
        renderer.xr.getSession();


      if (!hitTestSourceRequested) {

        session.requestReferenceSpace(
          'viewer'
        ).then(
          (viewerSpace) => {

            session.requestHitTestSource({
              space: viewerSpace
            }).then(
              (source) => {

                hitTestSource = source;

              }
            );

          }
        );


        session.addEventListener(
          'end',
          () => {

            hitTestSourceRequested = false;
            hitTestSource = null;
            currentHitPose = null;
            placed = false;
            dogGroup.visible = false;

          }
        );


        hitTestSourceRequested = true;

      }


      if (hitTestSource) {

        const results =
          frame.getHitTestResults(
            hitTestSource
          );


        if (results.length > 0) {

          const hit = results[0];

          currentHitPose =
            hit.getPose(
              referenceSpace
            );


          // 犬を床の検出位置に仮表示
          if (!placed) {

            dogGroup.position.set(
              currentHitPose.transform.position.x,
              currentHitPose.transform.position.y,
              currentHitPose.transform.position.z
            );

            dogGroup.visible = true;

          }

        }

      }

    }


    renderer.render(
      scene,
      camera
    );

  }
);


// -----------------------------
// リサイズ
// -----------------------------

window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>

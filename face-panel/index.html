<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>🎃 ハロウィン顔出しAR</title>


<style>

/* =========================================================
   基本
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    touch-action: none;
}


/* =========================================================
   AR本体
========================================================= */

#ar-container {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    z-index: 1;
}


canvas {

    position: fixed !important;

    inset: 0 !important;

    width: 100% !important;
    height: 100% !important;

}


/* =========================================================
   画像レイヤー
========================================================= */

#object-layer {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 20;
}


/* =========================================================
   配置する画像
========================================================= */

.ar-object {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 180px;

    transform:
        translate(-50%, -50%)
        scale(1)
        rotate(0deg);

    transform-origin: center center;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;

    pointer-events: auto;

    object-fit: contain;

    cursor: move;

}


/* =========================================================
   選択中
========================================================= */

.ar-object.selected {

    outline: 3px solid white;

    outline-offset: 3px;

    filter:
        drop-shadow(
            0 0 4px
            rgba(0,0,0,0.9)
        );

}


/* =========================================================
   上部タイトル
========================================================= */

#top-title {

    position: fixed;

    top: 10px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 100;

    color: white;

    background:
        rgba(0,0,0,0.55);

    padding:
        7px 14px;

    border-radius: 20px;

    font-size: 15px;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================================
   操作説明
========================================================= */

#photo-guide {

    position: fixed;

    top: 52px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 100;

    color: white;

    background:
        rgba(0,0,0,0.45);

    padding:
        5px 11px;

    border-radius: 15px;

    font-size: 12px;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================================
   下部操作エリア
========================================================= */

/*
   STOP ARと重ならないように
   画面下から十分離す
*/

#controls {

    position: fixed;

    left: 0;

    bottom: 72px;

    width: 100%;

    padding:
        6px 8px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 6px;

    flex-wrap: wrap;

    z-index: 200;

    pointer-events: auto;

}


/* =========================================================
   操作ボタン
========================================================= */

.control-button {

    border: none;

    border-radius: 14px;

    padding:
        9px 12px;

    background:
        rgba(30,30,30,0.90);

    color: white;

    font-size: 13px;

    font-weight: bold;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.4);

    touch-action: manipulation;

}


.control-button:active {

    transform:
        scale(0.94);

}


/* =========================================================
   選択パネル
========================================================= */

#picker {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    max-height: 55vh;

    overflow-y: auto;

    z-index: 500;

    display: none;

    padding: 12px;

    background:
        rgba(20,20,20,0.97);

    border-radius:
        18px
        18px
        0
        0;

    -webkit-overflow-scrolling:
        touch;

}


/* =========================================================
   パネルタイトル
========================================================= */

#picker-title {

    color: white;

    text-align: center;

    font-weight: bold;

    font-size: 16px;

    margin-bottom: 10px;

}


/* =========================================================
   サムネイル
========================================================= */

#picker-grid {

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 8px;

}


.thumbnail {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: contain;

    background: white;

    border-radius: 10px;

    padding: 3px;

    border: 2px solid transparent;

    touch-action: manipulation;

}


.thumbnail:active {

    transform:
        scale(0.94);

}


/* =========================================================
   閉じる
========================================================= */

.close-picker {

    display: block;

    width: 100%;

    margin-top: 10px;

    padding: 10px;

    border: none;

    border-radius: 12px;

    background: #555;

    color: white;

    font-size: 15px;

    font-weight: bold;

}


/* =========================================================
   スタート画面
========================================================= */

#start-screen {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #16001f,
            #3d063d,
            #12001b
        );

}


#start-box {

    width:
        min(90vw, 420px);

    background:
        rgba(0,0,0,0.75);

    color: white;

    padding: 25px;

    border-radius: 24px;

    text-align: center;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.5);

}


#start-box h1 {

    margin:
        0 0 15px;

    font-size: 24px;

}


#start-box p {

    font-size: 14px;

    line-height: 1.7;

}


#start-button {

    border: none;

    border-radius: 18px;

    padding:
        14px 25px;

    background: #ff7a00;

    color: white;

    font-size: 18px;

    font-weight: bold;

}


#start-note {

    margin-top: 15px;

    font-size: 12px;

    opacity: 0.8;

}

</style>

</head>


<body>


<!-- =======================================================
     AR
======================================================= -->

<div id="ar-container"></div>


<!-- =======================================================
     配置画像
======================================================= -->

<div id="object-layer"></div>


<!-- =======================================================
     タイトル
======================================================= -->

<div id="top-title">

    🎃 ハロウィン顔出しAR

</div>


<div id="photo-guide">

    👆移動　✌️拡大・縮小・回転　📱完成したらスクショ！

</div>


<!-- =======================================================
     操作ボタン
======================================================= -->

<div id="controls">

    <button
        class="control-button"
        id="image-button"
    >
        🎃 画像
    </button>


    <button
        class="control-button"
        id="frame-button"
    >
        🖼️ フレーム
    </button>


    <button
        class="control-button"
        id="delete-button"
    >
        🗑️ 1枚削除
    </button>


    <button
        class="control-button"
        id="clear-button"
    >
        🧹 全部消す
    </button>

</div>


<!-- =======================================================
     画像選択パネル
======================================================= -->

<div id="picker">

    <div id="picker-title">
        🎃 追加する画像を選んでください
    </div>


    <div id="picker-grid"></div>


    <button
        class="close-picker"
        id="close-picker"
    >
        ✕ 閉じる
    </button>

</div>


<!-- =======================================================
     スタート画面
======================================================= -->

<div id="start-screen">

    <div id="start-box">

        <h1>
            🎃 ハロウィン顔出しAR
        </h1>


        <p>

            カメラを起動して、<br>

            好きな画像を顔のまわりに
            配置して遊ぼう！

            <br><br>

            👆 1本指：移動<br>

            ✌️ 2本指：拡大・縮小・回転

            <br><br>

            同じ画像も何枚でも
            追加できます。

        </p>


        <button id="start-button">

            📷 ARをはじめる

        </button>


        <div id="start-note">

            ※ カメラの使用を許可してください

        </div>

    </div>

</div>


<!-- =======================================================
     Three.js
======================================================= -->

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE
    from "three";

import {
    ARButton
}
from "three/addons/webxr/ARButton.js";


/* =========================================================
   通常画像
========================================================= */

const AR_IMAGES = [

    "rogo03.png",

    "bochi01.png",
    "bochi02.png",
    "bochi03.png",

    "gaikotu01.png",

    "mazyo01.png",
    "mazyo02.png",
    "mazyo03.png",

    "koumori01.png",
    "koumori02.png",
    "koumori03.png",

    "neko01.png",
    "neko02.png",

    "ame01.png",

    "obake01.png",
    "obake02.png",
    "obake03.png",
    "obake04.png",
    "obake05.png",
    "obake06.png",

    "hukugou01.png",

    "kabocha01.png",
    "kabocha02.png",
    "kabocha03.png",

    "rogo01.png",
    "rogo02.png"

];


/* =========================================================
   フレーム
========================================================= */

const FRAMES = [

    "flame01.png",
    "flame02.png",
    "flame03.png",
    "flame04.png",
    "flame05.png",
    "flame06.png",
    "flame07.png"

];


/* =========================================================
   Three.js
========================================================= */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.01,
        20
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: true,

        preserveDrawingBuffer: true

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.xr.enabled = true;


document
    .getElementById("ar-container")
    .appendChild(
        renderer.domElement
    );


/* =========================================================
   ARButton
========================================================= */

const arButton =
    ARButton.createButton(
        renderer,
        {

            requiredFeatures: [
                "dom-overlay"
            ],

            domOverlay: {
                root: document.body
            }

        }
    );


/*
   Three.jsのSTOP ARは画面最下部。
   自作ボタンはその上に配置。
*/

arButton.style.position =
    "fixed";

arButton.style.bottom =
    "10px";

arButton.style.left =
    "50%";

arButton.style.transform =
    "translateX(-50%)";

arButton.style.zIndex =
    "400";

document.body.appendChild(
    arButton
);


/* =========================================================
   DOM
========================================================= */

const startScreen =
    document.getElementById(
        "start-screen"
    );


const startButton =
    document.getElementById(
        "start-button"
    );


const objectLayer =
    document.getElementById(
        "object-layer"
    );


const picker =
    document.getElementById(
        "picker"
    );


const pickerTitle =
    document.getElementById(
        "picker-title"
    );


const pickerGrid =
    document.getElementById(
        "picker-grid"
    );


const imageButton =
    document.getElementById(
        "image-button"
    );


const frameButton =
    document.getElementById(
        "frame-button"
    );


const deleteButton =
    document.getElementById(
        "delete-button"
    );


const clearButton =
    document.getElementById(
        "clear-button"
    );


const closePicker =
    document.getElementById(
        "close-picker"
    );


/* =========================================================
   状態
========================================================= */

let selectedObject = null;

let objectCounter = 0;

let currentMode = "image";


/* =========================================================
   画像追加
========================================================= */

function addObject(
    filename,
    type = "image"
) {

    const img =
        document.createElement(
            "img"
        );


    img.src = filename;


    img.className =
        "ar-object";


    img.draggable = false;


    img.dataset.type =
        type;


    img.dataset.x =
        "50";


    img.dataset.y =
        type === "frame"
            ? "50"
            : "50";


    img.dataset.scale =
        type === "frame"
            ? "1"
            : "1";


    img.dataset.rotation =
        "0";


    img.dataset.id =
        "object-" +
        objectCounter++;


    /*
       フレームは少し大きめ
    */

    if (type === "frame") {

        img.style.width =
            "90vw";

    }
    else {

        img.style.width =
            "180px";

    }


    objectLayer.appendChild(
        img
    );


    /*
       フレームは1枚だけ
    */

    if (type === "frame") {

        document
            .querySelectorAll(
                '.ar-object[data-type="frame"]'
            )
            .forEach(
                oldFrame => {

                    if (
                        oldFrame !== img
                    ) {

                        oldFrame.remove();

                    }

                }
            );

    }


    updateTransform(img);

    selectObject(img);

    setupTouch(img);

}


/* =========================================================
   選択
========================================================= */

function selectObject(
    object
) {

    document
        .querySelectorAll(
            ".ar-object"
        )
        .forEach(
            item => {

                item.classList.remove(
                    "selected"
                );

            }
        );


    selectedObject =
        object;


    if (object) {

        object.classList.add(
            "selected"
        );


        object.style.zIndex =
            String(
                100 +
                objectCounter
            );

    }

}


/* =========================================================
   Transform
========================================================= */

function updateTransform(
    object
) {

    const x =
        parseFloat(
            object.dataset.x
        );


    const y =
        parseFloat(
            object.dataset.y
        );


    const scale =
        parseFloat(
            object.dataset.scale
        );


    const rotation =
        parseFloat(
            object.dataset.rotation
        );


    object.style.left =
        x + "%";


    object.style.top =
        y + "%";


    object.style.transform =

        `
        translate(-50%, -50%)
        scale(${scale})
        rotate(${rotation}deg)
        `;

}


/* =========================================================
   タッチ操作
========================================================= */

function setupTouch(
    object
) {

    const pointers =
        new Map();


    let startX = 0;
    let startY = 0;


    let startObjectX = 0;
    let startObjectY = 0;


    let startDistance = 0;

    let startAngle = 0;


    let startScale = 1;

    let startRotation = 0;


    /* -----------------------------------------------------
       pointer down
    ----------------------------------------------------- */

    object.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            event.stopPropagation();


            selectObject(
                object
            );


            object.setPointerCapture(
                event.pointerId
            );


            pointers.set(
                event.pointerId,
                {

                    x:
                        event.clientX,

                    y:
                        event.clientY

                }
            );


            /* ---------------------------------------------
               1本指
            --------------------------------------------- */

            if (
                pointers.size === 1
            ) {

                startX =
                    event.clientX;


                startY =
                    event.clientY;


                startObjectX =
                    parseFloat(
                        object.dataset.x
                    );


                startObjectY =
                    parseFloat(
                        object.dataset.y
                    );

            }


            /* ---------------------------------------------
               2本指
            --------------------------------------------- */

            if (
                pointers.size === 2
            ) {

                const points =
                    [...pointers.values()];


                startDistance =
                    getDistance(
                        points[0],
                        points[1]
                    );


                startAngle =
                    getAngle(
                        points[0],
                        points[1]
                    );


                startScale =
                    parseFloat(
                        object.dataset.scale
                    );


                startRotation =
                    parseFloat(
                        object.dataset.rotation
                    );

            }

        }
    );


    /* -----------------------------------------------------
       pointer move
    ----------------------------------------------------- */

    object.addEventListener(
        "pointermove",
        event => {

            if (
                !pointers.has(
                    event.pointerId
                )
            ) {

                return;

            }


            event.preventDefault();


            pointers.set(
                event.pointerId,
                {

                    x:
                        event.clientX,

                    y:
                        event.clientY

                }
            );


            /* ---------------------------------------------
               1本指：移動
            --------------------------------------------- */

            if (
                pointers.size === 1
            ) {

                const dx =
                    event.clientX -
                    startX;


                const dy =
                    event.clientY -
                    startY;


                const percentX =
                    dx /
                    window.innerWidth *
                    100;


                const percentY =
                    dy /
                    window.innerHeight *
                    100;


                object.dataset.x =
                    String(
                        startObjectX +
                        percentX
                    );


                object.dataset.y =
                    String(
                        startObjectY +
                        percentY
                    );


                updateTransform(
                    object
                );

            }


            /* ---------------------------------------------
               2本指
            --------------------------------------------- */

            if (
                pointers.size === 2
            ) {

                const points =
                    [...pointers.values()];


                const currentDistance =
                    getDistance(
                        points[0],
                        points[1]
                    );


                const currentAngle =
                    getAngle(
                        points[0],
                        points[1]
                    );


                /* 拡大縮小 */

                if (
                    startDistance > 0
                ) {

                    let newScale =
                        startScale *
                        (
                            currentDistance /
                            startDistance
                        );


                    newScale =
                        Math.max(
                            0.15,
                            Math.min(
                                5,
                                newScale
                            )
                        );


                    object.dataset.scale =
                        String(
                            newScale
                        );

                }


                /* 回転 */

                const angleDifference =
                    currentAngle -
                    startAngle;


                object.dataset.rotation =
                    String(
                        startRotation +
                        angleDifference
                    );


                updateTransform(
                    object
                );

            }

        }
    );


    /* -----------------------------------------------------
       pointer up
    ----------------------------------------------------- */

    object.addEventListener(
        "pointerup",
        event => {

            pointers.delete(
                event.pointerId
            );

        }
    );


    /* -----------------------------------------------------
       pointer cancel
    ----------------------------------------------------- */

    object.addEventListener(
        "pointercancel",
        event => {

            pointers.delete(
                event.pointerId
            );

        }
    );


    /* -----------------------------------------------------
       click
    ----------------------------------------------------- */

    object.addEventListener(
        "click",
        event => {

            event.preventDefault();

            event.stopPropagation();

            selectObject(
                object
            );

        }
    );

}


/* =========================================================
   2点間距離
========================================================= */

function getDistance(
    a,
    b
) {

    return Math.hypot(
        b.x - a.x,
        b.y - a.y
    );

}


/* =========================================================
   2点間角度
========================================================= */

function getAngle(
    a,
    b
) {

    return (
        Math.atan2(
            b.y - a.y,
            b.x - a.x
        ) *
        180 /
        Math.PI
    );

}


/* =========================================================
   画像選択画面
========================================================= */

function showImagePicker() {

    currentMode =
        "image";


    pickerTitle.textContent =
        "🎃 追加する画像を選んでください";


    pickerGrid.innerHTML =
        "";


    AR_IMAGES.forEach(
        filename => {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                filename;


            img.className =
                "thumbnail";


            img.addEventListener(
                "click",
                () => {

                    addObject(
                        filename,
                        "image"
                    );


                    closePicker();

                }
            );


            pickerGrid.appendChild(
                img
            );

        }
    );


    picker.style.display =
        "block";

}


/* =========================================================
   フレーム選択
========================================================= */

function showFramePicker() {

    currentMode =
        "frame";


    pickerTitle.textContent =
        "🖼️ フレームを選んでください";


    pickerGrid.innerHTML =
        "";


    FRAMES.forEach(
        filename => {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                filename;


            img.className =
                "thumbnail";


            img.addEventListener(
                "click",
                () => {

                    addObject(
                        filename,
                        "frame"
                    );


                    closePicker();

                }
            );


            pickerGrid.appendChild(
                img
            );

        }
    );


    picker.style.display =
        "block";

}


/* =========================================================
   パネルを閉じる
========================================================= */

function closePicker() {

    picker.style.display =
        "none";

}


/* =========================================================
   画像ボタン
========================================================= */

imageButton.addEventListener(
    "click",
    () => {

        showImagePicker();

    }
);


/* =========================================================
   フレームボタン
========================================================= */

frameButton.addEventListener(
    "click",
    () => {

        showFramePicker();

    }
);


/* =========================================================
   選択中1枚削除
========================================================= */

deleteButton.addEventListener(
    "click",
    () => {

        if (
            !selectedObject
        ) {

            alert(
                "削除する画像をタップして選択してください。"
            );

            return;

        }


        selectedObject.remove();

        selectedObject =
            null;

    }
);


/* =========================================================
   全部削除
========================================================= */

clearButton.addEventListener(
    "click",
    () => {

        document
            .querySelectorAll(
                ".ar-object"
            )
            .forEach(
                object => {

                    object.remove();

                }
            );


        selectedObject =
            null;

    }
);


/* =========================================================
   パネル閉じる
========================================================= */

closePicker.addEventListener(
    "click",
    () => {

        closePicker();

    }
);


/* =========================================================
   背景をタップ
========================================================= */

objectLayer.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target ===
            objectLayer
        ) {

            selectObject(
                null
            );

        }

    }
);


/* =========================================================
   AR開始
========================================================= */

startButton.addEventListener(
    "click",
    () => {

        startScreen.style.display =
            "none";


        /*
           ARButtonをクリック
        */

        arButton.click();

    }
);


/* =========================================================
   Three.js描画
========================================================= */

renderer.setAnimationLoop(
    () => {

        renderer.render(
            scene,
            camera
        );

    }
);


/* =========================================================
   リサイズ
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>🎃 ハロウィン顔出しAR</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   AR画面
========================================================= */

#ar-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}


/* Three.js canvas */

canvas {
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
}


/* =========================================================
   AR画像を置く場所
========================================================= */

#image-layer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 20;
}


/* =========================================================
   AR画像
========================================================= */

.ar-image {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 180px;

    transform:
        translate(-50%, -50%)
        scale(1)
        rotate(0deg);

    transform-origin: center center;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;

    pointer-events: auto;

    cursor: move;
}


/* 選択中 */

.ar-image.selected {

    outline: 3px solid white;

    outline-offset: 3px;

    filter:
        drop-shadow(0 0 3px rgba(0,0,0,0.8));

}


/* =========================================================
   固定フレーム
========================================================= */

#frame-layer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 30;
}


#frame-image {

    width: 100%;
    height: 100%;

    object-fit: fill;

    display: none;
}


/* =========================================================
   上部タイトル
========================================================= */

#top-title {

    position: fixed;

    top: 12px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    color: white;

    background: rgba(0,0,0,0.55);

    padding: 8px 16px;

    border-radius: 20px;

    font-size: 16px;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================================
   操作ボタン
========================================================= */

#controls {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    padding:
        10px
        8px
        calc(10px + env(safe-area-inset-bottom));

    display: flex;

    justify-content: center;

    gap: 6px;

    flex-wrap: wrap;

    z-index: 200;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,0.75),
            rgba(0,0,0,0)
        );
}


.control-button {

    border: none;

    border-radius: 14px;

    padding: 10px 13px;

    background: rgba(40,40,40,0.88);

    color: white;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.35);

    touch-action: manipulation;
}


.control-button:active {

    transform: scale(0.94);

}


/* =========================================================
   選択パネル
========================================================= */

#picker {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    max-height: 48vh;

    overflow-y: auto;

    z-index: 300;

    display: none;

    padding: 12px;

    background:
        rgba(20,20,20,0.96);

    border-radius:
        18px
        18px
        0
        0;

    -webkit-overflow-scrolling: touch;
}


#picker-title {

    color: white;

    font-weight: bold;

    text-align: center;

    margin-bottom: 10px;

    font-size: 16px;
}


#picker-grid {

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 8px;
}


.thumbnail {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: contain;

    background: white;

    border-radius: 10px;

    padding: 3px;

    border: 2px solid transparent;

    touch-action: manipulation;
}


.thumbnail:active {

    transform: scale(0.94);

}


.close-picker {

    display: block;

    width: 100%;

    margin-top: 10px;

    padding: 10px;

    border: none;

    border-radius: 12px;

    background: #555;

    color: white;

    font-size: 15px;

    font-weight: bold;
}


/* =========================================================
   撮影案内
========================================================= */

#photo-guide {

    position: fixed;

    left: 50%;
    top: 62px;

    transform: translateX(-50%);

    z-index: 90;

    color: white;

    background: rgba(0,0,0,0.55);

    padding: 7px 13px;

    border-radius: 18px;

    font-size: 13px;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================================
   スタート画面
========================================================= */

#start-screen {

    position: fixed;

    inset: 0;

    z-index: 1000;

    background:
        linear-gradient(
            135deg,
            #16001f,
            #3d063d,
            #12001b
        );

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


#start-box {

    width: min(90vw, 420px);

    background: rgba(0,0,0,0.72);

    color: white;

    padding: 25px;

    border-radius: 24px;

    text-align: center;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.5);
}


#start-box h1 {

    font-size: 24px;

    margin:
        0
        0
        15px;
}


#start-box p {

    line-height: 1.7;

    font-size: 14px;

    margin-bottom: 20px;
}


#start-button {

    border: none;

    border-radius: 18px;

    padding: 14px 25px;

    background: #ff7a00;

    color: white;

    font-size: 18px;

    font-weight: bold;

}


#start-note {

    margin-top: 15px;

    font-size: 12px;

    opacity: 0.8;
}


/* =========================================================
   ARボタン
========================================================= */

button {

    font-family: inherit;

}

</style>
</head>


<body>


<!-- =======================================================
     AR本体
======================================================== -->

<div id="ar-container"></div>


<!-- =======================================================
     AR画像レイヤー
======================================================== -->

<div id="image-layer"></div>


<!-- =======================================================
     固定フレーム
======================================================== -->

<div id="frame-layer">

    <img
        id="frame-image"
        src=""
        alt=""
    >

</div>


<!-- =======================================================
     タイトル
======================================================== -->

<div id="top-title">

    🎃 ハロウィン顔出しAR

</div>


<div id="photo-guide">

    📱 完成したらスクリーンショット！

</div>


<!-- =======================================================
     操作ボタン
======================================================== -->

<div id="controls">

    <button
        class="control-button"
        id="image-button"
    >
        🎃 画像
    </button>

    <button
        class="control-button"
        id="frame-button"
    >
        🖼️ フレーム
    </button>

    <button
        class="control-button"
        id="delete-button"
    >
        🗑️ 1枚削除
    </button>

    <button
        class="control-button"
        id="clear-button"
    >
        🧹 全部消す
    </button>

</div>


<!-- =======================================================
     画像選択パネル
======================================================== -->

<div id="picker">

    <div id="picker-title">
        🎃 追加する画像を選んでください
    </div>

    <div id="picker-grid"></div>

    <button
        class="close-picker"
        id="close-picker"
    >
        ✕ 閉じる
    </button>

</div>


<!-- =======================================================
     スタート画面
======================================================== -->

<div id="start-screen">

    <div id="start-box">

        <h1>
            🎃 ハロウィン顔出しAR
        </h1>

        <p>
            カメラを起動して、<br>
            好きな画像を顔のまわりに配置しよう！
            <br><br>
            👆 1本指：移動<br>
            ✌️ 2本指：拡大・縮小・回転
            <br><br>
            同じ画像も何枚でも追加できます。
        </p>

        <button id="start-button">
            📷 ARをはじめる
        </button>

        <div id="start-note">
            ※ カメラの使用を許可してください
        </div>

    </div>

</div>


<!-- =======================================================
     Three.js
======================================================== -->

<script type="importmap">

{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}

</script>


<script type="module">

import * as THREE from "three";

import { ARButton }
    from "three/addons/webxr/ARButton.js";


/* =========================================================
   画像一覧
========================================================= */

const AR_IMAGES = [

    "rogo03.png",

    "bochi01.png",
    "bochi02.png",
    "bochi03.png",

    "gaikotu01.png",

    "mazyo01.png",
    "mazyo02.png",
    "mazyo03.png",

    "koumori01.png",
    "koumori02.png",
    "koumori03.png",

    "neko01.png",
    "neko02.png",

    "ame01.png",

    "obake01.png",
    "obake02.png",
    "obake03.png",
    "obake04.png",
    "obake05.png",
    "obake06.png",

    "hukugou01.png",

    "kabocha01.png",
    "kabocha02.png",
    "kabocha03.png",

    "rogo01.png",
    "rogo02.png"

];


/* =========================================================
   固定フレーム
========================================================= */

const FRAMES = [

    "flame01.png",
    "flame02.png",
    "flame03.png",
    "flame04.png",
    "flame05.png",
    "flame06.png",
    "flame07.png"

];


/* =========================================================
   Three.js
========================================================= */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        20
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: true,

        preserveDrawingBuffer: true

    });


renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.xr.enabled = true;


document
    .getElementById("ar-container")
    .appendChild(renderer.domElement);


/* =========================================================
   ARButton
========================================================= */

const arButton =
    ARButton.createButton(
        renderer,
        {

            requiredFeatures: [
                "dom-overlay"
            ],

            domOverlay: {
                root: document.body
            }

        }
    );


arButton.style.display = "none";

document.body.appendChild(arButton);


/* =========================================================
   リサイズ
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   DOM
========================================================= */

const startScreen =
    document.getElementById(
        "start-screen"
    );


const startButton =
    document.getElementById(
        "start-button"
    );


const imageLayer =
    document.getElementById(
        "image-layer"
    );


const frameImage =
    document.getElementById(
        "frame-image"
    );


const picker =
    document.getElementById(
        "picker"
    );


const pickerTitle =
    document.getElementById(
        "picker-title"
    );


const pickerGrid =
    document.getElementById(
        "picker-grid"
    );


const imageButton =
    document.getElementById(
        "image-button"
    );


const frameButton =
    document.getElementById(
        "frame-button"
    );


const deleteButton =
    document.getElementById(
        "delete-button"
    );


const clearButton =
    document.getElementById(
        "clear-button"
    );


const closePicker =
    document.getElementById(
        "close-picker"
    );


/* =========================================================
   状態
========================================================= */

let selectedImage = null;

let pickerMode = "image";

let imageCounter = 0;


/* =========================================================
   画像追加
========================================================= */

function addImage(filename) {

    const img =
        document.createElement("img");

    img.src = filename;

    img.className = "ar-image";

    img.draggable = false;

    img.dataset.x = "50";
    img.dataset.y = "50";

    img.dataset.scale = "1";
    img.dataset.rotation = "0";

    img.dataset.id =
        "image-" + imageCounter++;

    imageLayer.appendChild(img);

    selectImage(img);

    setupImageTouch(img);

}


/* =========================================================
   画像選択
========================================================= */

function selectImage(img) {

    document
        .querySelectorAll(".ar-image")
        .forEach(item => {

            item.classList.remove(
                "selected"
            );

        });


    selectedImage = img;


    if (selectedImage) {

        selectedImage.classList.add(
            "selected"
        );

        selectedImage.style.zIndex =
            String(50 + imageCounter);

    }

}


/* =========================================================
   画像位置更新
========================================================= */

function updateTransform(img) {

    const x =
        parseFloat(img.dataset.x);

    const y =
        parseFloat(img.dataset.y);

    const scale =
        parseFloat(img.dataset.scale);

    const rotation =
        parseFloat(img.dataset.rotation);


    img.style.left =
        x + "%";

    img.style.top =
        y + "%";


    img.style.transform =
        `
        translate(-50%, -50%)
        scale(${scale})
        rotate(${rotation}deg)
        `;

}


/* =========================================================
   タッチ操作
========================================================= */

function setupImageTouch(img) {

    const pointers =
        new Map();


    let startX = 0;
    let startY = 0;

    let startImgX = 0;
    let startImgY = 0;

    let startDistance = 0;
    let startAngle = 0;

    let startScale = 1;
    let startRotation = 0;


    img.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            selectImage(img);

            img.setPointerCapture(
                event.pointerId
            );

            pointers.set(
                event.pointerId,
                {
                    x: event.clientX,
                    y: event.clientY
                }
            );


            /* -----------------------------------------
               1本指
            ----------------------------------------- */

            if (pointers.size === 1) {

                startX =
                    event.clientX;

                startY =
                    event.clientY;


                startImgX =
                    parseFloat(
                        img.dataset.x
                    );

                startImgY =
                    parseFloat(
                        img.dataset.y
                    );

            }


            /* -----------------------------------------
               2本指
            ----------------------------------------- */

            if (pointers.size === 2) {

                const pts =
                    [...pointers.values()];


                startDistance =
                    distance(
                        pts[0],
                        pts[1]
                    );


                startAngle =
                    angle(
                        pts[0],
                        pts[1]
                    );


                startScale =
                    parseFloat(
                        img.dataset.scale
                    );


                startRotation =
                    parseFloat(
                        img.dataset.rotation
                    );

            }

        }
    );


    img.addEventListener(
        "pointermove",
        event => {

            if (
                !pointers.has(
                    event.pointerId
                )
            ) {
                return;
            }


            pointers.set(
                event.pointerId,
                {
                    x: event.clientX,
                    y: event.clientY
                }
            );


            /* -----------------------------------------
               1本指：移動
            ----------------------------------------- */

            if (pointers.size === 1) {

                const dx =
                    event.clientX -
                    startX;

                const dy =
                    event.clientY -
                    startY;


                const percentX =
                    dx /
                    window.innerWidth *
                    100;


                const percentY =
                    dy /
                    window.innerHeight *
                    100;


                img.dataset.x =
                    String(
                        startImgX +
                        percentX
                    );


                img.dataset.y =
                    String(
                        startImgY +
                        percentY
                    );


                updateTransform(img);

            }


            /* -----------------------------------------
               2本指：拡大縮小＋回転
            ----------------------------------------- */

            if (pointers.size === 2) {

                const pts =
                    [...pointers.values()];


                const currentDistance =
                    distance(
                        pts[0],
                        pts[1]
                    );


                const currentAngle =
                    angle(
                        pts[0],
                        pts[1]
                    );


                if (
                    startDistance > 0
                ) {

                    let newScale =
                        startScale *
                        (
                            currentDistance /
                            startDistance
                        );


                    newScale =
                        Math.max(
                            0.2,
                            Math.min(
                                5,
                                newScale
                            )
                        );


                    img.dataset.scale =
                        String(newScale);

                }


                const angleDifference =
                    currentAngle -
                    startAngle;


                img.dataset.rotation =
                    String(
                        startRotation +
                        angleDifference
                    );


                updateTransform(img);

            }

        }
    );


    img.addEventListener(
        "pointerup",
        event => {

            pointers.delete(
                event.pointerId
            );

        }
    );


    img.addEventListener(
        "pointercancel",
        event => {

            pointers.delete(
                event.pointerId
            );

        }
    );


    img.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            selectImage(img);

        }
    );

}


/* =========================================================
   2点間距離
========================================================= */

function distance(a, b) {

    return Math.hypot(
        b.x - a.x,
        b.y - a.y
    );

}


/* =========================================================
   2点間角度
========================================================= */

function angle(a, b) {

    return Math.atan2(
        b.y - a.y,
        b.x - a.x
    ) * 180 / Math.PI;

}


/* =========================================================
   画像選択パネル生成
========================================================= */

function showImagePicker() {

    pickerMode = "image";

    pickerTitle.textContent =
        "🎃 追加する画像を選んでください";

    pickerGrid.innerHTML = "";


    AR_IMAGES.forEach(
        filename => {

            const img =
                document.createElement(
                    "img"
                );

            img.src = filename;

            img.className =
                "thumbnail";


            img.addEventListener(
                "click",
                () => {

                    addImage(filename);

                    closePickerPanel();

                }
            );


            pickerGrid.appendChild(img);

        }
    );


    picker.style.display =
        "block";

}


/* =========================================================
   フレーム選択パネル
========================================================= */

function showFramePicker() {

    pickerMode = "frame";

    pickerTitle.textContent =
        "🖼️ フレームを選んでください";

    pickerGrid.innerHTML = "";


    FRAMES.forEach(
        filename => {

            const img =
                document.createElement(
                    "img"
                );

            img.src = filename;

            img.className =
                "thumbnail";


            img.addEventListener(
                "click",
                () => {

                    frameImage.src =
                        filename;

                    frameImage.style.display =
                        "block";

                    closePickerPanel();

                }
            );


            pickerGrid.appendChild(img);

        }
    );


    picker.style.display =
        "block";

}


/* =========================================================
   パネルを閉じる
========================================================= */

function closePickerPanel() {

    picker.style.display =
        "none";

}


/* =========================================================
   画像ボタン
========================================================= */

imageButton.addEventListener(
    "click",
    () => {

        showImagePicker();

    }
);


/* =========================================================
   フレームボタン
========================================================= */

frameButton.addEventListener(
    "click",
    () => {

        showFramePicker();

    }
);


/* =========================================================
   1枚削除
========================================================= */

deleteButton.addEventListener(
    "click",
    () => {

        if (!selectedImage) {

            alert(
                "削除する画像をタップして選択してください。"
            );

            return;

        }


        selectedImage.remove();

        selectedImage = null;

    }
);


/* =========================================================
   全部削除
========================================================= */

clearButton.addEventListener(
    "click",
    () => {

        const images =
            document.querySelectorAll(
                ".ar-image"
            );


        images.forEach(
            img => img.remove()
        );


        selectedImage = null;

    }
);


/* =========================================================
   閉じる
========================================================= */

closePicker.addEventListener(
    "click",
    closePickerPanel
);


/* =========================================================
   画像レイヤーをタップしたとき
========================================================= */

imageLayer.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target === imageLayer
        ) {

            selectImage(null);

        }

    }
);


/* =========================================================
   AR開始
========================================================= */

startButton.addEventListener(
    "click",
    () => {

        startScreen.style.display =
            "none";

        arButton.click();

    }
);


/* =========================================================
   Three.jsループ
========================================================= */

renderer.setAnimationLoop(
    () => {

        renderer.render(
            scene,
            camera
        );

    }
);


/* =========================================================
   最初の表示
========================================================= */

frameImage.style.display =
    "none";


</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>🎃 ハロウィン顔出しパネル</title>

<style>

/* =========================================================
   基本
========================================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    touch-action: none;
}


/* =========================================================
   カメラ
========================================================= */

#camera {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    object-fit: cover;

    background: #000;

    z-index: 1;

    transform: none;
}


/* =========================================================
   AR画像レイヤー
========================================================= */

#object-layer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    z-index: 10;

    pointer-events: none;
}


/* =========================================================
   配置する画像
========================================================= */

.ar-object {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 180px;

    user-select: none;
    -webkit-user-select: none;

    pointer-events: auto;

    transform:
        translate(-50%, -50%)
        scale(1)
        rotate(0deg);

    transform-origin: center center;

    touch-action: none;

    -webkit-user-drag: none;

    object-fit: contain;

}


/* =========================================================
   選択中の画像
========================================================= */

.ar-object.selected {

    outline: 3px solid white;

    outline-offset: 4px;

}


/* =========================================================
   上部タイトル
========================================================= */

#title {

    position: fixed;

    left: 50%;
    top: 12px;

    transform: translateX(-50%);

    z-index: 50;

    color: white;

    font-size: 18px;

    font-weight: bold;

    text-shadow:
        0 2px 4px black,
        0 0 8px black;

    white-space: nowrap;

}


/* =========================================================
   操作ボタン
========================================================= */

#controls {

    position: fixed;

    left: 0;
    bottom: 10px;

    width: 100%;

    z-index: 100;

    display: flex;

    justify-content: center;

    gap: 6px;

    padding: 0 6px;

    box-sizing: border-box;

}


.control-button {

    border: none;

    border-radius: 12px;

    background: rgba(0,0,0,0.75);

    color: white;

    font-size: 14px;

    font-weight: bold;

    padding: 11px 10px;

    min-width: 62px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.4);

    cursor: pointer;

}


.control-button:active {

    transform: scale(0.94);

}


/* =========================================================
   選択画面
========================================================= */

#picker {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    z-index: 200;

    background:
        rgba(0,0,0,0.90);

    display: none;

    flex-direction: column;

}


#picker-header {

    height: 55px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    box-sizing: border-box;

    color: white;

    font-size: 18px;

    font-weight: bold;

}


#picker-close {

    border: none;

    background: #444;

    color: white;

    border-radius: 10px;

    padding: 8px 14px;

    font-size: 15px;

}


#picker-grid {

    flex: 1;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    padding: 10px;

    box-sizing: border-box;

}


.picker-item {

    background: white;

    border-radius: 12px;

    min-height: 110px;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 5px;

    box-sizing: border-box;

}


.picker-item img {

    width: 100%;

    height: 100%;

    max-height: 130px;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

}


/* =========================================================
   スタート画面
========================================================= */

#start-screen {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    z-index: 500;

    background:
        linear-gradient(
            180deg,
            #16001e,
            #000
        );

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 25px;

    box-sizing: border-box;

}


#start-screen h1 {

    margin: 0 0 18px;

    font-size: 27px;

}


#start-screen p {

    margin: 7px 0;

    font-size: 15px;

    line-height: 1.6;

}


#start-button {

    margin-top: 25px;

    border: none;

    border-radius: 18px;

    background: #ff7b00;

    color: white;

    font-size: 20px;

    font-weight: bold;

    padding: 16px 35px;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.4);

}


#start-button:active {

    transform: scale(0.95);

}


/* =========================================================
   撮影後画面
========================================================= */

#photo-result {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    z-index: 400;

    background: rgba(0,0,0,0.96);

    display: none;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 15px;

    box-sizing: border-box;

}


#photo-result img {

    max-width: 100%;

    max-height: 75vh;

    object-fit: contain;

    border-radius: 10px;

}


#photo-buttons {

    display: flex;

    gap: 10px;

    margin-top: 15px;

}


.photo-button {

    border: none;

    border-radius: 12px;

    padding: 12px 18px;

    color: white;

    background: #444;

    font-size: 15px;

    font-weight: bold;

}


#save-photo {

    background: #e87500;

}


/* =========================================================
   メッセージ
========================================================= */

#message {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 600;

    background:
        rgba(0,0,0,0.85);

    color: white;

    padding: 16px 22px;

    border-radius: 14px;

    font-size: 16px;

    font-weight: bold;

    text-align: center;

    display: none;

    max-width: 85vw;

}


</style>

</head>


<body>


<!-- =====================================================
     カメラ
===================================================== -->

<video
    id="camera"
    autoplay
    playsinline
    muted
></video>


<!-- =====================================================
     画像レイヤー
===================================================== -->

<div id="object-layer"></div>


<!-- =====================================================
     タイトル
===================================================== -->

<div id="title">
    🎃 ハロウィン顔出しパネル
</div>


<!-- =====================================================
     操作ボタン
===================================================== -->

<div id="controls">

    <button
        class="control-button"
        id="image-button"
    >
        🎃画像
    </button>

    <button
        class="control-button"
        id="frame-button"
    >
        🖼️フレーム
    </button>

    <button
        class="control-button"
        id="delete-button"
    >
        🗑️1枚削除
    </button>

    <button
        class="control-button"
        id="clear-button"
    >
        🧹全部消す
    </button>

    <button
        class="control-button"
        id="photo-button"
    >
        📸撮影
    </button>

</div>


<!-- =====================================================
     画像選択
===================================================== -->

<div id="picker">

    <div id="picker-header">

        <span id="picker-title">
            🎃 画像を選んでください
        </span>

        <button id="picker-close">
            ✕ 閉じる
        </button>

    </div>

    <div id="picker-grid"></div>

</div>


<!-- =====================================================
     撮影結果
===================================================== -->

<div id="photo-result">

    <img
        id="result-image"
        alt="撮影した写真"
    >

    <div id="photo-buttons">

        <button
            class="photo-button"
            id="save-photo"
        >
            💾 写真を保存
        </button>

        <button
            class="photo-button"
            id="retake-photo"
        >
            ↩ 戻る
        </button>

    </div>

</div>


<!-- =====================================================
     スタート画面
===================================================== -->

<div id="start-screen">

    <h1>
        🎃 ハロウィン<br>
        顔出しパネル
    </h1>

    <p>
        スマートフォンのカメラを使って<br>
        ハロウィン写真を撮影できます。
    </p>

    <p>
        🎃画像や 🖼️フレームを追加して<br>
        指で自由に動かしてください。
    </p>

    <p>
        1本指：移動<br>
        2本指：拡大・縮小・回転
    </p>

    <button id="start-button">
        📷 カメラを起動
    </button>

</div>


<!-- =====================================================
     メッセージ
===================================================== -->

<div id="message"></div>


<script>


/* =========================================================
   要素
========================================================= */

const camera =
    document.getElementById("camera");

const objectLayer =
    document.getElementById("object-layer");

const startScreen =
    document.getElementById("start-screen");

const startButton =
    document.getElementById("start-button");

const picker =
    document.getElementById("picker");

const pickerGrid =
    document.getElementById("picker-grid");

const pickerTitle =
    document.getElementById("picker-title");

const pickerClose =
    document.getElementById("picker-close");

const imageButton =
    document.getElementById("image-button");

const frameButton =
    document.getElementById("frame-button");

const deleteButton =
    document.getElementById("delete-button");

const clearButton =
    document.getElementById("clear-button");

const photoButton =
    document.getElementById("photo-button");

const photoResult =
    document.getElementById("photo-result");

const resultImage =
    document.getElementById("result-image");

const savePhoto =
    document.getElementById("save-photo");

const retakePhoto =
    document.getElementById("retake-photo");

const message =
    document.getElementById("message");


/* =========================================================
   ファイル一覧
========================================================= */

const normalImages = [

    "rogo03.png",

    "bochi01.png",
    "bochi02.png",
    "bochi03.png",

    "gaikotu01.png",

    "mazyo01.png",
    "mazyo02.png",
    "mazyo03.png",

    "koumori01.png",
    "koumori02.png",
    "koumori03.png",

    "neko01.png",
    "neko02.png",

    "ame01.png",

    "obake01.png",
    "obake02.png",
    "obake03.png",
    "obake04.png",
    "obake05.png",
    "obake06.png",

    "hukugou01.png",

    "kabocha01.png",
    "kabocha02.png",
    "kabocha03.png",

    "rogo01.png",
    "rogo02.png"

];


const frameImages = [

    "flame01.png",
    "flame02.png",
    "flame03.png",
    "flame04.png",
    "flame05.png",
    "flame06.png",
    "flame07.png"

];


/* =========================================================
   状態
========================================================= */

let selectedObject = null;

let currentPickerType = "image";

let cameraStream = null;

let objectId = 0;


/* =========================================================
   メッセージ
========================================================= */

function showMessage(text, time = 1800) {

    message.textContent = text;

    message.style.display = "block";

    setTimeout(() => {

        message.style.display = "none";

    }, time);

}


/* =========================================================
   カメラ起動
========================================================= */

async function startCamera() {

    try {

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                         ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }

                },

                audio: false

            });


        camera.srcObject =
            cameraStream;

        await camera.play();


        startScreen.style.display =
            "none";


    } catch (error) {

        console.error(error);

        alert(
            "カメラを起動できませんでした。\n\n" +
            "ブラウザのカメラ使用を許可してください。"
        );

    }

}


/* =========================================================
   スタート
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   画像選択画面
========================================================= */

function openPicker(type) {

    currentPickerType =
        type;

    pickerGrid.innerHTML =
        "";

    const files =
        type === "image"
            ? normalImages
            : frameImages;


    pickerTitle.textContent =
        type === "image"
            ? "🎃 画像を選んでください"
            : "🖼️ フレームを選んでください";


    files.forEach(
        filename => {

            const item =
                document.createElement("div");

            item.className =
                "picker-item";


            const img =
                document.createElement("img");

            img.src =
                filename;

            img.alt =
                filename;

            img.draggable =
                false;


            item.appendChild(img);


            item.addEventListener(
                "click",
                () => {

                    addObject(
                        filename,
                        type
                    );

                    closePicker();

                }
            );


            pickerGrid.appendChild(item);

        }
    );


    picker.style.display =
        "flex";

}


function closePicker() {

    picker.style.display =
        "none";

}


imageButton.addEventListener(
    "click",
    () => openPicker("image")
);


frameButton.addEventListener(
    "click",
    () => openPicker("frame")
);


pickerClose.addEventListener(
    "click",
    closePicker
);


/* =========================================================
   オブジェクト追加
========================================================= */

function addObject(filename, type) {


    /* ---------------------------------------------
       フレームは1枚だけ
    --------------------------------------------- */

    if (type === "frame") {

        const oldFrame =
            objectLayer.querySelector(
                '[data-type="frame"]'
            );

        if (oldFrame) {

            oldFrame.remove();

        }

    }


    const img =
        document.createElement("img");


    img.src =
        filename;

    img.className =
        "ar-object";

    img.dataset.type =
        type;

    img.dataset.id =
        ++objectId;

    img.dataset.x =
        "50";

    img.dataset.y =
        "50";

    img.dataset.scale =
        type === "frame"
            ? "0.90"
            : "1";

    img.dataset.rotation =
        "0";


    if (type === "frame") {

        img.style.width =
            "90vw";

    } else {

        img.style.width =
            "180px";

    }


    img.draggable =
        false;


    objectLayer.appendChild(img);


    selectObject(img);

    enableObjectTouch(img);

}


/* =========================================================
   オブジェクト選択
========================================================= */

function selectObject(obj) {

    if (selectedObject) {

        selectedObject.classList.remove(
            "selected"
        );

    }


    selectedObject =
        obj;


    if (selectedObject) {

        selectedObject.classList.add(
            "selected"
        );

    }

}


/* =========================================================
   タップ選択
========================================================= */

objectLayer.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target.classList.contains(
                "ar-object"
            )
        ) {

            selectObject(
                event.target
            );

        }

    }
);


/* =========================================================
   タッチ操作
========================================================= */

function enableObjectTouch(obj) {


    let pointers = new Map();

    let startX = 0;
    let startY = 0;

    let startObjectX = 0;
    let startObjectY = 0;

    let startDistance = 0;
    let startAngle = 0;

    let startScale = 1;
    let startRotation = 0;


    obj.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            selectObject(obj);


            obj.setPointerCapture(
                event.pointerId
            );


            pointers.set(
                event.pointerId,
                {
                    x: event.clientX,
                    y: event.clientY
                }
            );


            if (pointers.size === 1) {

                startX =
                    event.clientX;

                startY =
                    event.clientY;

                startObjectX =
                    parseFloat(
                        obj.dataset.x
                    );

                startObjectY =
                    parseFloat(
                        obj.dataset.y
                    );

            }


            if (pointers.size === 2) {

                const values =
                    [...pointers.values()];


                startDistance =
                    distance(
                        values[0],
                        values[1]
                    );


                startAngle =
                    angle(
                        values[0],
                        values[1]
                    );


                startScale =
                    parseFloat(
                        obj.dataset.scale
                    );


                startRotation =
                    parseFloat(
                        obj.dataset.rotation
                    );

            }

        }
    );


    obj.addEventListener(
        "pointermove",
        event => {

            if (
                !pointers.has(
                    event.pointerId
                )
            ) {

                return;

            }


            event.preventDefault();


            pointers.set(
                event.pointerId,
                {
                    x: event.clientX,
                    y: event.clientY
                }
            );


            /* -----------------------------------------
               1本指：移動
            ----------------------------------------- */

            if (pointers.size === 1) {

                const dx =
                    event.clientX -
                    startX;

                const dy =
                    event.clientY -
                    startY;


                const x =
                    startObjectX +
                    dx /
                    window.innerWidth *
                    100;


                const y =
                    startObjectY +
                    dy /
                    window.innerHeight *
                    100;


                obj.dataset.x =
                    x;

                obj.dataset.y =
                    y;


                updateTransform(obj);

            }


            /* -----------------------------------------
               2本指：拡大縮小＋回転
            ----------------------------------------- */

            if (pointers.size === 2) {

                const values =
                    [...pointers.values()];


                const currentDistance =
                    distance(
                        values[0],
                        values[1]
                    );


                const currentAngle =
                    angle(
                        values[0],
                        values[1]
                    );


                let scale =
                    startScale *
                    (
                        currentDistance /
                        startDistance
                    );


                scale =
                    Math.max(
                        0.15,
                        Math.min(
                            5,
                            scale
                        )
                    );


                const rotation =
                    startRotation +
                    (
                        currentAngle -
                        startAngle
                    );


                obj.dataset.scale =
                    scale;

                obj.dataset.rotation =
                    rotation;


                updateTransform(obj);

            }

        }
    );


    obj.addEventListener(
        "pointerup",
        event => {

            pointers.delete(
                event.pointerId
            );

        }
    );


    obj.addEventListener(
        "pointercancel",
        event => {

            pointers.delete(
                event.pointerId
            );

        }
    );

}


/* =========================================================
   距離
========================================================= */

function distance(a, b) {

    return Math.sqrt(

        Math.pow(
            b.x - a.x,
            2
        )

        +

        Math.pow(
            b.y - a.y,
            2
        )

    );

}


/* =========================================================
   角度
========================================================= */

function angle(a, b) {

    return Math.atan2(

        b.y - a.y,

        b.x - a.x

    ) * 180 / Math.PI;

}


/* =========================================================
   transform更新
========================================================= */

function updateTransform(obj) {

    const x =
        parseFloat(
            obj.dataset.x
        );

    const y =
        parseFloat(
            obj.dataset.y
        );

    const scale =
        parseFloat(
            obj.dataset.scale
        );

    const rotation =
        parseFloat(
            obj.dataset.rotation
        );


    obj.style.left =
        x + "%";

    obj.style.top =
        y + "%";


    obj.style.transform =

        "translate(-50%, -50%) " +

        "scale(" +
        scale +
        ") " +

        "rotate(" +
        rotation +
        "deg)";

}


/* =========================================================
   1枚削除
========================================================= */

deleteButton.addEventListener(
    "click",
    () => {

        if (!selectedObject) {

            showMessage(
                "削除する画像をタップしてください"
            );

            return;

        }


        selectedObject.remove();

        selectedObject =
            null;

    }
);


/* =========================================================
   全部削除
========================================================= */

clearButton.addEventListener(
    "click",
    () => {

        if (
            !confirm(
                "配置した画像を全部消しますか？"
            )
        ) {

            return;

        }


        objectLayer.innerHTML =
            "";

        selectedObject =
            null;

    }
);


/* =========================================================
   撮影
========================================================= */

photoButton.addEventListener(
    "click",
    takePhoto
);


async function takePhoto() {

    if (
        !cameraStream ||
        camera.readyState <
        2
    ) {

        showMessage(
            "カメラが起動していません"
        );

        return;

    }


    /* ---------------------------------------------
       カメラ映像の実際のサイズ
    --------------------------------------------- */

    const videoWidth =
        camera.videoWidth;

    const videoHeight =
        camera.videoHeight;


    if (
        !videoWidth ||
        !videoHeight
    ) {

        showMessage(
            "カメラ映像を取得できません"
        );

        return;

    }


    /* ---------------------------------------------
       撮影用canvas
    --------------------------------------------- */

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        videoWidth;

    canvas.height =
        videoHeight;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /* ---------------------------------------------
       object-fit: cover の計算
    --------------------------------------------- */

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;


    const videoRatio =
        videoWidth /
        videoHeight;

    const screenRatio =
        screenWidth /
        screenHeight;


    let drawWidth;
    let drawHeight;
    let offsetX;
    let offsetY;


    if (
        videoRatio >
        screenRatio
    ) {

        drawHeight =
            screenHeight;

        drawWidth =
            drawHeight *
            videoRatio;

        offsetX =
            (
                screenWidth -
                drawWidth
            ) / 2;

        offsetY =
            0;

    } else {

        drawWidth =
            screenWidth;

        drawHeight =
            drawWidth /
            videoRatio;

        offsetX =
            0;

        offsetY =
            (
                screenHeight -
                drawHeight
            ) / 2;

    }


    /* ---------------------------------------------
       カメラ画像
       プレビューが左右反転なので
       撮影画像も左右反転
    --------------------------------------------- */

    ctx.save();


    ctx.translate(
        canvas.width,
        0
    );


    ctx.scale(
        -1,
        1
    );


    const sx =
        -offsetX /
        drawWidth *
        videoWidth;


    const sy =
        -offsetY /
        drawHeight *
        videoHeight;


    const sw =
        screenWidth /
        drawWidth *
        videoWidth;


    const sh =
        screenHeight /
        drawHeight *
        videoHeight;


    ctx.drawImage(

        camera,

        sx,
        sy,
        sw,
        sh,

        0,
        0,
        canvas.width,
        canvas.height

    );


    ctx.restore();


    /* ---------------------------------------------
       PNGオブジェクトを合成
    --------------------------------------------- */

    const objects =
        [...objectLayer.querySelectorAll(
            ".ar-object"
        )];


    for (
        const obj of objects
    ) {

        await drawObjectToCanvas(
            ctx,
            obj,
            screenWidth,
            screenHeight,
            canvas.width,
            canvas.height
        );

    }


    /* ---------------------------------------------
       写真生成
    --------------------------------------------- */

    const imageData =
        canvas.toDataURL(
            "image/jpeg",
            0.92
        );


    resultImage.src =
        imageData;


    photoResult.style.display =
        "flex";


}


/* =========================================================
   オブジェクトをcanvasに描画
========================================================= */

function drawObjectToCanvas(

    ctx,
    obj,
    screenWidth,
    screenHeight,
    canvasWidth,
    canvasHeight

) {

    return new Promise(
        resolve => {

            const img =
                new Image();


            img.onload =
                () => {

                    const rect =
                        obj.getBoundingClientRect();


                    const centerX =
                        (
                            rect.left +
                            rect.width / 2
                        );


                    const centerY =
                        (
                            rect.top +
                            rect.height / 2
                        );


                    const scaleX =
                        canvasWidth /
                        screenWidth;


                    const scaleY =
                        canvasHeight /
                        screenHeight;


                    const x =
                        centerX *
                        scaleX;


                    const y =
                        centerY *
                        scaleY;


                    const width =
                        rect.width *
                        scaleX;


                    const height =
                        rect.height *
                        scaleY;


                    const rotation =
                        parseFloat(
                            obj.dataset.rotation
                        );


                    ctx.save();


                    ctx.translate(
                        x,
                        y
                    );


                    ctx.rotate(
                        rotation *
                        Math.PI /
                        180
                    );


                    /*
                     * rectはtransform後のサイズなので
                     * そのまま描画
                     */

                    ctx.drawImage(

                        img,

                        -width / 2,

                        -height / 2,

                        width,

                        height

                    );


                    ctx.restore();


                    resolve();

                };


            img.onerror =
                () => {

                    resolve();

                };


            img.src =
                obj.src;

        }
    );

}


/* =========================================================
   撮影結果を閉じる
========================================================= */

retakePhoto.addEventListener(
    "click",
    () => {

        photoResult.style.display =
            "none";

    }
);


/* =========================================================
   写真保存
========================================================= */

savePhoto.addEventListener(
    "click",
    async () => {

        const dataUrl =
            resultImage.src;


        /*
         * Web Share API
         * Android / 一部iPhone
         */

        try {

            const response =
                await fetch(
                    dataUrl
                );


            const blob =
                await response.blob();


            const file =
                new File(
                    [blob],
                    "halloween-photo.jpg",
                    {
                        type:
                            "image/jpeg"
                    }
                );


            if (
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                    files: [file]
                })
            ) {

                await navigator.share({

                    files: [file],

                    title:
                        "ハロウィン写真"

                });

                return;

            }

        } catch (error) {

            console.log(
                "共有を使用できません",
                error
            );

        }


        /*
         * Web Share非対応の場合
         */

        const link =
            document.createElement("a");

        link.href =
            dataUrl;

        link.download =
            "halloween-photo.jpg";

        document.body.appendChild(
            link
        );

        link.click();

        link.remove();


        showMessage(
            "写真を保存しました"
        );

    }
);


/* =========================================================
   ページ終了時にカメラ停止
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (cameraStream) {

            cameraStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);

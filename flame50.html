
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
               user-scalable=no, viewport-fit=cover">
<title>顔出しフォトパネル</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}

#camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
  background: #000;
}

#panel {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 90vw;
  max-width: 700px;
  height: auto;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  z-index: 2;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  touch-action: none;
}

#help {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  padding: 8px 12px;
  border-radius: 20px;
  background: rgba(0,0,0,.65);
  color: white;
  font-size: 13px;
  white-space: nowrap;
}

button {
  border: none;
  border-radius: 28px;
  padding: 11px 13px;
  background: rgba(255,255,255,.96);
  color: #222;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  opacity: .8;
}

button:disabled {
  opacity: .5;
}

.panelButton.active {
  background: #222;
  color: white;
}

/* パネル選択ボタン：縦向き */
#panelButtons {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(82px + env(safe-area-inset-bottom));
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  padding: 0 6px;
}

/* 撮影・リセット：縦向き */
#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 10;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 0 10px;
}

#controls button {
  min-width: 112px;
}

/* 施設名・日付の表示 */
#logoText {
  position: fixed;
  left: 50%;
  top: 16%;
  z-index: 5;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  color: white;
  text-align: center;
  white-space: nowrap;
  font-weight: bold;
  text-shadow:
    -2px -2px 3px #000,
     2px -2px 3px #000,
    -2px  2px 3px #000,
     2px  2px 3px #000;
  pointer-events: auto;
  touch-action: none;
  user-select: none;
}

#logoTitle {
  display: block;
  font-size: clamp(18px, 4vw, 34px);
}

#logoDate {
  display: block;
  margin-top: 4px;
  font-size: clamp(13px, 2.8vw, 23px);
}

#logoToggle {
  position: fixed;
  top: calc(52px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 11;
  padding: 7px 12px;
  font-size: 12px;
}

#photoCanvas {
  display: none;
}

/* 撮影後のプレビュー */
#previewScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #000;
  align-items: center;
  justify-content: center;
}

#previewImage {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#previewControls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(16px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 0 12px;
}

#previewControls button {
  min-width: 125px;
  padding: 14px 16px;
  font-size: 16px;
}

#saveHelp {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: calc(82px + env(safe-area-inset-bottom));
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(0,0,0,.78);
  color: white;
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
  display: none;
}

/* ========================================
   横向きレイアウト
   画面の左右端にボタンを配置し、
   パネルの顔部分に重なりにくくする
======================================== */
@media (orientation: landscape) {
  #help {
    top: calc(8px + env(safe-area-inset-top));
    left: 50%;
    font-size: 11px;
    padding: 6px 9px;
  }

  /* パネル選択：左端に縦並び */
  #panelButtons {
    top: 50%;
    left: calc(8px + env(safe-area-inset-left));
    right: auto;
    bottom: auto;
    transform: translateY(-50%);
    flex-direction: column;
    flex-wrap: nowrap;
    align-items: stretch;
    justify-content: center;
    gap: 7px;
    padding: 0;
    max-height: 76vh;
  }

  #panelButtons button {
    padding: 9px 10px;
    font-size: 12px;
    min-width: 0;
    white-space: nowrap;
  }

  /* 撮影・リセット：右端に縦並び */
  #controls {
    top: 50%;
    left: auto;
    right: calc(8px + env(safe-area-inset-right));
    bottom: auto;
    transform: translateY(-50%);
    flex-direction: column;
    align-items: stretch;
    gap: 9px;
    padding: 0;
  }

  #controls button {
    min-width: 0;
    padding: 10px 12px;
    font-size: 12px;
    white-space: nowrap;
  }

  #logoToggle {
    top: calc(8px + env(safe-area-inset-top));
    left: auto;
    right: calc(8px + env(safe-area-inset-right));
    transform: none;
    font-size: 11px;
    padding: 6px 9px;
  }

  #logoText {
    top: 17%;
  }

  #logoTitle {
    font-size: clamp(15px, 3vw, 26px);
  }

  #logoDate {
    font-size: clamp(11px, 2vw, 18px);
  }

  /* 撮影後のボタンも横向きに対応 */
  #previewControls {
    left: auto;
    right: calc(10px + env(safe-area-inset-right));
    bottom: calc(12px + env(safe-area-inset-bottom));
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 0;
  }

  #previewControls button {
    min-width: 0;
    padding: 10px 12px;
    font-size: 13px;
  }

  #saveHelp {
    left: 12px;
    right: calc(145px + env(safe-area-inset-right));
    bottom: calc(12px + env(safe-area-inset-bottom));
    font-size: 11px;
  }
}

/* 高さの低い横向き画面ではボタンをさらに小さく */
@media (orientation: landscape) and (max-height: 420px) {
  #panelButtons {
    left: calc(5px + env(safe-area-inset-left));
    gap: 4px;
  }

  #panelButtons button {
    padding: 6px 7px;
    font-size: 10px;
  }

  #controls {
    right: calc(5px + env(safe-area-inset-right));
    gap: 5px;
  }

  #controls button {
    padding: 7px 8px;
    font-size: 10px;
  }

  #logoText {
    top: 13%;
  }

  #logoToggle {
    font-size: 10px;
    padding: 5px 7px;
  }
}
</style>
</head>

<body>
<video id="camera" autoplay playsinline></video>

<img id="panel"
     src="face-panel/flame50.png"
     alt="顔出しパネル"
     draggable="false">

<div id="help">1本指：移動　2本指：拡大・縮小・回転</div>

<div id="logoText">
  <span id="logoTitle">岐阜県動物愛護センター</span>
  <span id="logoDate"></span>
</div>

<button id="logoToggle">文字表示：ON</button>

<div id="panelButtons">
  <button class="panelButton active" data-image="flame50.png">🐶🐱 犬・猫</button>
  <button class="panelButton" data-image="flame51.png">🐶 犬</button>
  <button class="panelButton" data-image="flame52.png">🐱 猫</button>
</div>

<div id="controls">
  <button id="resetBtn">↩ リセット</button>
  <button id="photoBtn">📷 撮影</button>
</div>

<canvas id="photoCanvas"></canvas>

<div id="previewScreen">
  <img id="previewImage" alt="撮影した写真">
  <div id="saveHelp" role="status"></div>
  <div id="previewControls">
    <button id="retakeBtn">↩ 撮り直す</button>
    <button id="saveBtn">💾 保存</button>
  </div>
</div>

<script>
"use strict";

const video = document.getElementById("camera");
const panel = document.getElementById("panel");
const canvas = document.getElementById("photoCanvas");
const previewScreen = document.getElementById("previewScreen");
const previewImage = document.getElementById("previewImage");
const saveBtn = document.getElementById("saveBtn");
const retakeBtn = document.getElementById("retakeBtn");
const saveHelp = document.getElementById("saveHelp");
const photoBtn = document.getElementById("photoBtn");
const panelButtons = document.querySelectorAll(".panelButton");
const logoText = document.getElementById("logoText");
const logoTitle = document.getElementById("logoTitle");
const logoDate = document.getElementById("logoDate");
const logoToggle = document.getElementById("logoToggle");

let posX = 0;
let posY = 0;
let scale = 1;
let rotation = 0;
let currentPanel = "flame50.png";

let startX = 0;
let startY = 0;
let startDistance = 0;
let startAngle = 0;
let startScale = 1;
let startRotation = 0;

let logoX = 0;
let logoY = 0;
let logoScale = 1;
let logoRotation = 0;
let logoStartX = 0;
let logoStartY = 0;
let logoStartDistance = 0;
let logoStartAngle = 0;
let logoStartScale = 1;
let logoStartRotation = 0;
let logoVisible = true;

let cameraStarting = false;
let savedBlob = null;
let savedObjectUrl = null;
let saving = false;

function isAppleMobile() {
  const ua = navigator.userAgent || "";
  return /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function updateDate() {
  const d = new Date();
  logoDate.textContent =
    d.getFullYear() + "年" +
    (d.getMonth() + 1) + "月" +
    d.getDate() + "日";
}

async function startCamera() {
  if (cameraStarting) return;
  cameraStarting = true;

  try {
    stopCamera();

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error("カメラAPIを利用できません");
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();
  } catch (error) {
    console.error(error);
    alert(
      "カメラを起動できませんでした。\n\n" +
      "ブラウザのカメラ使用を許可してください。\n" +
      "HTTPSのページから開いていることも確認してください。"
    );
  } finally {
    cameraStarting = false;
  }
}

function stopCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
}

function updatePanel() {
  panel.style.transform =
    `translate(-50%, -50%) translate(${posX}px, ${posY}px) ` +
    `scale(${scale}) rotate(${rotation}deg)`;
}

function updateLogo() {
  logoText.style.transform =
    `translate(-50%, -50%) translate(${logoX}px, ${logoY}px) ` +
    `scale(${logoScale}) rotate(${logoRotation}deg)`;
  logoText.style.display = logoVisible ? "block" : "none";
  logoToggle.textContent = logoVisible ? "文字表示：ON" : "文字表示：OFF";
}

panelButtons.forEach(button => {
  button.addEventListener("click", function() {
    currentPanel = this.dataset.image;
    panelButtons.forEach(btn => btn.classList.remove("active"));
    this.classList.add("active");
    panel.src = "face-panel/" + currentPanel;
  });
});

function getDistance(t1, t2) {
  const dx = t2.clientX - t1.clientX;
  const dy = t2.clientY - t1.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function getAngle(t1, t2) {
  return Math.atan2(
    t2.clientY - t1.clientY,
    t2.clientX - t1.clientX
  ) * 180 / Math.PI;
}

panel.addEventListener("touchstart", function(event) {
  event.preventDefault();

  if (event.touches.length === 1) {
    const t = event.touches[0];
    startX = t.clientX - posX;
    startY = t.clientY - posY;
  } else if (event.touches.length === 2) {
    startDistance = getDistance(event.touches[0], event.touches[1]);
    startAngle = getAngle(event.touches[0], event.touches[1]);
    startScale = scale;
    startRotation = rotation;
  }
}, { passive: false });

panel.addEventListener("touchmove", function(event) {
  event.preventDefault();

  if (event.touches.length === 1) {
    const t = event.touches[0];
    posX = t.clientX - startX;
    posY = t.clientY - startY;
    updatePanel();
  } else if (event.touches.length === 2) {
    const distance = getDistance(event.touches[0], event.touches[1]);
    const angle = getAngle(event.touches[0], event.touches[1]);

    if (startDistance > 0) {
      scale = Math.max(0.25, Math.min(4, startScale * distance / startDistance));
    }

    let difference = angle - startAngle;
    if (difference > 180) difference -= 360;
    if (difference < -180) difference += 360;

    rotation = startRotation + difference;
    updatePanel();
  }
}, { passive: false });

logoText.addEventListener("touchstart", function(event) {
  if (!logoVisible) return;
  event.preventDefault();

  if (event.touches.length === 1) {
    const t = event.touches[0];
    logoStartX = t.clientX - logoX;
    logoStartY = t.clientY - logoY;
  } else if (event.touches.length === 2) {
    logoStartDistance = getDistance(event.touches[0], event.touches[1]);
    logoStartAngle = getAngle(event.touches[0], event.touches[1]);
    logoStartScale = logoScale;
    logoStartRotation = logoRotation;
  }
}, { passive: false });

logoText.addEventListener("touchmove", function(event) {
  if (!logoVisible) return;
  event.preventDefault();

  if (event.touches.length === 1) {
    const t = event.touches[0];
    logoX = t.clientX - logoStartX;
    logoY = t.clientY - logoStartY;
    updateLogo();
  } else if (event.touches.length === 2) {
    const distance = getDistance(event.touches[0], event.touches[1]);
    const angle = getAngle(event.touches[0], event.touches[1]);

    if (logoStartDistance > 0) {
      logoScale = Math.max(0.5, Math.min(3, logoStartScale * distance / logoStartDistance));
    }

    let difference = angle - logoStartAngle;
    if (difference > 180) difference -= 360;
    if (difference < -180) difference += 360;

    logoRotation = logoStartRotation + difference;
    updateLogo();
  }
}, { passive: false });

logoToggle.addEventListener("click", function() {
  logoVisible = !logoVisible;
  updateLogo();
});

document.getElementById("resetBtn").addEventListener("click", function() {
  posX = 0;
  posY = 0;
  scale = 1;
  rotation = 0;
  updatePanel();
});

photoBtn.addEventListener("click", takePhoto);

function takePhoto() {
  if (!video.videoWidth || !video.videoHeight) {
    alert("カメラの準備ができていません。");
    return;
  }

  if (!panel.complete || !panel.naturalWidth) {
    alert("パネル画像を読み込んでいます。少し待ってから撮影してください。");
    return;
  }

  const viewWidth = window.innerWidth;
  const viewHeight = window.innerHeight;
  const videoWidth = video.videoWidth;
  const videoHeight = video.videoHeight;

  const coverScale = Math.max(
    viewWidth / videoWidth,
    viewHeight / videoHeight
  );

  const sourceWidth = viewWidth / coverScale;
  const sourceHeight = viewHeight / coverScale;
  const sourceX = (videoWidth - sourceWidth) / 2;
  const sourceY = (videoHeight - sourceHeight) / 2;

  canvas.width = Math.max(1, Math.round(sourceWidth));
  canvas.height = Math.max(1, Math.round(sourceHeight));

  const ctx = canvas.getContext("2d");
  if (!ctx) {
    alert("写真を作成できませんでした。");
    return;
  }

  ctx.drawImage(
    video,
    sourceX, sourceY, sourceWidth, sourceHeight,
    0, 0, canvas.width, canvas.height
  );

  const ratio = canvas.width / viewWidth;

  const centerX = (viewWidth / 2 + posX) * ratio;
  const centerY = (viewHeight / 2 + posY) * ratio;
  const photoWidth = panel.offsetWidth * scale * ratio;
  const photoHeight = panel.offsetHeight * scale * ratio;

  ctx.save();
  ctx.translate(centerX, centerY);
  ctx.rotate(rotation * Math.PI / 180);
  ctx.drawImage(
    panel,
    -photoWidth / 2,
    -photoHeight / 2,
    photoWidth,
    photoHeight
  );
  ctx.restore();

  /* 文字も撮影画像に合成 */
  if (logoVisible) {
    const logoRect = logoText.getBoundingClientRect();
    const logoCenterX = (logoRect.left + logoRect.width / 2) * ratio;
    const logoCenterY = (logoRect.top + logoRect.height / 2) * ratio;

    ctx.save();
    ctx.translate(logoCenterX, logoCenterY);
    ctx.rotate(logoRotation * Math.PI / 180);
    ctx.scale(logoScale, logoScale);

    const titleStyle = getComputedStyle(logoTitle);
    const dateStyle = getComputedStyle(logoDate);
    const titleFontSize = parseFloat(titleStyle.fontSize) * ratio;
    const dateFontSize = parseFloat(dateStyle.fontSize) * ratio;
    const titleText = logoTitle.textContent;
    const dateText = logoDate.textContent;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `bold ${titleFontSize}px sans-serif`;
    ctx.lineWidth = 3 * ratio;
    ctx.strokeStyle = "#000";
    ctx.fillStyle = "#fff";
    ctx.strokeText(titleText, 0, -dateFontSize * 0.55);
    ctx.fillText(titleText, 0, -dateFontSize * 0.55);

    ctx.font = `bold ${dateFontSize}px sans-serif`;
    ctx.strokeText(dateText, 0, titleFontSize * 0.75);
    ctx.fillText(dateText, 0, titleFontSize * 0.75);
    ctx.restore();
  }

  canvas.toBlob(function(blob) {
    if (!blob) {
      alert("写真を作成できませんでした。もう一度お試しください。");
      return;
    }

    clearSavedPhoto();
    savedBlob = blob;
    savedObjectUrl = URL.createObjectURL(blob);
    previewImage.src = savedObjectUrl;
    previewScreen.style.display = "flex";
    saveHelp.style.display = "none";
    saveHelp.textContent = "";
    stopCamera();
  }, "image/jpeg", 0.95);
}

function clearSavedPhoto() {
  if (savedObjectUrl) URL.revokeObjectURL(savedObjectUrl);
  savedObjectUrl = null;
  savedBlob = null;
}

saveBtn.addEventListener("click", async function() {
  if (!savedBlob || saving) return;

  saving = true;
  saveBtn.disabled = true;
  saveHelp.style.display = "none";
  saveHelp.textContent = "";

  const filename =
    "face-panel-" +
    new Date().toISOString().replace(/[:.]/g, "-") +
    ".jpg";

  try {
    if (isAppleMobile()) {
      const file = new File([savedBlob], filename, { type: "image/jpeg" });

      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({ files: [file] })
      ) {
        await navigator.share({
          files: [file],
          title: "顔出しフォトパネル",
          text: "撮影した写真"
        });
        return;
      }

      saveHelp.textContent =
        "共有機能を利用できません。写真を開き、画像を長押しして保存できるかお試しください。";
      saveHelp.style.display = "block";
      return;
    }

    const link = document.createElement("a");
    link.href = savedObjectUrl;
    link.download = filename;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    link.remove();

    saveHelp.textContent =
      "ダウンロード操作を行いました。保存先はブラウザの設定によって異なります。";
    saveHelp.style.display = "block";

  } catch (error) {
    if (error && error.name === "AbortError") return;

    console.error(error);
    saveHelp.textContent =
      "保存できませんでした。もう一度保存ボタンを押してください。";
    saveHelp.style.display = "block";
  } finally {
    saving = false;
    saveBtn.disabled = false;
  }
});

retakeBtn.addEventListener("click", async function() {
  previewScreen.style.display = "none";
  clearSavedPhoto();
  await startCamera();
});

window.addEventListener("pagehide", function() {
  stopCamera();
  clearSavedPhoto();
});

updateDate();
updatePanel();
updateLogo();
startCamera();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover">
<title>顔出しフォトパネル</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}

#camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
  background: #000;
}

#panel {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 90vw;
  max-width: 700px;
  height: auto;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  z-index: 2;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  touch-action: none;
  pointer-events: auto;
}

#help {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  padding: 9px 13px;
  border-radius: 20px;
  background: rgba(0,0,0,.65);
  color: white;
  font-size: 13px;
  white-space: nowrap;
}

#panelButtons {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(82px + env(safe-area-inset-bottom));
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  padding: 0 6px;
}

button {
  border: none;
  border-radius: 28px;
  padding: 11px 13px;
  background: rgba(255,255,255,.96);
  color: #222;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  opacity: .8;
}

button:disabled {
  opacity: .5;
}

.panelButton.active {
  background: #222;
  color: white;
}

#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 10;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 0 10px;
}

#controls button {
  min-width: 112px;
}

#photoCanvas {
  display: none;
}

#previewScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #000;
  align-items: center;
  justify-content: center;
}

#previewImage {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#previewControls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(16px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 0 12px;
}

#previewControls button {
  min-width: 125px;
  padding: 14px 16px;
  font-size: 16px;
}

#saveHelp {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: calc(82px + env(safe-area-inset-bottom));
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(0,0,0,.78);
  color: white;
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
  display: none;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<img id="panel"
     src="face-panel/flame50.png"
     alt="顔出しパネル"
     draggable="false">

<div id="help">
  1本指：移動　2本指：拡大・縮小・回転
</div>

<div id="panelButtons">
  <button class="panelButton active"
          data-image="flame50.png">🐶🐱 犬・猫</button>
  <button class="panelButton"
          data-image="flame51.png">🐶 犬</button>
  <button class="panelButton"
          data-image="flame52.png">🐱 猫</button>
</div>

<div id="controls">
  <button id="resetBtn">↩ リセット</button>
  <button id="photoBtn">📷 撮影</button>
</div>

<canvas id="photoCanvas"></canvas>

<div id="previewScreen">
  <img id="previewImage" alt="撮影した写真">

  <div id="saveHelp" role="status"></div>

  <div id="previewControls">
    <button id="retakeBtn">↩ 撮り直す</button>
    <button id="saveBtn">💾 保存</button>
  </div>
</div>

<script>
"use strict";

/* =========================
   要素
========================= */

const video = document.getElementById("camera");
const panel = document.getElementById("panel");
const canvas = document.getElementById("photoCanvas");
const previewScreen = document.getElementById("previewScreen");
const previewImage = document.getElementById("previewImage");
const saveBtn = document.getElementById("saveBtn");
const retakeBtn = document.getElementById("retakeBtn");
const saveHelp = document.getElementById("saveHelp");
const photoBtn = document.getElementById("photoBtn");
const panelButtons = document.querySelectorAll(".panelButton");

/* =========================
   パネルの状態
========================= */

let posX = 0;
let posY = 0;
let scale = 1;
let rotation = 0;
let currentPanel = "flame50.png";

/* =========================
   カメラ・写真の状態
========================= */

let cameraStarting = false;
let savedBlob = null;
let savedObjectUrl = null;
let saving = false;

/* =========================
   iPhone / iPad 判定
========================= */

function isAppleMobile() {
  const ua = navigator.userAgent || "";

  return /iPhone|iPad|iPod/i.test(ua) ||
    (
      navigator.platform === "MacIntel" &&
      navigator.maxTouchPoints > 1
    );
}

/* =========================
   カメラ起動
========================= */

async function startCamera() {
  if (cameraStarting) return;

  cameraStarting = true;

  try {
    stopCamera();

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error("カメラAPIを利用できません");
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

  } catch (error) {
    console.error(error);

    alert(
      "カメラを起動できませんでした。\n\n" +
      "ブラウザのカメラ使用を許可してください。\n" +
      "HTTPSのページから開いていることも確認してください。"
    );

  } finally {
    cameraStarting = false;
  }
}

/* =========================
   カメラ停止
========================= */

function stopCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
}

/* =========================
   パネル表示更新
========================= */

function updatePanel() {
  panel.style.transform =
    `translate(-50%, -50%) ` +
    `translate(${posX}px, ${posY}px) ` +
    `scale(${scale}) rotate(${rotation}deg)`;
}

/* =========================
   パネル切り替え
========================= */

panelButtons.forEach(button => {
  button.addEventListener("click", function() {
    currentPanel = this.dataset.image;

    panelButtons.forEach(btn => btn.classList.remove("active"));
    this.classList.add("active");

    panel.src = "face-panel/" + currentPanel;
  });
});

/* =========================
   タッチ開始
========================= */

panel.addEventListener("touchstart", function(event) {
  event.preventDefault();

  if (event.touches.length === 1) {
    const touch = event.touches[0];

    startX = touch.clientX - posX;
    startY = touch.clientY - posY;

  } else if (event.touches.length === 2) {
    const t1 = event.touches[0];
    const t2 = event.touches[1];

    startDistance = getDistance(t1, t2);
    startAngle = getAngle(t1, t2);
    startScale = scale;
    startRotation = rotation;
  }
}, { passive: false });

/* =========================
   タッチ移動
========================= */

panel.addEventListener("touchmove", function(event) {
  event.preventDefault();

  if (event.touches.length === 1) {
    const touch = event.touches[0];

    posX = touch.clientX - startX;
    posY = touch.clientY - startY;

    updatePanel();

  } else if (event.touches.length === 2) {
    const t1 = event.touches[0];
    const t2 = event.touches[1];

    const currentDistance = getDistance(t1, t2);
    const currentAngle = getAngle(t1, t2);

    if (startDistance > 0) {
      scale = startScale * currentDistance / startDistance;
      scale = Math.max(0.25, Math.min(scale, 4));
    }

    let angleDifference = currentAngle - startAngle;

    if (angleDifference > 180) angleDifference -= 360;
    if (angleDifference < -180) angleDifference += 360;

    rotation = startRotation + angleDifference;

    updatePanel();
  }
}, { passive: false });

function getDistance(t1, t2) {
  const dx = t2.clientX - t1.clientX;
  const dy = t2.clientY - t1.clientY;

  return Math.sqrt(dx * dx + dy * dy);
}

function getAngle(t1, t2) {
  return Math.atan2(
    t2.clientY - t1.clientY,
    t2.clientX - t1.clientX
  ) * 180 / Math.PI;
}

/* =========================
   リセット
========================= */

document.getElementById("resetBtn").addEventListener("click", function() {
  posX = 0;
  posY = 0;
  scale = 1;
  rotation = 0;

  updatePanel();
});

/* =========================
   撮影
========================= */

photoBtn.addEventListener("click", takePhoto);

function takePhoto() {
  if (!video.videoWidth || !video.videoHeight) {
    alert("カメラの準備ができていません。");
    return;
  }

  if (!panel.complete || !panel.naturalWidth) {
    alert("パネル画像を読み込んでいます。少し待ってから撮影してください。");
    return;
  }

  const viewWidth = window.innerWidth;
  const viewHeight = window.innerHeight;

  const videoWidth = video.videoWidth;
  const videoHeight = video.videoHeight;

  /*
   * object-fit: cover と同じ表示範囲を計算
   */

  const coverScale = Math.max(
    viewWidth / videoWidth,
    viewHeight / videoHeight
  );

  const sourceWidth = viewWidth / coverScale;
  const sourceHeight = viewHeight / coverScale;

  const sourceX = (videoWidth - sourceWidth) / 2;
  const sourceY = (videoHeight - sourceHeight) / 2;

  canvas.width = Math.max(1, Math.round(sourceWidth));
  canvas.height = Math.max(1, Math.round(sourceHeight));

  const ctx = canvas.getContext("2d");

  if (!ctx) {
    alert("写真を作成できませんでした。");
    return;
  }

  /*
   * カメラ映像を描画
   */

  ctx.drawImage(
    video,
    sourceX, sourceY, sourceWidth, sourceHeight,
    0, 0, canvas.width, canvas.height
  );

  /*
   * 画面座標から写真座標へ変換
   */

  const screenToPhoto = canvas.width / viewWidth;

  const panelCenterX = viewWidth / 2 + posX;
  const panelCenterY = viewHeight / 2 + posY;

  const photoCenterX = panelCenterX * screenToPhoto;
  const photoCenterY = panelCenterY * screenToPhoto;

  const photoWidth =
    panel.offsetWidth * scale * screenToPhoto;

  const photoHeight =
    panel.offsetHeight * scale * screenToPhoto;

  /*
   * 表示と同じ位置・拡大率・回転で合成
   */

  ctx.save();

  ctx.translate(photoCenterX, photoCenterY);
  ctx.rotate(rotation * Math.PI / 180);

  ctx.drawImage(
    panel,
    -photoWidth / 2,
    -photoHeight / 2,
    photoWidth,
    photoHeight
  );

  ctx.restore();

  /*
   * JPEG画像を生成
   */

  canvas.toBlob(function(blob) {
    if (!blob) {
      alert("写真を作成できませんでした。もう一度お試しください。");
      return;
    }

    clearSavedPhoto();

    savedBlob = blob;
    savedObjectUrl = URL.createObjectURL(blob);

    previewImage.src = savedObjectUrl;
    previewScreen.style.display = "flex";

    saveHelp.style.display = "none";
    saveHelp.textContent = "";

    stopCamera();
  }, "image/jpeg", 0.95);
}

/* =========================
   保存画像の後片付け
========================= */

function clearSavedPhoto() {
  if (savedObjectUrl) {
    URL.revokeObjectURL(savedObjectUrl);
  }

  savedObjectUrl = null;
  savedBlob = null;
}

/* =========================
   保存ボタン
========================= */

saveBtn.addEventListener("click", async function() {
  if (!savedBlob || saving) return;

  saving = true;
  saveBtn.disabled = true;

  saveHelp.style.display = "none";
  saveHelp.textContent = "";

  const filename =
    "face-panel-" +
    new Date().toISOString().replace(/[:.]/g, "-") +
    ".jpg";

  try {
    /*
     * iPhone / iPad：
     * ファイル共有に対応していれば共有画面を開く。
     * 利用者が「画像を保存」を選ぶ。
     */

    if (isAppleMobile()) {
      const file = new File(
        [savedBlob],
        filename,
        { type: "image/jpeg" }
      );

      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({ files: [file] })
      ) {
        await navigator.share({
          files: [file],
          title: "顔出しフォトパネル",
          text: "撮影した写真"
        });

        return;
      }

      /*
       * 共有機能が利用できない場合
       */

      saveHelp.textContent =
        "共有機能を利用できません。写真を開き、" +
        "画像を長押しして保存できるかお試しください。";

      saveHelp.style.display = "block";
      return;
    }

    /*
     * Androidなど：
     * 共有画面を優先せず、JPEGをダウンロードする。
     */

    const link = document.createElement("a");

    link.href = savedObjectUrl;
    link.download = filename;
    link.style.display = "none";

    document.body.appendChild(link);
    link.click();
    link.remove();

    saveHelp.textContent =
      "ダウンロード操作を行いました。保存先はブラウザの設定によって異なります。";

    saveHelp.style.display = "block";

  } catch (error) {
    /*
     * iPhoneで共有画面を閉じた場合など
     */

    if (error && error.name === "AbortError") {
      return;
    }

    console.error(error);

    saveHelp.textContent =
      "保存できませんでした。もう一度保存ボタンを押してください。";

    saveHelp.style.display = "block";

  } finally {
    saving = false;
    saveBtn.disabled = false;
  }
});

/* =========================
   撮り直す
========================= */

retakeBtn.addEventListener("click", async function() {
  previewScreen.style.display = "none";

  clearSavedPhoto();

  await startCamera();
});

/* =========================
   ページを離れるとき
========================= */

window.addEventListener("pagehide", function() {
  stopCamera();
  clearSavedPhoto();
});

/* =========================
   起動
========================= */

updatePanel();
startCamera();

</script>
</body>
</html>

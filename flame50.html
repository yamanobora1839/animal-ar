
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover">
<title>顔出しフォトパネル</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}

#camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
  background: #000;
}

#panel {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 90vw;
  max-width: 700px;
  height: auto;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  z-index: 2;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  touch-action: none;
}

/* =========================
   センター名・撮影日
   画像ファイルは不要
========================= */

#logoText {
  position: fixed;
  left: 50%;
  top: 17%;
  z-index: 4;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;

  width: max-content;
  max-width: 94vw;

  transform:
    translate(-50%, -50%)
    translate(0px, 0px)
    scale(1)
    rotate(0deg);

  transform-origin: center center;

  text-align: center;
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  cursor: move;
}

#logoTitle {
  display: block;
  font-size: clamp(17px, 4.8vw, 30px);
  line-height: 1.25;
  font-weight: 900;
  color: #fff;

  -webkit-text-stroke: 1px #245c35;
  paint-order: stroke fill;
  text-shadow:
    0 2px 4px rgba(0,0,0,.85),
    1px 1px 2px rgba(0,0,0,.8);
}

#logoDate {
  display: block;
  font-size: clamp(14px, 3.8vw, 22px);
  line-height: 1.25;
  font-weight: 800;
  color: #fff;

  -webkit-text-stroke: .7px #245c35;
  paint-order: stroke fill;
  text-shadow:
    0 2px 4px rgba(0,0,0,.85),
    1px 1px 2px rgba(0,0,0,.8);
}

#help {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  padding: 8px 12px;
  border-radius: 20px;
  background: rgba(0,0,0,.65);
  color: white;
  font-size: 12px;
  white-space: nowrap;
}

#logoToggle {
  position: fixed;
  top: calc(48px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 11;
  padding: 8px 14px;
  font-size: 13px;
  white-space: nowrap;
}

#panelButtons {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(82px + env(safe-area-inset-bottom));
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  padding: 0 6px;
}

button {
  border: none;
  border-radius: 28px;
  padding: 11px 13px;
  background: rgba(255,255,255,.96);
  color: #222;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  opacity: .8;
}

button:disabled {
  opacity: .5;
}

.panelButton.active {
  background: #222;
  color: white;
}

#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 10;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 0 10px;
}

#controls button {
  min-width: 112px;
}

#photoCanvas {
  display: none;
}

#previewScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #000;
  align-items: center;
  justify-content: center;
}

#previewImage {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#previewControls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(16px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 0 12px;
}

#previewControls button {
  min-width: 125px;
  padding: 14px 16px;
  font-size: 16px;
}

#saveHelp {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: calc(82px + env(safe-area-inset-bottom));
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(0,0,0,.78);
  color: white;
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
  display: none;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<img id="panel"
     src="face-panel/flame50.png"
     alt="顔出しパネル"
     draggable="false">

<!-- 最前面の文字。画像は使用しない -->
<div id="logoText">
  <span id="logoTitle">岐阜県動物愛護センター</span>
  <span id="logoDate"></span>
</div>

<div id="help">
  パネル・文字：1本指で移動、2本指で拡大・回転
</div>

<button id="logoToggle">文字表示：ON</button>

<div id="panelButtons">
  <button class="panelButton active"
          data-image="flame50.png">🐶🐱 犬・猫</button>
  <button class="panelButton"
          data-image="flame51.png">🐶 犬</button>
  <button class="panelButton"
          data-image="flame52.png">🐱 猫</button>
</div>

<div id="controls">
  <button id="resetBtn">↩ リセット</button>
  <button id="photoBtn">📷 撮影</button>
</div>

<canvas id="photoCanvas"></canvas>

<div id="previewScreen">
  <img id="previewImage" alt="撮影した写真">
  <div id="saveHelp" role="status"></div>

  <div id="previewControls">
    <button id="retakeBtn">↩ 撮り直す</button>
    <button id="saveBtn">💾 保存</button>
  </div>
</div>

<script>
"use strict";

/* =========================
   要素
========================= */

const video = document.getElementById("camera");
const panel = document.getElementById("panel");
const canvas = document.getElementById("photoCanvas");
const previewScreen = document.getElementById("previewScreen");
const previewImage = document.getElementById("previewImage");
const saveBtn = document.getElementById("saveBtn");
const retakeBtn = document.getElementById("retakeBtn");
const saveHelp = document.getElementById("saveHelp");
const photoBtn = document.getElementById("photoBtn");
const panelButtons = document.querySelectorAll(".panelButton");

const logoText = document.getElementById("logoText");
const logoTitle = document.getElementById("logoTitle");
const logoDate = document.getElementById("logoDate");
const logoToggle = document.getElementById("logoToggle");

/* =========================
   顔出しパネルの状態
========================= */

let posX = 0;
let posY = 0;
let scale = 1;
let rotation = 0;
let currentPanel = "flame50.png";

/* パネルのタッチ操作用 */
let startX = 0;
let startY = 0;
let startDistance = 0;
let startAngle = 0;
let startScale = 1;
let startRotation = 0;

/* =========================
   文字表示の状態
========================= */

let logoVisible = true;
let logoPosX = 0;
let logoPosY = 0;
let logoScale = 1;
let logoRotation = 0;

/* 文字のタッチ操作用 */
let logoStartX = 0;
let logoStartY = 0;
let logoStartDistance = 0;
let logoStartAngle = 0;
let logoStartScale = 1;
let logoStartRotation = 0;

/* =========================
   カメラ・写真の状態
========================= */

let cameraStarting = false;
let savedBlob = null;
let savedObjectUrl = null;
let saving = false;

/* =========================
   日付
   端末の現地日付を使用
========================= */

function updateCaptureDate() {
  const now = new Date();

  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const day = now.getDate();

  logoDate.textContent =
    `${year}年${month}月${day}日`;
}

/* =========================
   iPhone / iPad 判定
========================= */

function isAppleMobile() {
  const ua = navigator.userAgent || "";

  return /iPhone|iPad|iPod/i.test(ua) ||
    (
      navigator.platform === "MacIntel" &&
      navigator.maxTouchPoints > 1
    );
}

/* =========================
   カメラ起動
========================= */

async function startCamera() {
  if (cameraStarting) return;

  cameraStarting = true;

  try {
    stopCamera();

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error("カメラAPIを利用できません");
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

  } catch (error) {
    console.error(error);

    alert(
      "カメラを起動できませんでした。\n\n" +
      "ブラウザのカメラ使用を許可してください。\n" +
      "HTTPSのページから開いていることも確認してください。"
    );

  } finally {
    cameraStarting = false;
  }
}

/* =========================
   カメラ停止
========================= */

function stopCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
}

/* =========================
   パネル表示更新
========================= */

function updatePanel() {
  panel.style.transform =
    `translate(-50%, -50%) ` +
    `translate(${posX}px, ${posY}px) ` +
    `scale(${scale}) rotate(${rotation}deg)`;
}

/* =========================
   文字表示更新
========================= */

function updateLogoText() {
  logoText.style.display = logoVisible ? "flex" : "none";

  logoToggle.textContent =
    logoVisible ? "文字表示：ON" : "文字表示：OFF";

  logoToggle.classList.toggle("active", logoVisible);

  logoText.style.transform =
    `translate(-50%, -50%) ` +
    `translate(${logoPosX}px, ${logoPosY}px) ` +
    `scale(${logoScale}) rotate(${logoRotation}deg)`;
}

/* 文字表示のON / OFF */
logoToggle.addEventListener("click", function() {
  logoVisible = !logoVisible;
  updateLogoText();
});

/* =========================
   パネル切り替え
========================= */

panelButtons.forEach(button => {
  button.addEventListener("click", function() {
    currentPanel = this.dataset.image;

    panelButtons.forEach(btn => btn.classList.remove("active"));
    this.classList.add("active");

    panel.src = "face-panel/" + currentPanel;
  });
});

/* =========================
   2点間の距離と角度
========================= */

function getDistance(t1, t2) {
  const dx = t2.clientX - t1.clientX;
  const dy = t2.clientY - t1.clientY;

  return Math.sqrt(dx * dx + dy * dy);
}

function getAngle(t1, t2) {
  return Math.atan2(
    t2.clientY - t1.clientY,
    t2.clientX - t1.clientX
  ) * 180 / Math.PI;
}

/* =========================
   角度差を -180～180 にする
========================= */

function normalizeAngle(angle) {
  if (angle > 180) angle -= 360;
  if (angle < -180) angle += 360;
  return angle;
}

/* =========================
   顔出しパネルのタッチ操作
========================= */

panel.addEventListener("touchstart", function(event) {
  event.preventDefault();

  if (event.touches.length === 1) {
    const touch = event.touches[0];

    startX = touch.clientX - posX;
    startY = touch.clientY - posY;

  } else if (event.touches.length === 2) {
    const t1 = event.touches[0];
    const t2 = event.touches[1];

    startDistance = getDistance(t1, t2);
    startAngle = getAngle(t1, t2);
    startScale = scale;
    startRotation = rotation;
  }
}, { passive: false });

panel.addEventListener("touchmove", function(event) {
  event.preventDefault();

  if (event.touches.length === 1) {
    const touch = event.touches[0];

    posX = touch.clientX - startX;
    posY = touch.clientY - startY;

    updatePanel();

  } else if (event.touches.length === 2) {
    const t1 = event.touches[0];
    const t2 = event.touches[1];

    const currentDistance = getDistance(t1, t2);
    const currentAngle = getAngle(t1, t2);

    if (startDistance > 0) {
      scale = startScale * currentDistance / startDistance;
      scale = Math.max(0.25, Math.min(scale, 4));
    }

    rotation =
      startRotation + normalizeAngle(currentAngle - startAngle);

    updatePanel();
  }
}, { passive: false });

/* =========================
   センター名・撮影日のタッチ操作
========================= */

logoText.addEventListener("touchstart", function(event) {
  event.preventDefault();

  if (event.touches.length === 1) {
    const touch = event.touches[0];

    logoStartX = touch.clientX - logoPosX;
    logoStartY = touch.clientY - logoPosY;

  } else if (event.touches.length === 2) {
    const t1 = event.touches[0];
    const t2 = event.touches[1];

    logoStartDistance = getDistance(t1, t2);
    logoStartAngle = getAngle(t1, t2);
    logoStartScale = logoScale;
    logoStartRotation = logoRotation;
  }
}, { passive: false });

logoText.addEventListener("touchmove", function(event) {
  event.preventDefault();

  if (event.touches.length === 1) {
    const touch = event.touches[0];

    logoPosX = touch.clientX - logoStartX;
    logoPosY = touch.clientY - logoStartY;

    updateLogoText();

  } else if (event.touches.length === 2) {
    const t1 = event.touches[0];
    const t2 = event.touches[1];

    const currentDistance = getDistance(t1, t2);
    const currentAngle = getAngle(t1, t2);

    if (logoStartDistance > 0) {
      logoScale =
        logoStartScale * currentDistance / logoStartDistance;

      logoScale = Math.max(0.5, Math.min(logoScale, 3));
    }

    logoRotation =
      logoStartRotation +
      normalizeAngle(currentAngle - logoStartAngle);

    updateLogoText();
  }
}, { passive: false });

/* =========================
   リセット
   パネルと文字の位置・大きさ・回転
========================= */

document.getElementById("resetBtn").addEventListener("click", function() {
  posX = 0;
  posY = 0;
  scale = 1;
  rotation = 0;

  logoPosX = 0;
  logoPosY = 0;
  logoScale = 1;
  logoRotation = 0;

  updatePanel();
  updateLogoText();
});

/* =========================
   撮影
========================= */

photoBtn.addEventListener("click", takePhoto);

function takePhoto() {
  if (!video.videoWidth || !video.videoHeight) {
    alert("カメラの準備ができていません。");
    return;
  }

  if (!panel.complete || !panel.naturalWidth) {
    alert("パネル画像を読み込んでいます。少し待ってから撮影してください。");
    return;
  }

  /* 撮影時の日付を更新 */
  updateCaptureDate();

  const viewWidth = window.innerWidth;
  const viewHeight = window.innerHeight;

  const videoWidth = video.videoWidth;
  const videoHeight = video.videoHeight;

  /*
   * object-fit: cover と同じ表示範囲を計算
   */

  const coverScale = Math.max(
    viewWidth / videoWidth,
    viewHeight / videoHeight
  );

  const sourceWidth = viewWidth / coverScale;
  const sourceHeight = viewHeight / coverScale;

  const sourceX = (videoWidth - sourceWidth) / 2;
  const sourceY = (videoHeight - sourceHeight) / 2;

  canvas.width = Math.max(1, Math.round(sourceWidth));
  canvas.height = Math.max(1, Math.round(sourceHeight));

  const ctx = canvas.getContext("2d");

  if (!ctx) {
    alert("写真を作成できませんでした。");
    return;
  }

  /*
   * カメラ映像を描画
   */

  ctx.drawImage(
    video,
    sourceX, sourceY, sourceWidth, sourceHeight,
    0, 0, canvas.width, canvas.height
  );

  /*
   * 画面座標から写真座標へ変換
   */

  const screenToPhoto = canvas.width / viewWidth;

  /*
   * 顔出しパネルを合成
   */

  const panelCenterX = viewWidth / 2 + posX;
  const panelCenterY = viewHeight / 2 + posY;

  const photoCenterX = panelCenterX * screenToPhoto;
  const photoCenterY = panelCenterY * screenToPhoto;

  const photoWidth =
    panel.offsetWidth * scale * screenToPhoto;

  const photoHeight =
    panel.offsetHeight * scale * screenToPhoto;

  ctx.save();

  ctx.translate(photoCenterX, photoCenterY);
  ctx.rotate(rotation * Math.PI / 180);

  ctx.drawImage(
    panel,
    -photoWidth / 2,
    -photoHeight / 2,
    photoWidth,
    photoHeight
  );

  ctx.restore();

  /*
   * 最前面にセンター名と撮影日を合成
   * 非表示の場合は合成しない
   */

  if (logoVisible) {
    drawLogoTextOnCanvas(ctx, screenToPhoto, viewWidth, viewHeight);
  }

  /*
   * JPEG画像を生成
   */

  canvas.toBlob(function(blob) {
    if (!blob) {
      alert("写真を作成できませんでした。もう一度お試しください。");
      return;
    }

    clearSavedPhoto();

    savedBlob = blob;
    savedObjectUrl = URL.createObjectURL(blob);

    previewImage.src = savedObjectUrl;
    previewScreen.style.display = "flex";

    saveHelp.style.display = "none";
    saveHelp.textContent = "";

    stopCamera();
  }, "image/jpeg", 0.95);
}

/* =========================
   文字を写真に描画
========================= */

function drawLogoTextOnCanvas(ctx, screenToPhoto, viewWidth, viewHeight) {
  const titleStyle = getComputedStyle(logoTitle);
  const dateStyle = getComputedStyle(logoDate);

  const titleText = logoTitle.textContent;
  const dateText = logoDate.textContent;

  /*
   * 画面上の文字ブロックの中心位置
   */

  const centerX = viewWidth / 2 + logoPosX;
  const centerY = viewHeight * 0.17 + logoPosY;

  const titleHeight = logoTitle.offsetHeight;
  const dateHeight = logoDate.offsetHeight;
  const gap = 3;
  const totalHeight = titleHeight + gap + dateHeight;

  ctx.save();

  ctx.translate(
    centerX * screenToPhoto,
    centerY * screenToPhoto
  );

  ctx.rotate(logoRotation * Math.PI / 180);

  ctx.scale(
    logoScale * screenToPhoto,
    logoScale * screenToPhoto
  );

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";

  /* 文字の影 */
  ctx.shadowColor = "rgba(0,0,0,0.85)";
  ctx.shadowBlur = 4;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 2;

  /* センター名 */
  ctx.font =
    `${titleStyle.fontWeight} ` +
    `${titleStyle.fontSize} ` +
    `${titleStyle.fontFamily}`;

  ctx.lineWidth = 2;
  ctx.strokeStyle = "#245c35";
  ctx.fillStyle = "#ffffff";

  const titleY = -totalHeight / 2 + titleHeight / 2;

  ctx.strokeText(titleText, 0, titleY, viewWidth * 0.94);
  ctx.fillText(titleText, 0, titleY, viewWidth * 0.94);

  /* 撮影日 */
  ctx.font =
    `${dateStyle.fontWeight} ` +
    `${dateStyle.fontSize} ` +
    `${dateStyle.fontFamily}`;

  ctx.lineWidth = 1.5;
  ctx.strokeStyle = "#245c35";
  ctx.fillStyle = "#ffffff";

  const dateY =
    -totalHeight / 2 +
    titleHeight +
    gap +
    dateHeight / 2;

  ctx.strokeText(dateText, 0, dateY, viewWidth * 0.94);
  ctx.fillText(dateText, 0, dateY, viewWidth * 0.94);

  ctx.restore();
}

/* =========================
   保存画像の後片付け
========================= */

function clearSavedPhoto() {
  if (savedObjectUrl) {
    URL.revokeObjectURL(savedObjectUrl);
  }

  savedObjectUrl = null;
  savedBlob = null;
}

/* =========================
   保存ボタン
========================= */

saveBtn.addEventListener("click", async function() {
  if (!savedBlob || saving) return;

  saving = true;
  saveBtn.disabled = true;

  saveHelp.style.display = "none";
  saveHelp.textContent = "";

  const filename =
    "face-panel-" +
    new Date().toISOString().replace(/[:.]/g, "-") +
    ".jpg";

  try {
    /*
     * iPhone / iPad：
     * 対応していれば共有画面を開く
     */

    if (isAppleMobile()) {
      const file = new File(
        [savedBlob],
        filename,
        { type: "image/jpeg" }
      );

      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({ files: [file] })
      ) {
        await navigator.share({
          files: [file],
          title: "顔出しフォトパネル",
          text: "撮影した写真"
        });

        return;
      }

      saveHelp.textContent =
        "共有機能を利用できません。写真を開き、" +
        "画像を長押しして保存できるかお試しください。";

      saveHelp.style.display = "block";
      return;
    }

    /*
     * Androidなど：
     * JPEGをダウンロード
     */

    const link = document.createElement("a");

    link.href = savedObjectUrl;
    link.download = filename;
    link.style.display = "none";

    document.body.appendChild(link);
    link.click();
    link.remove();

    saveHelp.textContent =
      "ダウンロード操作を行いました。保存先はブラウザの設定によって異なります。";

    saveHelp.style.display = "block";

  } catch (error) {
    if (error && error.name === "AbortError") {
      return;
    }

    console.error(error);

    saveHelp.textContent =
      "保存できませんでした。もう一度保存ボタンを押してください。";

    saveHelp.style.display = "block";

  } finally {
    saving = false;
    saveBtn.disabled = false;
  }
});

/* =========================
   撮り直す
========================= */

retakeBtn.addEventListener("click", async function() {
  previewScreen.style.display = "none";

  clearSavedPhoto();

  await startCamera();
});

/* =========================
   ページを離れるとき
========================= */

window.addEventListener("pagehide", function() {
  stopCamera();
  clearSavedPhoto();
});

/* =========================
   起動
========================= */

updatePanel();
updateCaptureDate();
updateLogoText();
startCamera();

</script>
</body>
</html>

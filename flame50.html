<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>顔出しフォトパネル</title>


<style>

/* =========================
   基本
========================= */

* {

  box-sizing: border-box;

  -webkit-tap-highlight-color:
    transparent;

}


html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;

  font-family: sans-serif;

}


/* =========================
   カメラ
========================= */

#camera {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: 1;

  background: #000;

}


/* =========================
   顔出しパネル
========================= */

#panel {

  position: fixed;

  left: 50%;
  top: 50%;

  width: 90vw;

  max-width: 700px;

  transform:
    translate(-50%, -50%)
    translate(0px, 0px)
    scale(1)
    rotate(0deg);

  transform-origin:
    center center;

  z-index: 2;

  user-select: none;

  -webkit-user-select: none;

  touch-action: none;

  pointer-events: auto;

}


/* =========================
   説明
========================= */

#help {

  position: fixed;

  top: 12px;
  left: 50%;

  transform:
    translateX(-50%);

  z-index: 10;

  padding:
    8px 14px;

  border-radius: 20px;

  background:
    rgba(0,0,0,0.55);

  color: white;

  font-size: 13px;

  white-space: nowrap;

}


/* =========================
   撮影ボタン
========================= */

#controls {

  position: fixed;

  left: 0;
  right: 0;

  bottom: 18px;

  z-index: 10;

  display: flex;

  justify-content: center;

  gap: 10px;

  padding: 0 10px;

}


button {

  border: none;

  border-radius: 28px;

  padding:
    12px 18px;

  background:
    rgba(255,255,255,0.92);

  color: #222;

  font-size: 15px;

  font-weight: bold;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,0.35);

}


button:active {

  transform:
    scale(0.95);

}


/* =========================
   Canvas
========================= */

#photoCanvas {

  display: none;

}


/* =========================
   撮影後画面
========================= */

#previewScreen {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 100;

  background: #000;

  align-items: center;

  justify-content: center;

}


/* =========================
   撮影後の写真
========================= */

#previewImage {

  display: block;

  width: 100%;

  height: 100%;

  object-fit: contain;

}


/* =========================
   撮影後ボタン
========================= */

#previewControls {

  position: absolute;

  left: 0;
  right: 0;

  bottom: 20px;

  display: flex;

  justify-content: center;

  gap: 12px;

  padding:
    0 12px;

}


/* =========================
   撮影後ボタン
========================= */

#previewControls button {

  min-width: 120px;

  padding:
    14px 20px;

  font-size: 16px;

}


/* =========================
   保存ボタン
========================= */

#saveBtn {

  background:
    rgba(255,255,255,0.95);

}


/* =========================
   撮り直しボタン
========================= */

#retakeBtn {

  background:
    rgba(255,255,255,0.95);

}

</style>

</head>


<body>


<!-- =========================
     カメラ
========================= -->

<video
  id="camera"
  autoplay
  playsinline>
</video>


<!-- =========================
     顔出しパネル
========================= -->

<img
  id="panel"
  src="face-panel/flame50.png"
  alt="顔出しパネル"
>


<!-- =========================
     説明
========================= -->

<div id="help">

  1本指：移動　
  2本指：拡大・縮小・回転

</div>


<!-- =========================
     通常操作ボタン
========================= -->

<div id="controls">

  <button id="resetBtn">
    ↩ リセット
  </button>

  <button id="photoBtn">
    📷 撮影
  </button>

</div>


<!-- =========================
     撮影用Canvas
========================= -->

<canvas id="photoCanvas"></canvas>


<!-- =========================
     撮影後画面
========================= -->

<div id="previewScreen">


  <!-- 撮影した写真 -->

  <img
    id="previewImage"
    alt="撮影した写真"
  >


  <!-- ボタン -->

  <div id="previewControls">

    <button id="retakeBtn">
      ↩ 撮り直す
    </button>

    <button id="saveBtn">
      💾 保存
    </button>

  </div>


</div>



<script>


/* =========================
   要素
========================= */

const video =
  document.getElementById(
    "camera"
  );


const panel =
  document.getElementById(
    "panel"
  );


const canvas =
  document.getElementById(
    "photoCanvas"
  );


const previewScreen =
  document.getElementById(
    "previewScreen"
  );


const previewImage =
  document.getElementById(
    "previewImage"
  );


const saveBtn =
  document.getElementById(
    "saveBtn"
  );


const retakeBtn =
  document.getElementById(
    "retakeBtn"
  );


/* =========================
   パネル状態
========================= */

let posX = 0;

let posY = 0;

let scale = 1;

let rotation = 0;


/* =========================
   タッチ操作
========================= */

let startX = 0;

let startY = 0;

let startDistance = 0;

let startAngle = 0;

let startScale = 1;

let startRotation = 0;


/* =========================
   カメラ起動
========================= */

async function startCamera() {

  try {


    /* 既存ストリームを停止 */

    if (video.srcObject) {

      video.srcObject
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }


    /* カメラ取得 */

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    await video.play();


  }

  catch (error) {

    console.error(error);


    alert(
      "カメラを起動できませんでした。\n\n" +
      "ブラウザのカメラ使用を許可してください。"
    );

  }

}


/* =========================
   パネル更新
========================= */

function updatePanel() {


  panel.style.transform =

    `translate(-50%, -50%)
     translate(${posX}px, ${posY}px)
     scale(${scale})
     rotate(${rotation}deg)`;

}


/* =========================
   タッチ開始
========================= */

panel.addEventListener(

  "touchstart",

  function(event) {


    event.preventDefault();


    /* =====================
       1本指
    ===================== */

    if (
      event.touches.length === 1
    ) {


      const touch =
        event.touches[0];


      startX =
        touch.clientX - posX;


      startY =
        touch.clientY - posY;

    }


    /* =====================
       2本指
    ===================== */

    else if (
      event.touches.length === 2
    ) {


      const t1 =
        event.touches[0];


      const t2 =
        event.touches[1];


      startDistance =
        getDistance(
          t1,
          t2
        );


      startAngle =
        getAngle(
          t1,
          t2
        );


      startScale =
        scale;


      startRotation =
        rotation;

    }

  },

  {
    passive: false
  }

);


/* =========================
   タッチ移動
========================= */

panel.addEventListener(

  "touchmove",

  function(event) {


    event.preventDefault();


    /* =====================
       1本指
    ===================== */

    if (
      event.touches.length === 1
    ) {


      const touch =
        event.touches[0];


      posX =
        touch.clientX - startX;


      posY =
        touch.clientY - startY;


      updatePanel();

    }


    /* =====================
       2本指
    ===================== */

    else if (
      event.touches.length === 2
    ) {


      const t1 =
        event.touches[0];


      const t2 =
        event.touches[1];


      const currentDistance =
        getDistance(
          t1,
          t2
        );


      const currentAngle =
        getAngle(
          t1,
          t2
        );


      /* 拡大・縮小 */

      scale =
        startScale *
        (
          currentDistance /
          startDistance
        );


      scale =
        Math.max(
          0.25,
          Math.min(
            scale,
            4
          )
        );


      /* 回転 */

      rotation =
        startRotation +
        (
          currentAngle -
          startAngle
        );


      updatePanel();

    }

  },

  {
    passive: false
  }

);


/* =========================
   2本指の距離
========================= */

function getDistance(
  t1,
  t2
) {


  const dx =
    t2.clientX -
    t1.clientX;


  const dy =
    t2.clientY -
    t1.clientY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =========================
   2本指の角度
========================= */

function getAngle(
  t1,
  t2
) {


  return Math.atan2(

    t2.clientY -
    t1.clientY,

    t2.clientX -
    t1.clientX

  )
  *
  180
  /
  Math.PI;

}


/* =========================
   リセット
========================= */

document
  .getElementById(
    "resetBtn"
  )
  .addEventListener(

    "click",

    function() {


      posX = 0;

      posY = 0;

      scale = 1;

      rotation = 0;


      updatePanel();

    }

  );


/* =========================
   撮影ボタン
========================= */

document
  .getElementById(
    "photoBtn"
  )
  .addEventListener(

    "click",

    takePhoto

  );


/* =========================
   写真撮影
========================= */

function takePhoto() {


  /* =====================
     カメラ確認
  ===================== */

  if (

    !video.videoWidth ||
    !video.videoHeight

  ) {


    alert(
      "カメラの準備ができていません。"
    );


    return;

  }


  /* =====================
     画面サイズ
  ===================== */

  const viewWidth =
    window.innerWidth;


  const viewHeight =
    window.innerHeight;


  const viewAspect =
    viewWidth /
    viewHeight;


  /* =====================
     カメラ元画像
  ===================== */

  const videoWidth =
    video.videoWidth;


  const videoHeight =
    video.videoHeight;


  const videoAspect =
    videoWidth /
    videoHeight;


  /* =====================
     object-fit: cover
     の切り取り範囲
  ===================== */

  let sourceX = 0;

  let sourceY = 0;

  let sourceWidth =
    videoWidth;

  let sourceHeight =
    videoHeight;


  if (
    videoAspect > viewAspect
  ) {


    sourceWidth =
      videoHeight *
      viewAspect;


    sourceX =
      (
        videoWidth -
        sourceWidth
      ) / 2;

  }


  else if (
    videoAspect < viewAspect
  ) {


    sourceHeight =
      videoWidth /
      viewAspect;


    sourceY =
      (
        videoHeight -
        sourceHeight
      ) / 2;

  }


  /* =====================
     Canvas
  ===================== */

  canvas.width =
    Math.round(
      sourceWidth
    );


  canvas.height =
    Math.round(
      sourceHeight
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  /* =====================
     カメラ映像
  ===================== */

  ctx.drawImage(

    video,

    sourceX,
    sourceY,

    sourceWidth,
    sourceHeight,

    0,
    0,

    canvas.width,
    canvas.height

  );


  /* =====================
     パネルサイズ
  ===================== */

  const panelWidth =
    panel.offsetWidth;


  const panelHeight =
    panel.offsetHeight;


  /* =====================
     パネル中心
  ===================== */

  const panelCenterX =
    viewWidth / 2 +
    posX;


  const panelCenterY =
    viewHeight / 2 +
    posY;


  /* =====================
     画面→写真変換
  ===================== */

  const scaleX =
    canvas.width /
    viewWidth;


  const scaleY =
    canvas.height /
    viewHeight;


  const photoCenterX =
    panelCenterX *
    scaleX;


  const photoCenterY =
    panelCenterY *
    scaleY;


  const photoWidth =
    panelWidth *
    scale *
    scaleX;


  const photoHeight =
    panelHeight *
    scale *
    scaleY;


  /* =====================
     パネル描画
  ===================== */

  ctx.save();


  ctx.translate(

    photoCenterX,
    photoCenterY

  );


  ctx.rotate(

    rotation *
    Math.PI /
    180

  );


  ctx.drawImage(

    panel,

    -photoWidth / 2,
    -photoHeight / 2,

    photoWidth,
    photoHeight

  );


  ctx.restore();


  /* =====================
     JPEG
  ===================== */

  const image =
    canvas.toDataURL(

      "image/jpeg",

      0.95

    );


  /* =====================
     撮影画像を表示
  ===================== */

  previewImage.src =
    image;


  /* =====================
     撮影画面へ切り替え
  ===================== */

  previewScreen.style.display =
    "flex";


  /* =====================
     カメラ停止
  ===================== */

  if (video.srcObject) {


    video.srcObject
      .getTracks()
      .forEach(

        track => track.stop()

      );


  }

}


/* =========================
   保存
========================= */

saveBtn.addEventListener(

  "click",

  function() {


    const link =
      document.createElement(
        "a"
      );


    link.href =
      previewImage.src;


    link.download =
      "face-panel-" +
      Date.now() +
      ".jpg";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );

  }

);


/* =========================
   撮り直す
========================= */

retakeBtn.addEventListener(

  "click",

  async function() {


    /* 撮影画面を隠す */

    previewScreen.style.display =
      "none";


    /* カメラ再起動 */

    await startCamera();

  }

);


/* =========================
   起動
========================= */

startCamera();


</script>

</body>

</html>

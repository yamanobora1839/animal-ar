<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARテスト</title>

  <!-- 3Dモデル・AR表示用 -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin: 20px 0 5px;
    }

    p {
      margin: 5px 20px 15px;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background-color: white;
    }

    .ar-button {
      background-color: white;
      border: 1px solid #777;
      border-radius: 20px;
      padding: 12px 20px;
      font-size: 16px;
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
    }
  </style>
</head>

<body>

  <h1>ARテスト</h1>
  <p>3DモデルをARで見てみよう</p>

  <model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    alt="宇宙飛行士の3Dモデル"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    shadow-intensity="1"
    auto-rotate>

    <button
      slot="ar-button"
      class="ar-button">
      📱 ARで見る
    </button>

  </model-viewer>

</body>
</html>

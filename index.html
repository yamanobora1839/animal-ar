<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>岐阜県動物愛護センター AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin: 20px 0 5px;
    }

    p {
      margin: 5px 20px 15px;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background-color: white;
    }

    /* ARボタン */
    .ar-button {
      background-color: white;
      border: 1px solid #777;
      border-radius: 20px;
      padding: 12px 20px;
      font-size: 16px;
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
    }

    /* MENUボタン */
    #menuButton {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 20;

      background-color: white;
      border: 2px solid #555;
      border-radius: 25px;

      padding: 12px 20px;
      font-size: 17px;
      font-weight: bold;

      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }

    /* メニュー */
    #menu {
      display: none;

      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);

      width: 90%;
      max-width: 400px;

      z-index: 30;

      background-color: white;
      border-radius: 18px;

      padding: 15px 0;

      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    #menu h2 {
      margin: 5px 0 15px;
      font-size: 20px;
    }

    #menu button {
      display: block;

      width: 85%;
      margin: 10px auto;

      padding: 15px;

      font-size: 18px;

      border: none;
      border-radius: 12px;

      background-color: #f5f5f5;

      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* 閉じるボタン */
    #closeButton {
      background-color: #ddd !important;
    }
  </style>

</head>

<body>

  <h1>岐阜県動物愛護センター</h1>
  <p>ロゴをARで置いてみよう</p>

  <!-- MENUボタン -->

  <button id="menuButton" onclick="openMenu()">
    ☰ MENU
  </button>

<model-viewer
 id="logoModel"
 src="https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/logo-board.glb"
 alt="岐阜県動物愛護センターのロゴ"
 ar
 ar-modes="webxr scene-viewer quick-look"
 camera-controls
 shadow-intensity="1">

```
<button
  slot="ar-button"
  class="ar-button">
  📱 ARで見る
</button>
```

  </model-viewer>

  <!-- メニュー -->

  <div id="menu">

```
<h2>愛護センター体験</h2>

<button onclick="showMessage('お仕事体験')">
  🐕 お仕事体験
</button>

<button onclick="showMessage('トリミング体験')">
  ✂️ トリミング体験
</button>

<button onclick="showMessage('お散歩体験')">
  🐾 お散歩体験
</button>

<button id="closeButton" onclick="closeMenu()">
  ✕ 閉じる
</button>
```

  </div>

  <h2>岐阜県動物愛護センター</h2>

<img
 src="https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/logo.jpg"
 alt="岐阜県動物愛護センターのロゴ"
 width="300">

  <script>

    function openMenu() {
      document.getElementById("menu").style.display = "block";
    }

    function closeMenu() {
      document.getElementById("menu").style.display = "none";
    }

    function showMessage(name) {
      alert(name + "を選択しました！");
    }

  </script>

</body>
</html>

<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>愛護センターAR探検</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin: 20px 0 5px;
      font-size: 24px;
    }

    p {
      margin: 5px 20px 15px;
    }

    model-viewer {
      width: 100%;
      height: 65vh;
      background-color: white;
    }

    /* ARボタン */
    .ar-button {
      background-color: white;
      border: 1px solid #777;
      border-radius: 20px;
      padding: 12px 20px;
      font-size: 16px;

      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
    }

    /* スタンプ表示 */
    #stampArea {
      background-color: white;
      margin: 15px auto;
      padding: 15px;
      width: 90%;
      max-width: 450px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      box-sizing: border-box;
    }

    #stampTitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #stamps {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stamp {
      width: 55px;
      height: 55px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 24px;

      border: 2px solid #ccc;
      background-color: #eee;
    }

    .stamp.get {
      background-color: #fff;
      border-color: #555;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
      font-size: 18px;
    }

    /* ロゴ画像 */
    .logo-image {
      width: 300px;
      max-width: 80%;
      margin-bottom: 30px;
    }
  </style>

</head>

<body>

  <h1>🐾 愛護センターAR探検</h1>

  <p>
    ① 入口のARを楽しもう！
  </p>

  <!-- ARモデル -->

<model-viewer
 id="logoModel"
 src="https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/logo-board.glb"
 alt="岐阜県動物愛護センターのロゴ"
 ar
 ar-modes="webxr scene-viewer quick-look"
 camera-controls
 shadow-intensity="1">

```
<button
  slot="ar-button"
  class="ar-button">
  📱 ARで見る
</button>
```

  </model-viewer>

  <!-- スタンプ -->

  <div id="stampArea">

```
<div id="stampTitle">
  🐾 AR探検スタンプ
</div>

<div id="stamps">

  <div class="stamp" id="stamp1">①</div>
  <div class="stamp" id="stamp2">②</div>
  <div class="stamp" id="stamp3">③</div>
  <div class="stamp" id="stamp4">④</div>
  <div class="stamp" id="stamp5">⑤</div>

</div>

<div id="message">
  入口ARをGET！
</div>
```

  </div>

  <h2>岐阜県動物愛護センター</h2>

<img
 class="logo-image"
 src="https://raw.githubusercontent.com/yamanobora1839/animal-ar/main/logo.jpg"
 alt="岐阜県動物愛護センターのロゴ">

  <script>

    /*
     * ============================
     * AR探検スタンプ
     * ============================
     *
     * 今回は①入口ARをGETします。
     *
     * localStorageという
     * スマホのブラウザ内の保存領域を使います。
     */

    const stampKey = "animalAR_stamp_1";


    // ①入口スタンプをGET
    localStorage.setItem(stampKey, "get");


    // スタンプ表示を更新
    function updateStamps() {

      // ①
      if (localStorage.getItem("animalAR_stamp_1") === "get") {
        document.getElementById("stamp1").classList.add("get");
        document.getElementById("stamp1").textContent = "🐾";
      }

      // ②
      if (localStorage.getItem("animalAR_stamp_2") === "get") {
        document.getElementById("stamp2").classList.add("get");
        document.getElementById("stamp2").textContent = "🐾";
      }

      // ③
      if (localStorage.getItem("animalAR_stamp_3") === "get") {
        document.getElementById("stamp3").classList.add("get");
        document.getElementById("stamp3").textContent = "🐾";
      }

      // ④
      if (localStorage.getItem("animalAR_stamp_4") === "get") {
        document.getElementById("stamp4").classList.add("get");
        document.getElementById("stamp4").textContent = "🐾";
      }

      // ⑤
      if (localStorage.getItem("animalAR_stamp_5") === "get") {
        document.getElementById("stamp5").classList.add("get");
        document.getElementById("stamp5").textContent = "🐾";
      }


      // コンプリート判定

      const allStamps =
        localStorage.getItem("animalAR_stamp_1") === "get" &&
        localStorage.getItem("animalAR_stamp_2") === "get" &&
        localStorage.getItem("animalAR_stamp_3") === "get" &&
        localStorage.getItem("animalAR_stamp_4") === "get" &&
        localStorage.getItem("animalAR_stamp_5") === "get";


      if (allStamps) {

        document.getElementById("message").textContent =
          "🎉 AR探検コンプリート！ 🎉";

      }

    }


    // ページを開いたらスタンプ表示
    updateStamps();

  </script>

</body>
</html>

<div class="app">

    <p class="small">PNG形式で保存します。</p>
  </section>

<script>
"use strict";

const PANEL_FILES = {
  "2": "./halloween_face_panel02.png",
  "1": "./halloween_face_panel.png"
};

const CATEGORIES = {
  mahoutukai: { label: "魔法使い", prefix: "body_mahoutukai", count: 8 },
  majo: { label: "魔女", prefix: "body_majo", count: 8 },
  mahou_child: { label: "魔法の子ども", prefix: "body_mahou_child", count: 6 }
};

const stage = document.getElementById("stage");
const video = document.getElementById("video");
const photoCanvas = document.getElementById("photoCanvas");
const panelLayer = document.getElementById("panelLayer");
const bodyLayer = document.getElementById("bodyLayer");
const emptyMessage = document.getElementById("emptyMessage");
const startButton = document.getElementById("startButton");
const captureButton = document.getElementById("captureButton");
const panelToggleButton = document.getElementById("panelToggleButton");
const panelChoices = document.getElementById("panelChoices");
const reselectButton = document.getElementById("reselectButton");
const retakeButton = document.getElementById("retakeButton");
const saveButton = document.getElementById("saveButton");
const bodySection = document.getElementById("bodySection");
const categoriesElement = document.getElementById("categories");
const bodyGrid = document.getElementById("bodyGrid");
const statusElement = document.getElementById("status");

let cameraStream = null;
let cameraStarted = false;
let captured = false;
let panelVisible = true;
let selectedPanelId = "2";
let panelImage = new Image();
let currentCategory = "mahoutukai";
let selectedBodyImage = null;
let selectedBodyName = "";

const panelBase = { x: 0, y: 0, width: 0, height: 0 };
const bodyTransform = {
  x: 0, y: 0, width: 0, height: 0, scale: 1, rotation: 0
};

function setStatus(message) {
  statusElement.textContent = message;
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("画像を読み込めません: " + src));
    image.src = src;
  });
}

function applyPanelPosition() {
  panelLayer.style.left = panelBase.x + "px";
  panelLayer.style.top = panelBase.y + "px";
  panelLayer.style.width = panelBase.width + "px";
  panelLayer.style.height = panelBase.height + "px";
}

function layoutPanelInitial() {
  if (!panelImage.naturalWidth) return;

  const sw = stage.clientWidth;
  const sh = stage.clientHeight;
  if (!sw || !sh) return;

  const ratio = Math.min(
    sw * 0.98 / panelImage.naturalWidth,
    sh * 0.98 / panelImage.naturalHeight
  );

  panelBase.width = panelImage.naturalWidth * ratio;
  panelBase.height = panelImage.naturalHeight * ratio;
  panelBase.x = (sw - panelBase.width) / 2;
  panelBase.y = (sh - panelBase.height) / 2;
  applyPanelPosition();
}

function updatePanelVisibility() {
  panelLayer.style.visibility = panelVisible ? "visible" : "hidden";
  panelToggleButton.textContent = panelVisible ? "パネル非表示" : "パネル表示";
}

async function selectPanel(id) {
  if (!PANEL_FILES[id]) return;

  try {
    const image = await loadImage(PANEL_FILES[id]);
    selectedPanelId = id;
    panelImage = image;
    panelLayer.src = image.src;

    /* 選択したパネルに合わせて初期位置・大きさを調整 */
    layoutPanelInitial();

    panelChoices.querySelectorAll("button[data-panel]").forEach(button => {
      button.classList.toggle("active", button.dataset.panel === id);
    });

    setStatus(id === "2" ? "パネル1を選択しました。" : "パネル2を選択しました。");
  } catch (error) {
    console.error(error);
    setStatus("パネル画像を読み込めませんでした。ファイル名と配置を確認してください。");
  }
}

async function startCamera() {
  if (cameraStarted) return;

  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("カメラを利用できません。HTTPSでページを開いてください。");
    return;
  }

  startButton.disabled = true;
  setStatus("カメラを起動しています…");

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    video.srcObject = cameraStream;

    await new Promise((resolve, reject) => {
      if (video.readyState >= 1 && video.videoWidth > 0) {
        resolve();
      } else {
        video.onloadedmetadata = resolve;
        video.onerror = () => reject(new Error("カメラ映像を読み込めません。"));
      }
    });

    await video.play();
    cameraStarted = true;
    captureButton.disabled = false;
    emptyMessage.classList.add("hidden");
    setStatus("位置を確認して撮影してください。");
  } catch (error) {
    console.error(error);
    setStatus("カメラを起動できませんでした。カメラの使用許可を確認してください。");
    startButton.disabled = false;
  }
}

/* 画面表示と同じ範囲を切り抜いて撮影 */
function drawVideoCover(ctx, outputWidth, outputHeight) {
  const sourceWidth = video.videoWidth;
  const sourceHeight = video.videoHeight;

  if (!sourceWidth || !sourceHeight) {
    throw new Error("カメラ映像の準備ができていません。");
  }

  const sourceRatio = sourceWidth / sourceHeight;
  const outputRatio = outputWidth / outputHeight;
  let sx = 0, sy = 0, sw = sourceWidth, sh = sourceHeight;

  if (sourceRatio > outputRatio) {
    sw = sourceHeight * outputRatio;
    sx = (sourceWidth - sw) / 2;
  } else {
    sh = sourceWidth / outputRatio;
    sy = (sourceHeight - sh) / 2;
  }

  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, outputWidth, outputHeight);
}

function capturePhoto() {
  if (!cameraStarted || !video.videoWidth) {
    setStatus("先にカメラを起動してください。");
    return;
  }

  const width = stage.clientWidth;
  const height = stage.clientHeight;
  const ratio = video.videoWidth / video.videoHeight;
  const stageRatio = width / height;
  let outputWidth, outputHeight;

  if (ratio > stageRatio) {
    outputHeight = video.videoHeight;
    outputWidth = Math.round(outputHeight * stageRatio);
  } else {
    outputWidth = video.videoWidth;
    outputHeight = Math.round(outputWidth / stageRatio);
  }

  photoCanvas.width = Math.max(1, outputWidth);
  photoCanvas.height = Math.max(1, outputHeight);

  try {
    drawVideoCover(photoCanvas.getContext("2d"), photoCanvas.width, photoCanvas.height);
  } catch (error) {
    console.error(error);
    setStatus("撮影に失敗しました。もう一度お試しください。");
    return;
  }

  captured = true;
  stage.classList.add("show-photo");
  captureButton.classList.add("hidden");
  retakeButton.classList.remove("hidden");
  saveButton.classList.remove("hidden");
  reselectButton.classList.remove("hidden");
  bodySection.classList.remove("hidden");

  renderBodyChoices(currentCategory);
  setStatus("衣装を選んで位置を調整してください。");
}

function renderBodyChoices(category) {
  currentCategory = category;
  bodyGrid.innerHTML = "";
  const data = CATEGORIES[category];

  for (let i = 1; i <= data.count; i++) {
    const filename = data.prefix + String(i).padStart(2, "0") + ".png";
    const src = "./" + filename;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "body-option";
    button.setAttribute("aria-label", data.label + " " + i);

    const image = document.createElement("img");
    image.src = src;
    image.alt = data.label + " " + i;
    image.loading = "lazy";
    image.draggable = false;

    const label = document.createElement("span");
    label.textContent = data.label + " " + i;

    button.append(image, label);
    if (selectedBodyName === filename) button.classList.add("active");

    button.addEventListener("click", async () => {
      try {
        selectedBodyImage = await loadImage(src);
        selectedBodyName = filename;

        const targetHeight = stage.clientHeight * 0.72;
        const scale = targetHeight / selectedBodyImage.naturalHeight;

        bodyTransform.width = selectedBodyImage.naturalWidth * scale;
        bodyTransform.height = selectedBodyImage.naturalHeight * scale;
        bodyTransform.scale = 1;
        bodyTransform.rotation = 0;
        bodyTransform.x = (stage.clientWidth - bodyTransform.width) / 2;
        bodyTransform.y = (stage.clientHeight - bodyTransform.height) / 2;

        bodyLayer.src = src;
        bodyLayer.classList.remove("hidden");
        applyBodyTransform();

        bodySection.classList.add("hidden");
        renderBodyChoices(category);
        setStatus("衣装を配置しました。指で位置や大きさを調整してください。");
      } catch (error) {
        console.error(error);
        setStatus("衣装画像を読み込めませんでした。");
      }
    });

    bodyGrid.appendChild(button);
  }
}

categoriesElement.addEventListener("click", event => {
  const button = event.target.closest("button[data-category]");
  if (!button) return;

  const category = button.dataset.category;
  if (!CATEGORIES[category]) return;

  categoriesElement.querySelectorAll("button").forEach(item => {
    item.classList.toggle("active", item === button);
  });

  renderBodyChoices(category);
});

function applyBodyTransform() {
  bodyLayer.style.left = bodyTransform.x + "px";
  bodyLayer.style.top = bodyTransform.y + "px";
  bodyLayer.style.width = bodyTransform.width * bodyTransform.scale + "px";
  bodyLayer.style.height = bodyTransform.height * bodyTransform.scale + "px";
  bodyLayer.style.transformOrigin = "center center";
  bodyLayer.style.transform = "rotate(" + bodyTransform.rotation + "rad)";
}

function centerOf(points) {
  const values = [...points.values()];
  return {
    x: values.reduce((sum, p) => sum + p.x, 0) / values.length,
    y: values.reduce((sum, p) => sum + p.y, 0) / values.length
  };
}

function distanceOf(points) {
  const values = [...points.values()];
  if (values.length < 2) return 0;
  return Math.hypot(values[1].x - values[0].x, values[1].y - values[0].y);
}

function angleOf(points) {
  const values = [...points.values()];
  if (values.length < 2) return 0;
  return Math.atan2(values[1].y - values[0].y, values[1].x - values[0].x);
}

function pointOnStage(event) {
  const rect = stage.getBoundingClientRect();
  return { x: event.clientX - rect.left, y: event.clientY - rect.top };
}

function attachGestures(element, type) {
  const pointers = new Map();
  let start = null;

  function readTransform() {
    if (type === "panel") {
      return {
        x: panelBase.x,
        y: panelBase.y,
        width: panelBase.width,
        height: panelBase.height,
        scale: 1,
        rotation: 0
      };
    }
    return { ...bodyTransform };
  }

  function writeTransform(t) {
    if (type === "panel") {
      Object.assign(panelBase, {
        x: t.x, y: t.y, width: t.width, height: t.height
      });
      applyPanelPosition();
    } else {
      Object.assign(bodyTransform, t);
      applyBodyTransform();
    }
  }

  function beginGesture() {
    const t = readTransform();
    const center = centerOf(pointers);
    const distance = distanceOf(pointers);
    const angle = angleOf(pointers);

    const imageCenterX = t.x + t.width * t.scale / 2;
    const imageCenterY = t.y + t.height * t.scale / 2;
    const dx = center.x - imageCenterX;
    const dy = center.y - imageCenterY;
    const cos = Math.cos(t.rotation);
    const sin = Math.sin(t.rotation);

    start = {
      ...t,
      center,
      distance,
      angle,
      anchorX: (dx * cos + dy * sin) / t.scale,
      anchorY: (-dx * sin + dy * cos) / t.scale
    };
  }

  element.addEventListener("pointerdown", event => {
    if (type === "body" && (!captured || !selectedBodyImage)) return;
    if (type === "panel" && !panelVisible) return;

    event.preventDefault();
    element.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, pointOnStage(event));
    beginGesture();
  });

  element.addEventListener("pointermove", event => {
    if (!pointers.has(event.pointerId) || !start) return;
    event.preventDefault();

    pointers.set(event.pointerId, pointOnStage(event));
    const center = centerOf(pointers);
    const t = { ...start };

    if (pointers.size === 1) {
      t.x = start.x + center.x - start.center.x;
      t.y = start.y + center.y - start.center.y;
      writeTransform(t);
      return;
    }

    const distance = distanceOf(pointers);
    const ratio = start.distance > 0 ? distance / start.distance : 1;

    if (type === "panel") {
      const newWidth = Math.max(40, Math.min(stage.clientWidth * 4, start.width * ratio));
      const scale = newWidth / start.width;

      t.width = newWidth;
      t.height = start.height * scale;

      /* 指の中間点を基準にして、画像がずれないようにする */
      t.x = center.x - (start.center.x - start.x) * scale;
      t.y = center.y - (start.center.y - start.y) * scale;
    } else {
      t.scale = Math.max(0.15, Math.min(5, start.scale * ratio));
      t.rotation = start.rotation + angleOf(pointers) - start.angle;

      const cos = Math.cos(t.rotation);
      const sin = Math.sin(t.rotation);
      const offsetX = (start.anchorX * cos - start.anchorY * sin) * t.scale;
      const offsetY = (start.anchorX * sin + start.anchorY * cos) * t.scale;

      const imageCenterX = center.x - offsetX;
      const imageCenterY = center.y - offsetY;

      t.x = imageCenterX - t.width * t.scale / 2;
      t.y = imageCenterY - t.height * t.scale / 2;
    }

    writeTransform(t);
  });

  function endPointer(event) {
    if (!pointers.has(event.pointerId)) return;
    pointers.delete(event.pointerId);

    if (pointers.size === 0) {
      start = null;
    } else {
      beginGesture();
    }
  }

  element.addEventListener("pointerup", endPointer);
  element.addEventListener("pointercancel", endPointer);
  element.addEventListener("lostpointercapture", endPointer);
}

attachGestures(panelLayer, "panel");
attachGestures(bodyLayer, "body");

async function savePhoto() {
  if (!captured) {
    setStatus("先に撮影してください。");
    return;
  }

  if (!selectedBodyImage) {
    setStatus("先に衣装を選んでください。");
    return;
  }

  saveButton.disabled = true;
  setStatus("写真を作成しています…");

  try {
    const canvas = document.createElement("canvas");
    canvas.width = photoCanvas.width;
    canvas.height = photoCanvas.height;

    const ctx = canvas.getContext("2d");
    if (!ctx) throw new Error("画像を作成できません。");

    ctx.drawImage(photoCanvas, 0, 0);

    const scaleX = canvas.width / stage.clientWidth;
    const scaleY = canvas.height / stage.clientHeight;

    /* 選択中で、表示状態のパネルだけを保存画像に合成 */
    if (panelVisible && panelImage.complete && panelImage.naturalWidth > 0) {
      ctx.drawImage(
        panelImage,
        panelBase.x * scaleX,
        panelBase.y * scaleY,
        panelBase.width * scaleX,
        panelBase.height * scaleY
      );
    }

    const centerX =
      (bodyTransform.x + bodyTransform.width * bodyTransform.scale / 2) * scaleX;
    const centerY =
      (bodyTransform.y + bodyTransform.height * bodyTransform.scale / 2) * scaleY;
    const bodyWidth = bodyTransform.width * bodyTransform.scale * scaleX;
    const bodyHeight = bodyTransform.height * bodyTransform.scale * scaleY;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(bodyTransform.rotation);
    ctx.drawImage(
      selectedBodyImage,
      -bodyWidth / 2,
      -bodyHeight / 2,
      bodyWidth,
      bodyHeight
    );
    ctx.restore();

    const blob = await new Promise((resolve, reject) => {
      canvas.toBlob(result => {
        if (result) resolve(result);
        else reject(new Error("PNG画像を作成できませんでした。"));
      }, "image/png");
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const now = new Date();
    const stamp =
      now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, "0") +
      String(now.getDate()).padStart(2, "0") + "_" +
      String(now.getHours()).padStart(2, "0") +
      String(now.getMinutes()).padStart(2, "0") +
      String(now.getSeconds()).padStart(2, "0");

    link.href = url;
    link.download = "halloween_photo_" + stamp + ".png";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);

    setStatus("写真を作成しました。保存先を確認してください。");
  } catch (error) {
    console.error(error);
    setStatus("写真を保存できませんでした。もう一度お試しください。");
  } finally {
    saveButton.disabled = false;
  }
}

function retakePhoto() {
  captured = false;
  selectedBodyImage = null;
  selectedBodyName = "";

  Object.assign(bodyTransform, {
    x: 0, y: 0, width: 0, height: 0, scale: 1, rotation: 0
  });

  stage.classList.remove("show-photo");
  bodyLayer.removeAttribute("src");
  bodyLayer.classList.add("hidden");
  bodySection.classList.add("hidden");

  captureButton.classList.remove("hidden");
  captureButton.disabled = !cameraStarted;
  retakeButton.classList.add("hidden");
  saveButton.classList.add("hidden");
  reselectButton.classList.add("hidden");
  emptyMessage.classList.add("hidden");

  setStatus("位置を確認して、もう一度撮影してください。");
}

startButton.addEventListener("click", startCamera);
captureButton.addEventListener("click", capturePhoto);

panelToggleButton.addEventListener("click", () => {
  panelVisible = !panelVisible;
  updatePanelVisibility();
  setStatus(panelVisible ? "パネルを表示しました。" : "パネルを非表示にしました。");
});

panelChoices.addEventListener("click", event => {
  const button = event.target.closest("button[data-panel]");
  if (!button) return;
  selectPanel(button.dataset.panel);
});

reselectButton.addEventListener("click", () => {
  bodySection.classList.remove("hidden");
});

retakeButton.addEventListener("click", retakePhoto);
saveButton.addEventListener("click", savePhoto);

window.addEventListener("resize", () => {
  if (!captured) layoutPanelInitial();
});

window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    if (!captured) layoutPanelInitial();
  }, 250);
});

/* 起動時はパネル02を表示 */
selectPanel("2");
updatePanelVisibility();
</script>
</body>

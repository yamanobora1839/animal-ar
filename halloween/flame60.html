
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>岐阜県動物愛護センター ハロウィン顔出しフォト</title>

<style>
:root {
  color-scheme: dark;
  --bg: #171717;
  --panel: #262626;
  --accent: #ff9d32;
  --text: #ffffff;
  --muted: #cccccc;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
}

body {
  min-height: 100dvh;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 15px;
  min-height: 44px;
  background: var(--accent);
  color: #171717;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
}

button:disabled {
  opacity: 0.4;
  cursor: default;
}

button.secondary {
  background: #454545;
  color: #ffffff;
}

button:focus-visible {
  outline: 3px solid #ffffff;
  outline-offset: 2px;
}

.app {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

header {
  text-align: center;
}

h1 {
  margin: 0;
  font-size: clamp(18px, 4vw, 25px);
}

.description {
  margin: 5px 0 0;
  font-size: 13px;
  color: var(--muted);
}

.stage-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 0;
}

.stage {
  position: relative;
  width: 100%;
  max-width: 560px;
  aspect-ratio: 3 / 4;
  max-height: 68dvh;
  overflow: hidden;
  background: #000000;
  border-radius: 12px;
  isolation: isolate;
}

/* カメラ・撮影画像はステージ全体を埋める */
.stage video,
.stage canvas,
.stage .layer {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

.stage video {
  object-fit: cover;
  object-position: center center;
  background: #000000;
}

.stage canvas {
  object-fit: fill;
  visibility: hidden;
  pointer-events: none;
}

.stage.show-photo video {
  visibility: hidden;
}

.stage.show-photo canvas {
  visibility: visible;
}

.stage .layer {
  object-fit: fill;
  pointer-events: none;
}

.panel-layer {
  z-index: 3;
}

.body-layer {
  z-index: 4;
  display: none !important;
  object-fit: fill;
  pointer-events: auto !important;
  touch-action: none;
  user-select: none;
  -webkit-user-drag: none;
}

.stage.show-photo .body-layer {
  display: block !important;
}

.empty {
  position: absolute;
  z-index: 5;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
  text-align: center;
  color: #ffffff;
  font-size: 15px;
  background: rgb(0 0 0 / 35%);
  pointer-events: none;
}

.empty.hidden {
  display: none;
}

.controls,
.section {
  width: 100%;
  background: var(--panel);
  border-radius: 12px;
  padding: 12px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.controls button {
  flex: 1 1 140px;
}

.section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.section h2 {
  font-size: 16px;
  margin: 0;
}

.hint {
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
  margin: 0;
}

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.categories button {
  background: #454545;
  color: #ffffff;
  flex: 1 1 auto;
}

.categories button.active {
  background: var(--accent);
  color: #171717;
}

.body-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.body-option {
  min-width: 0;
  padding: 5px;
  border: 2px solid transparent;
  border-radius: 8px;
  background: #383838;
  cursor: pointer;
}

.body-option.active {
  border-color: var(--accent);
}

.body-option img {
  display: block;
  width: 100%;
  height: 100px;
  object-fit: contain;
  pointer-events: none;
}

.body-option span {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.status {
  min-height: 20px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}

.hidden {
  display: none !important;
}

.small {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

/* 横向き：カメラを左、操作を右に配置 */
@media (orientation: landscape) and (max-height: 700px) {
  .app {
    max-width: none;
    min-height: 100dvh;
    padding: 8px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(230px, 34vw);
    grid-template-rows: auto auto minmax(0, 1fr);
    align-items: start;
    gap: 8px;
  }

  header {
    grid-column: 1 / -1;
    grid-row: 1;
    text-align: left;
  }

  .description {
    display: none;
  }

  .stage-wrap {
    grid-column: 1;
    grid-row: 2 / 4;
    min-height: 0;
    align-self: center;
  }

  .stage {
    width: auto;
    height: min(76dvh, 620px);
    max-height: 76dvh;
    max-width: 100%;
    aspect-ratio: 4 / 3;
  }

  .controls {
    grid-column: 2;
    grid-row: 2;
    padding: 8px;
    gap: 6px;
  }

  .controls button {
    flex: 1 1 100%;
    min-height: 40px;
    padding: 9px;
    font-size: 14px;
  }

  .section {
    grid-column: 2;
    grid-row: 3;
    min-height: 0;
    padding: 8px;
    gap: 7px;
  }

  .body-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px;
  }

  .body-option {
    padding: 3px;
  }

  .body-option img {
    height: 64px;
  }

  .categories {
    gap: 5px;
  }

  .categories button {
    padding: 8px;
    min-height: 36px;
    font-size: 12px;
  }

  .status {
    grid-column: 1 / -1;
    grid-row: 4;
    text-align: left;
  }
}

@media (orientation: portrait) {
  .stage {
    width: 100%;
    max-width: min(560px, 100%);
    max-height: 68dvh;
  }
}

@media (max-width: 380px) and (orientation: portrait) {
  .app {
    padding: 8px;
    gap: 8px;
  }

  .body-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .body-option img {
    height: 84px;
  }
}
</style>
</head>

<body>
<div class="app">

  <header>
    <h1>ハロウィン顔出しフォト</h1>
    <p class="description">好きな衣装を選んで、記念写真を撮ろう！</p>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">

      <video id="video" autoplay playsinline muted></video>

      <canvas id="photoCanvas"></canvas>

      <img
        id="panelLayer"
        class="layer panel-layer"
        alt=""
        draggable="false"
      >

      <img
        id="bodyLayer"
        class="layer body-layer"
        alt=""
        draggable="false"
      >

      <div class="empty" id="emptyMessage">
        「撮影を開始」を押して、カメラを起動してください。
      </div>

    </div>
  </div>

  <div class="controls">
    <button id="startButton">撮影を開始</button>
    <button id="captureButton" disabled>撮影</button>
    <button id="retakeButton" class="secondary hidden">撮り直す</button>
    <button id="saveButton" class="hidden">写真を保存</button>
  </div>

  <section class="section hidden" id="bodySection">
    <h2>衣装を選ぶ</h2>
    <p class="hint">
      衣装を選んだら、写真の上で指を動かして位置を調整できます。
      2本指で拡大・縮小・回転できます。
    </p>

    <div class="categories" id="categories">
      <button class="active" data-category="mahoutukai">魔法使い</button>
      <button data-category="majo">魔女</button>
      <button data-category="mahou_child">魔法の子ども</button>
    </div>

    <div class="body-grid" id="bodyGrid"></div>

    <p class="small">
      保存される画像はPNG形式です。撮影画像と衣装を合成して保存します。
    </p>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>

</div>

<script>
"use strict";

/* 画像はこのHTMLと同じフォルダに置いてください */
const ASSET_DIR = "./";
const PANEL_SRC = ASSET_DIR + "halloween_face_panel.png";

const CATEGORIES = {
  mahoutukai: {
    label: "魔法使い",
    prefix: "body_mahoutukai",
    count: 8
  },
  majo: {
    label: "魔女",
    prefix: "body_majo",
    count: 8
  },
  mahou_child: {
    label: "魔法の子ども",
    prefix: "body_mahou_child",
    count: 6
  }
};

const stage = document.getElementById("stage");
const video = document.getElementById("video");
const photoCanvas = document.getElementById("photoCanvas");
const panelLayer = document.getElementById("panelLayer");
const bodyLayer = document.getElementById("bodyLayer");
const emptyMessage = document.getElementById("emptyMessage");

const startButton = document.getElementById("startButton");
const captureButton = document.getElementById("captureButton");
const retakeButton = document.getElementById("retakeButton");
const saveButton = document.getElementById("saveButton");

const bodySection = document.getElementById("bodySection");
const categoriesElement = document.getElementById("categories");
const bodyGrid = document.getElementById("bodyGrid");
const statusElement = document.getElementById("status");

let cameraStream = null;
let cameraStarted = false;
let captured = false;
let currentCategory = "mahoutukai";
let selectedBodyImage = null;
let selectedBodyName = "";
let panelImage = new Image();

/* ステージ上のパネルの位置と大きさ */
let panelBase = {
  x: 0,
  y: 0,
  width: 0,
  height: 0
};

/* 衣装の位置・倍率・回転 */
let bodyTransform = {
  x: 0,
  y: 0,
  scale: 1,
  rotation: 0,
  width: 0,
  height: 0
};

let activePointers = new Map();
let gestureStart = null;
let previousStageSize = {
  width: 0,
  height: 0
};

function setStatus(message) {
  statusElement.textContent = message;
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("画像を読み込めません: " + src));
    image.src = src;
  });
}

/* パネル画像をステージ内に収まる大きさで表示 */
function calculatePanelSize() {
  if (!panelImage.complete || !panelImage.naturalWidth) return;

  const stageWidth = stage.clientWidth;
  const stageHeight = stage.clientHeight;

  if (!stageWidth || !stageHeight) return;

  const maxWidth = stageWidth * 0.98;
  const maxHeight = stageHeight * 0.98;

  const ratio = Math.min(
    maxWidth / panelImage.naturalWidth,
    maxHeight / panelImage.naturalHeight
  );

  const width = panelImage.naturalWidth * ratio;
  const height = panelImage.naturalHeight * ratio;

  panelBase.width = width;
  panelBase.height = height;
}

function applyPanelPosition() {
  panelLayer.style.left = panelBase.x + "px";
  panelLayer.style.top = panelBase.y + "px";
  panelLayer.style.width = panelBase.width + "px";
  panelLayer.style.height = panelBase.height + "px";
}

function layoutPanelInitial() {
  calculatePanelSize();

  panelBase.x = (stage.clientWidth - panelBase.width) / 2;
  panelBase.y = (stage.clientHeight - panelBase.height) / 2;

  applyPanelPosition();
}

/*
 * 画面回転・サイズ変更時にパネルの配置を調整します。
 * 衣装を選んで調整した後は、その位置をなるべく維持します。
 */
function handleResize() {
  const oldWidth = previousStageSize.width;
  const oldHeight = previousStageSize.height;

  const oldCenterX = oldWidth
    ? (panelBase.x + panelBase.width / 2) / oldWidth
    : 0.5;

  const oldCenterY = oldHeight
    ? (panelBase.y + panelBase.height / 2) / oldHeight
    : 0.5;

  const stageWidth = stage.clientWidth;
  const stageHeight = stage.clientHeight;

  if (!stageWidth || !stageHeight) return;

  if (!captured) {
    calculatePanelSize();

    panelBase.x =
      oldWidth ? oldCenterX * stageWidth - panelBase.width / 2
               : (stageWidth - panelBase.width) / 2;

    panelBase.y =
      oldHeight ? oldCenterY * stageHeight - panelBase.height / 2
                : (stageHeight - panelBase.height) / 2;

    applyPanelPosition();
  }

  previousStageSize = {
    width: stageWidth,
    height: stageHeight
  };
}

/* 背面カメラを起動 */
async function startCamera() {
  if (cameraStarted) return;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus("このブラウザではカメラを利用できません。HTTPSで開いてください。");
    return;
  }

  startButton.disabled = true;
  setStatus("カメラを起動しています…");

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    video.srcObject = cameraStream;

    await new Promise((resolve, reject) => {
      if (video.readyState >= 1 && video.videoWidth > 0) {
        resolve();
        return;
      }

      video.onloadedmetadata = () => resolve();
      video.onerror = () => reject(new Error("カメラ映像を読み込めません。"));
    });

    await video.play();

    cameraStarted = true;
    captureButton.disabled = false;
    emptyMessage.classList.add("hidden");

    handleResize();
    setStatus("カメラを起動しました。位置を確認して撮影してください。");
  } catch (error) {
    console.error(error);

    let message = "カメラを起動できませんでした。カメラの使用を許可してください。";

    if (error && error.name === "NotAllowedError") {
      message = "カメラの使用が許可されていません。ブラウザの設定を確認してください。";
    } else if (error && error.name === "NotFoundError") {
      message = "利用できるカメラが見つかりませんでした。";
    }

    setStatus(message);
    startButton.disabled = false;
  }
}

/*
 * object-fit: cover と同じ切り抜き方で撮影します。
 * プレビューと撮影画像の範囲を一致させ、黒い余白を作りません。
 */
function drawVideoCover(ctx, outputWidth, outputHeight) {
  const sourceWidth = video.videoWidth;
  const sourceHeight = video.videoHeight;

  if (!sourceWidth || !sourceHeight) {
    throw new Error("カメラ映像の準備ができていません。");
  }

  const sourceRatio = sourceWidth / sourceHeight;
  const outputRatio = outputWidth / outputHeight;

  let sx = 0;
  let sy = 0;
  let sw = sourceWidth;
  let sh = sourceHeight;

  if (sourceRatio > outputRatio) {
    sw = sourceHeight * outputRatio;
    sx = (sourceWidth - sw) / 2;
  } else {
    sh = sourceWidth / outputRatio;
    sy = (sourceHeight - sh) / 2;
  }

  ctx.drawImage(
    video,
    sx, sy, sw, sh,
    0, 0, outputWidth, outputHeight
  );
}

/* 撮影 */
function capturePhoto() {
  if (!cameraStarted || !video.videoWidth) {
    setStatus("先にカメラを起動してください。");
    return;
  }

  const stageWidth = stage.clientWidth;
  const stageHeight = stage.clientHeight;

  if (!stageWidth || !stageHeight) return;

  /*
   * カメラ映像の解像度をできるだけ活かしつつ、
   * 現在のステージと同じ縦横比で保存します。
   */
  const stageRatio = stageWidth / stageHeight;
  const sourceRatio = video.videoWidth / video.videoHeight;

  let outputWidth;
  let outputHeight;

  if (sourceRatio > stageRatio) {
    outputHeight = video.videoHeight;
    outputWidth = Math.round(outputHeight * stageRatio);
  } else {
    outputWidth = video.videoWidth;
    outputHeight = Math.round(outputWidth / stageRatio);
  }

  photoCanvas.width = Math.max(1, outputWidth);
  photoCanvas.height = Math.max(1, outputHeight);

  const ctx = photoCanvas.getContext("2d");

  try {
    drawVideoCover(ctx, photoCanvas.width, photoCanvas.height);
  } catch (error) {
    console.error(error);
    setStatus("撮影に失敗しました。もう一度お試しください。");
    return;
  }

  captured = true;
  stage.classList.add("show-photo");

  captureButton.classList.add("hidden");
  retakeButton.classList.remove("hidden");
  saveButton.classList.remove("hidden");
  bodySection.classList.remove("hidden");

  emptyMessage.classList.add("hidden");

  /*
   * パネルは撮影画像の上に表示し続けます。
   * 保存時にも同じパネル画像を合成します。
   */
  bodyLayer.style.display = "none";

  renderBodyChoices(currentCategory);
  setStatus("衣装を選んで位置を調整してください。");
}

/* 衣装画像の一覧を表示 */
function renderBodyChoices(category) {
  currentCategory = category;
  bodyGrid.innerHTML = "";

  const data = CATEGORIES[category];

  for (let i = 1; i <= data.count; i++) {
    const filename = data.prefix + String(i).padStart(2, "0") + ".png";
    const src = ASSET_DIR + filename;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "body-option";
    button.setAttribute("aria-label", data.label + " " + i);

    const image = document.createElement("img");
    image.src = src;
    image.alt = data.label + " " + i;
    image.loading = "lazy";
    image.draggable = false;

    const label = document.createElement("span");
    label.textContent = data.label + " " + i;

    button.appendChild(image);
    button.appendChild(label);

    if (selectedBodyName === filename) {
      button.classList.add("active");
    }

    button.addEventListener("click", async () => {
      try {
        const loadedImage = await loadImage(src);

        selectedBodyImage = loadedImage;
        selectedBodyName = filename;

        const stageWidth = stage.clientWidth;
        const stageHeight = stage.clientHeight;

        /*
         * 衣装の初期サイズはステージの高さを基準にします。
         * 選択後はドラッグやピンチ操作で調整できます。
         */
        const targetHeight = stageHeight * 0.72;
        const scale = targetHeight / loadedImage.naturalHeight;

        bodyTransform.width = loadedImage.naturalWidth * scale;
        bodyTransform.height = loadedImage.naturalHeight * scale;
        bodyTransform.scale = 1;
        bodyTransform.rotation = 0;
        bodyTransform.x = (stageWidth - bodyTransform.width) / 2;
        bodyTransform.y = (stageHeight - bodyTransform.height) / 2;

        bodyLayer.src = src;
        bodyLayer.style.display = "block";

        renderBodyChoices(category);
        setStatus("衣装を配置しました。指で位置や大きさを調整してください。");
      } catch (error) {
        console.error(error);
        setStatus("衣装画像を読み込めませんでした: " + filename);
      }
    });

    bodyGrid.appendChild(button);
  }
}

/* カテゴリ切り替え */
categoriesElement.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-category]");
  if (!button) return;

  const category = button.dataset.category;
  if (!CATEGORIES[category]) return;

  categoriesElement.querySelectorAll("button").forEach((item) => {
    item.classList.toggle("active", item === button);
  });

  renderBodyChoices(category);
});

/* 衣装を画面に表示 */
function applyBodyTransform() {
  bodyLayer.style.left = bodyTransform.x + "px";
  bodyLayer.style.top = bodyTransform.y + "px";
  bodyLayer.style.width = bodyTransform.width * bodyTransform.scale + "px";
  bodyLayer.style.height = bodyTransform.height * bodyTransform.scale + "px";
  bodyLayer.style.transformOrigin = "center center";
  bodyLayer.style.transform = "rotate(" + bodyTransform.rotation + "rad)";
}

/* 指の中心点 */
function pointerCenter(points) {
  const values = Array.from(points.values());

  const x = values.reduce((sum, point) => sum + point.x, 0) / values.length;
  const y = values.reduce((sum, point) => sum + point.y, 0) / values.length;

  return { x, y };
}

function pointerDistance(points) {
  const values = Array.from(points.values());
  if (values.length < 2) return 0;

  return Math.hypot(
    values[0].x - values[1].x,
    values[0].y - values[1].y
  );
}

function pointerAngle(points) {
  const values = Array.from(points.values());
  if (values.length < 2) return 0;

  return Math.atan2(
    values[1].y - values[0].y,
    values[1].x - values[0].x
  );
}

bodyLayer.addEventListener("pointerdown", (event) => {
  if (!captured || !selectedBodyImage) return;

  event.preventDefault();
  bodyLayer.setPointerCapture(event.pointerId);

  const rect = stage.getBoundingClientRect();

  activePointers.set(event.pointerId, {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  });

  gestureStart = {
    x: bodyTransform.x,
    y: bodyTransform.y,
    scale: bodyTransform.scale,
    rotation: bodyTransform.rotation,
    center: pointerCenter(activePointers),
    distance: pointerDistance(activePointers),
    angle: pointerAngle(activePointers)
  };
});

bodyLayer.addEventListener("pointermove", (event) => {
  if (!activePointers.has(event.pointerId) || !gestureStart) return;

  event.preventDefault();

  const rect = stage.getBoundingClientRect();

  activePointers.set(event.pointerId, {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  });

  const center = pointerCenter(activePointers);

  if (activePointers.size === 1) {
    bodyTransform.x =
      gestureStart.x + center.x - gestureStart.center.x;

    bodyTransform.y =
      gestureStart.y + center.y - gestureStart.center.y;
  } else {
    const distance = pointerDistance(activePointers);
    const angle = pointerAngle(activePointers);

    if (gestureStart.distance > 0) {
      bodyTransform.scale = Math.max(
        0.15,
        Math.min(5, gestureStart.scale * distance / gestureStart.distance)
      );
    }

    bodyTransform.rotation =
      gestureStart.rotation + angle - gestureStart.angle;

    const dx = center.x - gestureStart.center.x;
    const dy = center.y - gestureStart.center.y;

    bodyTransform.x = gestureStart.x + dx;
    bodyTransform.y = gestureStart.y + dy;
  }

  applyBodyTransform();
});

function endPointer(event) {
  activePointers.delete(event.pointerId);

  if (activePointers.size === 0) {
    gestureStart = null;
    return;
  }

  /*
   * 指が1本残った場合は、その位置からドラッグを続けられるよう
   * 新しい開始位置を設定します。
   */
  const center = pointerCenter(activePointers);

  gestureStart = {
    x: bodyTransform.x,
    y: bodyTransform.y,
    scale: bodyTransform.scale,
    rotation: bodyTransform.rotation,
    center,
    distance: pointerDistance(activePointers),
    angle: pointerAngle(activePointers)
  };
}

bodyLayer.addEventListener("pointerup", endPointer);
bodyLayer.addEventListener("pointercancel", endPointer);
bodyLayer.addEventListener("lostpointercapture", endPointer);

/*
 * 保存用キャンバスにパネルと衣装を重ねてPNG出力します。
 * 画面上の座標を保存画像の座標に変換します。
 */
async function savePhoto() {
  if (!captured) {
    setStatus("先に撮影してください。");
    return;
  }

  if (!selectedBodyImage) {
    setStatus("先に衣装を選んでください。");
    return;
  }

  saveButton.disabled = true;
  setStatus("写真を作成しています…");

  try {
    const exportCanvas = document.createElement("canvas");
    exportCanvas.width = photoCanvas.width;
    exportCanvas.height = photoCanvas.height;

    const ctx = exportCanvas.getContext("2d");

    /* 撮影したカメラ画像 */
    ctx.drawImage(photoCanvas, 0, 0);

    const scaleX = exportCanvas.width / stage.clientWidth;
    const scaleY = exportCanvas.height / stage.clientHeight;

    /* 顔出しパネル */
    if (panelImage.complete && panelImage.naturalWidth > 0) {
      ctx.drawImage(
        panelImage,
        panelBase.x * scaleX,
        panelBase.y * scaleY,
        panelBase.width * scaleX,
        panelBase.height * scaleY
      );
    }

    /* 衣装 */
    const centerX =
      (bodyTransform.x + bodyTransform.width * bodyTransform.scale / 2) * scaleX;

    const centerY =
      (bodyTransform.y + bodyTransform.height * bodyTransform.scale / 2) * scaleY;

    const bodyWidth = bodyTransform.width * bodyTransform.scale * scaleX;
    const bodyHeight = bodyTransform.height * bodyTransform.scale * scaleY;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(bodyTransform.rotation);
    ctx.drawImage(
      selectedBodyImage,
      -bodyWidth / 2,
      -bodyHeight / 2,
      bodyWidth,
      bodyHeight
    );
    ctx.restore();

    const blob = await new Promise((resolve, reject) => {
      exportCanvas.toBlob((result) => {
        if (result) resolve(result);
        else reject(new Error("PNG画像を作成できませんでした。"));
      }, "image/png");
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    const now = new Date();
    const stamp =
      now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, "0") +
      String(now.getDate()).padStart(2, "0") + "_" +
      String(now.getHours()).padStart(2, "0") +
      String(now.getMinutes()).padStart(2, "0") +
      String(now.getSeconds()).padStart(2, "0");

    link.href = url;
    link.download = "halloween_photo_" + stamp + ".png";
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 10000);

    setStatus("写真を作成しました。保存先を確認してください。");
  } catch (error) {
    console.error(error);
    setStatus("写真を保存できませんでした。もう一度お試しください。");
  } finally {
    saveButton.disabled = false;
  }
}

/* 撮り直し */
function retakePhoto() {
  captured = false;
  selectedBodyImage = null;
  selectedBodyName = "";

  bodyTransform = {
    x: 0,
    y: 0,
    scale: 1,
    rotation: 0,
    width: 0,
    height: 0
  };

  activePointers.clear();
  gestureStart = null;

  stage.classList.remove("show-photo");
  bodyLayer.removeAttribute("src");
  bodyLayer.style.display = "none";

  bodySection.classList.add("hidden");
  captureButton.classList.remove("hidden");
  captureButton.disabled = !cameraStarted;

  retakeButton.classList.add("hidden");
  saveButton.classList.add("hidden");

  emptyMessage.classList.add("hidden");

  handleResize();
  setStatus("位置を確認して、もう一度撮影してください。");
}

/* ボタン */
startButton.addEventListener("click", startCamera);
captureButton.addEventListener("click", capturePhoto);
retakeButton.addEventListener("click", retakePhoto);
saveButton.addEventListener("click", savePhoto);

/* パネル画像を読み込む */
panelImage.onload = () => {
  handleResize();
};

panelImage.onerror = () => {
  setStatus("顔出しパネル画像を読み込めません。ファイル名と配置を確認してください。");
};

panelImage.src = PANEL_SRC;

/* 画面回転・サイズ変更への対応 */
window.addEventListener("resize", handleResize);
window.addEventListener("orientationchange", () => {
  setTimeout(handleResize, 250);
});

/* 初期表示 */
handleResize();
</script>
</body>
</html>

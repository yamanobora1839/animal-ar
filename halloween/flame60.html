<body>
<div class="app">
  <header>
    <h1>ハロウィン顔出しフォト</h1>
    <p class="description">好きな衣装を選んで、記念写真を撮ろう！</p>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="photoCanvas"></canvas>

      <img id="panelLayer" class="layer panel-layer" alt="" draggable="false">
      <img id="bodyLayer" class="layer body-layer" alt="" draggable="false">

      <div class="empty" id="emptyMessage">
        「撮影を開始」を押して、カメラを起動してください。
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="startButton">撮影を開始</button>
    <button id="captureButton" disabled>撮影</button>
    <button id="reselectButton" class="secondary hidden">衣装を選び直す</button>
    <button id="retakeButton" class="secondary hidden">撮り直す</button>
    <button id="saveButton" class="hidden">写真を保存</button>
  </div>

  <section class="section hidden" id="bodySection">
    <h2>衣装を選ぶ</h2>
    <p class="hint">衣装を選ぶと一覧が閉じます。写真全体を見ながら位置や大きさを調整できます。</p>

    <div class="categories" id="categories">
      <button class="active" data-category="mahoutukai">魔法使い</button>
      <button data-category="majo">魔女</button>
      <button data-category="mahou_child">魔法の子ども</button>
    </div>

    <div class="body-grid" id="bodyGrid"></div>

    <p class="small">衣装は1本指で移動、2本指で拡大・縮小・回転できます。</p>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>
</div>

<script>
"use strict";

const ASSET_DIR = "./";
const PANEL_SRC = "./halloween_face_panel.png";

const CATEGORIES = {
  mahoutukai: {
    label: "魔法使い",
    prefix: "body_mahoutukai",
    count: 8
  },
  majo: {
    label: "魔女",
    prefix: "body_majo",
    count: 8
  },
  mahou_child: {
    label: "魔法の子ども",
    prefix: "body_mahou_child",
    count: 6
  }
};

const stage = document.getElementById("stage");
const video = document.getElementById("video");
const photoCanvas = document.getElementById("photoCanvas");
const panelLayer = document.getElementById("panelLayer");
const bodyLayer = document.getElementById("bodyLayer");
const emptyMessage = document.getElementById("emptyMessage");

const startButton = document.getElementById("startButton");
const captureButton = document.getElementById("captureButton");
const reselectButton = document.getElementById("reselectButton");
const retakeButton = document.getElementById("retakeButton");
const saveButton = document.getElementById("saveButton");

const bodySection = document.getElementById("bodySection");
const categoriesElement = document.getElementById("categories");
const bodyGrid = document.getElementById("bodyGrid");
const statusElement = document.getElementById("status");

let cameraStream = null;
let cameraStarted = false;
let captured = false;
let currentCategory = "mahoutukai";
let selectedBodyImage = null;
let selectedBodyName = "";

const panelImage = new Image();

let panelBase = {
  x: 0,
  y: 0,
  width: 0,
  height: 0
};

let bodyTransform = {
  x: 0,
  y: 0,
  scale: 1,
  rotation: 0,
  width: 0,
  height: 0
};

const panelPointers = new Map();
let panelGestureStart = null;

const bodyPointers = new Map();
let bodyGestureStart = null;

let previousStageSize = {
  width: 0,
  height: 0
};

function setStatus(message) {
  statusElement.textContent = message;
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();

    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("画像を読み込めません: " + src));
    image.src = src;
  });
}

/* 顔出しパネル */
function calculatePanelSize() {
  if (!panelImage.complete || !panelImage.naturalWidth) return;

  const w = stage.clientWidth;
  const h = stage.clientHeight;
  if (!w || !h) return;

  const ratio = Math.min(
    w * 0.98 / panelImage.naturalWidth,
    h * 0.98 / panelImage.naturalHeight
  );

  panelBase.width = panelImage.naturalWidth * ratio;
  panelBase.height = panelImage.naturalHeight * ratio;
}

function applyPanelPosition() {
  panelLayer.style.left = panelBase.x + "px";
  panelLayer.style.top = panelBase.y + "px";
  panelLayer.style.width = panelBase.width + "px";
  panelLayer.style.height = panelBase.height + "px";
}

function layoutPanelInitial() {
  calculatePanelSize();

  panelBase.x = (stage.clientWidth - panelBase.width) / 2;
  panelBase.y = (stage.clientHeight - panelBase.height) / 2;

  applyPanelPosition();
}

function panelPointerCenter() {
  const points = Array.from(panelPointers.values());

  return {
    x: points.reduce((sum, p) => sum + p.x, 0) / points.length,
    y: points.reduce((sum, p) => sum + p.y, 0) / points.length
  };
}

function panelPointerDistance() {
  const points = Array.from(panelPointers.values());
  if (points.length < 2) return 0;

  return Math.hypot(
    points[0].x - points[1].x,
    points[0].y - points[1].y
  );
}

function startPanelGesture() {
  if (panelPointers.size < 2) {
    panelGestureStart = null;
    return;
  }

  panelGestureStart = {
    x: panelBase.x,
    y: panelBase.y,
    width: panelBase.width,
    height: panelBase.height,
    center: panelPointerCenter(),
    distance: panelPointerDistance()
  };
}

panelLayer.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  panelLayer.setPointerCapture(event.pointerId);

  const rect = stage.getBoundingClientRect();

  panelPointers.set(event.pointerId, {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  });

  startPanelGesture();
});

panelLayer.addEventListener("pointermove", (event) => {
  if (!panelPointers.has(event.pointerId)) return;

  event.preventDefault();

  const rect = stage.getBoundingClientRect();

  panelPointers.set(event.pointerId, {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  });

  if (!panelGestureStart || panelPointers.size < 2) return;
  if (panelGestureStart.distance <= 0) return;

  const center = panelPointerCenter();
  const ratio = panelPointerDistance() / panelGestureStart.distance;
  const scale = Math.max(0.3, Math.min(4, ratio));

  const newWidth = panelGestureStart.width * scale;
  const newHeight = panelGestureStart.height * scale;

  panelBase.width = newWidth;
  panelBase.height = newHeight;

  panelBase.x =
    panelGestureStart.x +
    center.x - panelGestureStart.center.x -
    (newWidth - panelGestureStart.width) / 2;

  panelBase.y =
    panelGestureStart.y +
    center.y - panelGestureStart.center.y -
    (newHeight - panelGestureStart.height) / 2;

  applyPanelPosition();
});

function endPanelGesture(event) {
  panelPointers.delete(event.pointerId);

  if (panelPointers.size < 2) {
    panelGestureStart = null;
  } else {
    startPanelGesture();
  }
}

panelLayer.addEventListener("pointerup", endPanelGesture);
panelLayer.addEventListener("pointercancel", endPanelGesture);
panelLayer.addEventListener("lostpointercapture", endPanelGesture);

/* 画面サイズ変更 */
function handleResize() {
  const oldWidth = previousStageSize.width;
  const oldHeight = previousStageSize.height;

  const centerX = oldWidth
    ? (panelBase.x + panelBase.width / 2) / oldWidth
    : 0.5;

  const centerY = oldHeight
    ? (panelBase.y + panelBase.height / 2) / oldHeight
    : 0.5;

  const width = stage.clientWidth;
  const height = stage.clientHeight;
  if (!width || !height) return;

  if (!captured && panelImage.complete && panelImage.naturalWidth) {
    calculatePanelSize();

    panelBase.x = oldWidth
      ? centerX * width - panelBase.width / 2
      : (width - panelBase.width) / 2;

    panelBase.y = oldHeight
      ? centerY * height - panelBase.height / 2
      : (height - panelBase.height) / 2;

    applyPanelPosition();
  }

  previousStageSize = { width, height };
}

/* 背面カメラ */
async function startCamera() {
  if (cameraStarted) return;

  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("カメラを利用できません。HTTPSでページを開いてください。");
    return;
  }

  startButton.disabled = true;
  setStatus("カメラを起動しています…");

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    video.srcObject = cameraStream;

    await new Promise((resolve, reject) => {
      if (video.readyState >= 1 && video.videoWidth > 0) {
        resolve();
      } else {
        video.onloadedmetadata = resolve;
        video.onerror = () => reject(new Error("カメラ映像を読み込めません。"));
      }
    });

    await video.play();

    cameraStarted = true;
    captureButton.disabled = false;
    emptyMessage.classList.add("hidden");

    handleResize();
    setStatus("位置を確認して撮影してください。");
  } catch (error) {
    console.error(error);

    setStatus(
      error.name === "NotAllowedError"
        ? "カメラの使用が許可されていません。ブラウザの設定を確認してください。"
        : "カメラを起動できませんでした。カメラの使用許可を確認してください。"
    );

    startButton.disabled = false;
  }
}

/* 画面表示と同じ範囲でカメラ画像を切り抜く */
function drawVideoCover(ctx, outputWidth, outputHeight) {
  const sourceWidth = video.videoWidth;
  const sourceHeight = video.videoHeight;

  if (!sourceWidth || !sourceHeight) {
    throw new Error("カメラ映像の準備ができていません。");
  }

  const sourceRatio = sourceWidth / sourceHeight;
  const outputRatio = outputWidth / outputHeight;

  let sx = 0;
  let sy = 0;
  let sw = sourceWidth;
  let sh = sourceHeight;

  if (sourceRatio > outputRatio) {
    sw = sourceHeight * outputRatio;
    sx = (sourceWidth - sw) / 2;
  } else {
    sh = sourceWidth / outputRatio;
    sy = (sourceHeight - sh) / 2;
  }

  ctx.drawImage(
    video,
    sx, sy, sw, sh,
    0, 0, outputWidth, outputHeight
  );
}

/* 撮影 */
function capturePhoto() {
  if (!cameraStarted || !video.videoWidth) {
    setStatus("先にカメラを起動してください。");
    return;
  }

  const width = stage.clientWidth;
  const height = stage.clientHeight;
  if (!width || !height) return;

  const stageRatio = width / height;
  const sourceRatio = video.videoWidth / video.videoHeight;

  let outputWidth;
  let outputHeight;

  if (sourceRatio > stageRatio) {
    outputHeight = video.videoHeight;
    outputWidth = Math.round(outputHeight * stageRatio);
  } else {
    outputWidth = video.videoWidth;
    outputHeight = Math.round(outputWidth / stageRatio);
  }

  photoCanvas.width = Math.max(1, outputWidth);
  photoCanvas.height = Math.max(1, outputHeight);

  try {
    drawVideoCover(
      photoCanvas.getContext("2d"),
      photoCanvas.width,
      photoCanvas.height
    );
  } catch (error) {
    console.error(error);
    setStatus("撮影に失敗しました。もう一度お試しください。");
    return;
  }

  captured = true;
  stage.classList.add("show-photo");

  captureButton.classList.add("hidden");
  reselectButton.classList.remove("hidden");
  retakeButton.classList.remove("hidden");
  saveButton.classList.remove("hidden");

  bodySection.classList.remove("hidden");
  bodyLayer.style.display = "none";

  setStatus("衣装を選んでください。選ぶと一覧が自動的に閉じます。");
  renderBodyChoices(currentCategory);
}

/* 衣装一覧 */
function renderBodyChoices(category) {
  currentCategory = category;
  bodyGrid.innerHTML = "";

  const data = CATEGORIES[category];

  for (let i = 1; i <= data.count; i++) {
    const filename = data.prefix + String(i).padStart(2, "0") + ".png";
    const src = ASSET_DIR + filename;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "body-option";
    button.setAttribute("aria-label", data.label + " " + i);

    const image = document.createElement("img");
    image.src = src;
    image.alt = data.label + " " + i;
    image.loading = "lazy";
    image.draggable = false;

    const label = document.createElement("span");
    label.textContent = data.label + " " + i;

    button.append(image, label);

    if (selectedBodyName === filename) {
      button.classList.add("active");
    }

    button.addEventListener("click", async () => {
      try {
        const loadedImage = await loadImage(src);

        selectedBodyImage = loadedImage;
        selectedBodyName = filename;

        const stageWidth = stage.clientWidth;
        const stageHeight = stage.clientHeight;
        const targetHeight = stageHeight * 0.72;
        const scale = targetHeight / loadedImage.naturalHeight;

        bodyTransform.width = loadedImage.naturalWidth * scale;
        bodyTransform.height = loadedImage.naturalHeight * scale;
        bodyTransform.scale = 1;
        bodyTransform.rotation = 0;
        bodyTransform.x = (stageWidth - bodyTransform.width) / 2;
        bodyTransform.y = (stageHeight - bodyTransform.height) / 2;

        bodyLayer.src = src;
        bodyLayer.style.display = "block";

        applyBodyTransform();
        renderBodyChoices(category);

        /*
         * 重要：衣装を選択したら一覧を閉じる。
         * 写真全体を見ながら衣装を調整できる。
         */
        bodySection.classList.add("hidden");
        reselectButton.classList.remove("hidden");

        setStatus("衣装を調整できます。選び直す場合は「衣装を選び直す」を押してください。");
      } catch (error) {
        console.error(error);
        setStatus("衣装画像を読み込めませんでした: " + filename);
      }
    });

    bodyGrid.appendChild(button);
  }
}

/* カテゴリー切り替え */
categoriesElement.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-category]");
  if (!button) return;

  const category = button.dataset.category;
  if (!CATEGORIES[category]) return;

  categoriesElement.querySelectorAll("button").forEach((item) => {
    item.classList.toggle("active", item === button);
  });

  renderBodyChoices(category);
});

/* 衣装の表示 */
function applyBodyTransform() {
  bodyLayer.style.left = bodyTransform.x + "px";
  bodyLayer.style.top = bodyTransform.y + "px";

  bodyLayer.style.width =
    bodyTransform.width * bodyTransform.scale + "px";

  bodyLayer.style.height =
    bodyTransform.height * bodyTransform.scale + "px";

  bodyLayer.style.transformOrigin = "center center";
  bodyLayer.style.transform = "rotate(" + bodyTransform.rotation + "rad)";
}

function bodyPointerCenter() {
  const points = Array.from(bodyPointers.values());

  return {
    x: points.reduce((sum, p) => sum + p.x, 0) / points.length,
    y: points.reduce((sum, p) => sum + p.y, 0) / points.length
  };
}

function bodyPointerDistance() {
  const points = Array.from(bodyPointers.values());
  if (points.length < 2) return 0;

  return Math.hypot(
    points[0].x - points[1].x,
    points[0].y - points[1].y
  );
}

function bodyPointerAngle() {
  const points = Array.from(bodyPointers.values());
  if (points.length < 2) return 0;

  return Math.atan2(
    points[1].y - points[0].y,
    points[1].x - points[0].x
  );
}

function startBodyGesture() {
  if (bodyPointers.size === 0) {
    bodyGestureStart = null;
    return;
  }

  bodyGestureStart = {
    x: bodyTransform.x,
    y: bodyTransform.y,
    scale: bodyTransform.scale,
    rotation: bodyTransform.rotation,
    center: bodyPointerCenter(),
    distance: bodyPointerDistance(),
    angle: bodyPointerAngle()
  };
}

bodyLayer.addEventListener("pointerdown", (event) => {
  if (!captured || !selectedBodyImage) return;

  event.preventDefault();
  bodyLayer.setPointerCapture(event.pointerId);

  const rect = stage.getBoundingClientRect();

  bodyPointers.set(event.pointerId, {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  });

  startBodyGesture();
});

bodyLayer.addEventListener("pointermove", (event) => {
  if (!bodyPointers.has(event.pointerId) || !bodyGestureStart) return;

  event.preventDefault();

  const rect = stage.getBoundingClientRect();

  bodyPointers.set(event.pointerId, {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  });

  const center = bodyPointerCenter();

  if (bodyPointers.size === 1) {
    bodyTransform.x =
      bodyGestureStart.x + center.x - bodyGestureStart.center.x;

    bodyTransform.y =
      bodyGestureStart.y + center.y - bodyGestureStart.center.y;
  } else {
    const distance = bodyPointerDistance();
    const angle = bodyPointerAngle();

    if (bodyGestureStart.distance > 0) {
      bodyTransform.scale = Math.max(
        0.15,
        Math.min(
          5,
          bodyGestureStart.scale * distance / bodyGestureStart.distance
        )
      );
    }

    bodyTransform.rotation =
      bodyGestureStart.rotation + angle - bodyGestureStart.angle;

    bodyTransform.x =
      bodyGestureStart.x + center.x - bodyGestureStart.center.x;

    bodyTransform.y =
      bodyGestureStart.y + center.y - bodyGestureStart.center.y;
  }

  applyBodyTransform();
});

function endBodyGesture(event) {
  bodyPointers.delete(event.pointerId);
  startBodyGesture();
}

bodyLayer.addEventListener("pointerup", endBodyGesture);
bodyLayer.addEventListener("pointercancel", endBodyGesture);
bodyLayer.addEventListener("lostpointercapture", endBodyGesture);

/* 衣装一覧を再表示 */
function showBodyChoices() {
  if (!captured) return;

  bodySection.classList.remove("hidden");
  reselectButton.classList.add("hidden");

  setStatus("衣装を選び直してください。選択すると一覧が閉じます。");
}

/* 撮り直し */
function retakePhoto() {
  captured = false;
  selectedBodyImage = null;
  selectedBodyName = "";

  bodyTransform = {
    x: 0,
    y: 0,
    scale: 1,
    rotation: 0,
    width: 0,
    height: 0
  };

  bodyPointers.clear();
  bodyGestureStart = null;

  stage.classList.remove("show-photo");

  bodyLayer.removeAttribute("src");
  bodyLayer.style.display = "none";

  bodySection.classList.add("hidden");
  reselectButton.classList.add("hidden");
  retakeButton.classList.add("hidden");
  saveButton.classList.add("hidden");

  captureButton.classList.remove("hidden");
  captureButton.disabled = !cameraStarted;

  setStatus("位置を確認して、もう一度撮影してください。");
}

/* パネルと衣装を合成してPNG保存 */
async function savePhoto() {
  if (!captured) {
    setStatus("先に撮影してください。");
    return;
  }

  if (!selectedBodyImage) {
    setStatus("先に衣装を選んでください。");
    return;
  }

  saveButton.disabled = true;
  setStatus("写真を作成しています…");

  try {
    const exportCanvas = document.createElement("canvas");
    exportCanvas.width = photoCanvas.width;
    exportCanvas.height = photoCanvas.height;

    const ctx = exportCanvas.getContext("2d");
    if (!ctx) throw new Error("画像を作成できません。");

    ctx.drawImage(photoCanvas, 0, 0);

    const scaleX = exportCanvas.width / stage.clientWidth;
    const scaleY = exportCanvas.height / stage.clientHeight;

    /* 顔出しパネル */
    if (panelImage.complete && panelImage.naturalWidth > 0) {
      ctx.drawImage(
        panelImage,
        panelBase.x * scaleX,
        panelBase.y * scaleY,
        panelBase.width * scaleX,
        panelBase.height * scaleY
      );
    }

    /* 衣装 */
    const centerX =
      (bodyTransform.x +
       bodyTransform.width * bodyTransform.scale / 2) * scaleX;

    const centerY =
      (bodyTransform.y +
       bodyTransform.height * bodyTransform.scale / 2) * scaleY;

    const bodyWidth =
      bodyTransform.width * bodyTransform.scale * scaleX;

    const bodyHeight =
      bodyTransform.height * bodyTransform.scale * scaleY;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(bodyTransform.rotation);

    ctx.drawImage(
      selectedBodyImage,
      -bodyWidth / 2,
      -bodyHeight / 2,
      bodyWidth,
      bodyHeight
    );

    ctx.restore();

    const blob = await new Promise((resolve, reject) => {
      exportCanvas.toBlob((result) => {
        if (result) resolve(result);
        else reject(new Error("PNG画像を作成できませんでした。"));
      }, "image/png");
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const now = new Date();

    const stamp =
      now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, "0") +
      String(now.getDate()).padStart(2, "0") + "_" +
      String(now.getHours()).padStart(2, "0") +
      String(now.getMinutes()).padStart(2, "0") +
      String(now.getSeconds()).padStart(2, "0");

    link.href = url;
    link.download = "halloween_photo_" + stamp + ".png";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 10000);

    setStatus("写真を作成しました。保存先を確認してください。");
  } catch (error) {
    console.error(error);
    setStatus("写真を保存できませんでした。もう一度お試しください。");
  } finally {
    saveButton.disabled = false;
  }
}

/* ボタン */
startButton.addEventListener("click", startCamera);
captureButton.addEventListener("click", capturePhoto);
reselectButton.addEventListener("click", showBodyChoices);
retakeButton.addEventListener("click", retakePhoto);
saveButton.addEventListener("click", savePhoto);

/* パネル画像読み込み */
panelImage.onload = () => {
  panelLayer.src = PANEL_SRC;
  layoutPanelInitial();
  handleResize();
};

panelImage.onerror = () => {
  setStatus("顔出しパネル画像を読み込めません。ファイル名と配置を確認してください。");
};

panelImage.src = PANEL_SRC;
panelLayer.src = PANEL_SRC;

window.addEventListener("resize", handleResize);

window.addEventListener("orientationchange", () => {
  setTimeout(handleResize, 250);
});

handleResize();
</script>
</body>
